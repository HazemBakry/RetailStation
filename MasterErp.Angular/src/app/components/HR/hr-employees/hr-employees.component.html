<div class="employee-card card radius-10 border-0 card-shadow mb-4">
  <div class="card-body pb-5">
    <div class="employee-card-header d-flex align-items-center flex-wrap mb-5">
      <div class="employee-image mb-2 me-4">
        <img src="../../../../assets/images/default-image.png" class="emp-img" alt="default-image" loading="lazy" />
      </div>
      <div class="employee-info">
        <h3 class="mb-2 d-flex align-items-center">
          <span class="fw-bold me-2">حازم بكرى</span>
          <span class="tag active fs-6 rounded shadow-sm px-2 py-1">نشيط</span>
        </h3>
        <div class="d-flex align-items-center fs-5 mb-1">
          <i class="uil uil-postcard main-color"></i>
          <span class="ms-2">المدير العام</span>
        </div>
        <div class="d-flex align-items-center fs-6">
          <i class="uil uil-map-marker main-color"></i>
          <span class="ms-2">القاهرة</span>
        </div>
      </div>
    </div>
    <div class="employee-card-content card-shadow bg-light border mb-3">
      <div class="employee-card-tabs d-flex mb-5">
        <div class="employee-tab-item" [class.active]="active === 1" (click)="onActive(1)">
          <i class="uil uil-user"></i>
          <span>البيانات الأساسية</span>
        </div>
        <div class="employee-tab-item" [class.active]="active === 2" (click)="onActive(2)">
          <i class="uil uil-user"></i>
          <span>جواز السفر</span>
        </div>
        <div class="employee-tab-item" [class.active]="active === 3" (click)="onActive(3)">
          <i class="uil uil-user"></i>
          <span>بيانات العقد</span>
        </div>
        <div class="employee-tab-item" [class.active]="active === 4" (click)="onActive(4)">
          <i class="uil uil-user"></i>
          <span>بيانات اخرى</span>
        </div>
      </div>
      <div class="employee-card-tabs-content px-4 pb-2">
        <ng-container *ngIf="active == 1">

        <ng-container *ngIf="active == 3">
          <div class="employee-card-body row mb-3">
            <div class="col-xl-5">
              <div class="form-floating mb-3">

          <div class="employee-card-body row">

            </div>

            <div class="col-xl-5">
              <div class="form-floating mb-3">
                <input type="text" class="form-control" id="floatingInput3" placeholder="any">

            <div class="col-xl-5">
              <div class="form-floating mb-3">

            </div>

            <div class="col-xl-5">

                <label for="floatingInput5">رقم التلفون</label>
              </div>
            </div>
            <div class="col-xl-1"></div>
            <div class="col-xl-5">

            </div>

            <div class="col-xl-5">

            <div class="col-xl-5">

<ng-template #detailsSidepanel let-offcanvas style="width: 817px;">
  <div class="offcanvas-header pb-0">
    <div>
      <h4 class="offcanvas-title m-0 d-flex align-items-center w-100"><i
          class="fas fa-history fa-2x main-color me-2"></i> التفاصيل</h4>
    </div>
    <button type="button" class="btn bg-danger text-white rounded" aria-label="Close" (click)="offcanvas.dismiss()">
      <i class="fas fa-times"></i>
    </button>
  </div>
  <div class="offcanvas-body pt-0">
    <div class="table-responsive">
      <table class="table align-middle table-blue mb-0 table-hover">
        <thead class="table-light">
          <tr>
            <th>عدد سنوات العمل</th>
            <th>تاريخ بداية العقد</th>
            <th>تاريخ انتهاء العقد</th>
            <th>الاجازات</th>
            <th>عدد ايام العمل</th>
            <th>الاجازة القادمة</th>
          </tr>
        </thead>
      </table>
    </div>
  </div>
</ng-template>
