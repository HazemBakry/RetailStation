<app-breadcrumb [TitleList]="TitleList"></app-breadcrumb>

<div class="inputs-wrapper border rounded bg-white mb-3">
    <!-- <div class="inputs-sec-title fw-semibold fs-16 px-3 py-2 border-bottom mb-2">
        الحضور والانصراف
    </div> -->
    <div class="inputs-sec-content px-3 py-2">

        <div class="row gy-3">
            <div class="col-lg-3">
                <div class="mb-2">
                    <label class="form-label d-flex align-items-center gap-2">
                        اسم الموظف
                        <span class="text-danger">*</span>
                    </label>
                    <app-general-selector [(ngModel)]="selectedEmployeeId" [data]="employeeSelectorData"
                        [placeholder]="'اسم الموظف'" [showSearch]="true"></app-general-selector>
                </div>
            </div>
            <div class="col-lg-2">
                <div class="mb-2">
                    <label class="form-label d-flex align-items-center gap-2">
                        نوع العهدة
                        <span class="text-danger">*</span>
                    </label>
                    <app-general-selector [(ngModel)]="selectedFinancialCustodyTypeId" [data]="financialCustodyTypesSelectorData"
                        [placeholder]="'نوع العهدة'" [showSearch]="true"></app-general-selector>
                </div>
            </div>
            <div class="col-lg-2">
                <div class="mb-2">
                    <label class="form-label d-flex align-items-center gap-2">
                        الحالة
                        <span class="text-danger">*</span>
                    </label>
                    <app-general-selector [(ngModel)]="selectedStatusId" [data]="workflowStatusSelectorData"
                        [placeholder]="'الحالة'" [showSearch]="true"></app-general-selector>
                </div>
            </div>
            <div class="col-lg-2">
                <div class="mb-2">
                    <label class="form-label d-flex align-items-center gap-2">
                        من تاريخ
                        <span class="text-danger">*</span>
                    </label>
                    <input [(ngModel)]="fromDate" type="date" autocomplete="off" class="form-control nw-form-input" />
                </div>
            </div>
            <div class="col-lg-2">
                <div class="mb-2">
                    <label class="form-label d-flex align-items-center gap-2">
                        الي تاريخ
                        <span class="text-danger">*</span></label>
                    <input [(ngModel)]="toDate" type="date" autocomplete="off" class="form-control nw-form-input" />
                </div>
            </div>

        </div>
    </div>

    <div class="inputs-sec-title fw-semibold fs-16 px-3 py-2 border-top">
        <button class="btn btn-primary me-2" [disabled]="showLoader" (click)="onSearch()">
            <i class="fas fa-search"></i>
            <span class="ms-2">بحث</span>
        </button>
        <button [disabled]="showExportLoader" (click)="exportData()"
            class="btn  btn-outline-success gap-2 border rounded px-3 me-2">
            <i class="fas fa-file-download"></i>
            <span>تصدير CSV</span>
        </button>
        <button class="btn btn-table-action  gap-2 border rounded px-3 me-2">
            <i class="fas fa-print fs-7"></i>
            <span>طباعة</span>
        </button>
    </div>
</div>

<div class="table-card border radius-10 overflow-hidden shadow-sm">
    <div
        class="align-items-center border-bottom d-flex flex-wrap justify-content-between p-3 table-card-title bg-light">
        <div class="col-md-8 mb-2">
            <div class="d-flex align-items-center gap-2">

            </div>
        </div>
        <div class="col-md-4 mb-2">
            <app-erp-pagination (pageChanged)="pageChanged($event)" [currentPage]="pagedResponseModel.currentPage"
                [pageSize]="pagedResponseModel.pageSize"
                [totalCount]="pagedResponseModel.totalCount"></app-erp-pagination>
        </div>



        <div class="col-md-12 mt-3">
            <div class="d-flex align-items-center">
                <!-- <ng-container>
                    <app-erp-filters (filterChanged)="filterChecked($event)"
                        [searchPlaceholder]="'البحث  ...'"></app-erp-filters>
                </ng-container> -->
            </div>
        </div>
    </div>
    <div class="p-3 bg-white">
        <div class="table-responsive shadow-sm radius-10">
            <table class="table table-card-table table-borderless table-middle table-hover bg-transparent m-0 ">
                <thead class="table-light">
                    <tr>
                         <th>اسم الموظف</th>
                        <th>نوع العهدة</th>
                        <th>التاريخ</th>
                        <th>القيمة</th>
                        <th>الحالة</th>
                        <th>ملاحظات</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let item of pagedResponseModel.results">
                        <td>{{item.employeeNameAR ?? item.employeeNameEN}}</td>
                        <td>{{item.financialCustodyTypeNameAR ?? item.financialCustodyTypeNameEN}}</td>
                        <td>{{item.executionDate | date}}</td>
                        <td>{{item.moneyAmount}}</td>
                        <td>
                            <span appWorkflowStatus [id]="item.workflowStatusId" [nameEN]="item?.workflowStatusNameEN"
                                [nameAR]="item?.workflowStatusNameAR">
                            </span>
                        </td>
                        <td>{{item.notes}}</td>
                    </tr>
                    <tr *ngIf="!pagedResponseModel.results.length || showLoader">
                        <td colspan="6" class="text-right">
                            <app-empty-data [showEmptyData]="!pagedResponseModel.results.length&&!showLoader"
                                [showLoader]="showLoader"></app-empty-data>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>



<ngx-loading [show]="showLoader"></ngx-loading>
