<button (click)="openSidePanel(detailsSidePanel)"
    class="button-table-action btn-edit d-flex align-items-center justify-content-center gap-2 me-2">
    <i class="uil uil-info"></i>
    <span>تفاصيل</span>
</button>
<ng-template #detailsSidePanel let-offcanvas>

    <div class="offcanvas-header justify-content-between gap-3 fs-4 border-bottom py-3">
        <div class="d-flex align-items-center gap-2">
            <i class="fas fa-store offcanvas-header-icon"></i>
            <span>تفاصيل السلفة</span>
        </div>
        <div class="cursor-pointer text-danger fs-2" (click)="offcanvas.dismiss()">
            <i class="uil uil-times-circle"></i>
        </div>
    </div>
    <div class="offcanvas-body pt-4 bg-light">
        <div class="card card-with-table border shadow-none">
            <!-- <div class="card-header bg-white border-bottom d-flex align-items-center justify-content-start">

            </div> -->

            <div class="card-body">
                <div class="row p-2">
                    <div class="col-md-8">
                        <!-- <div class="d-flex align-items-center flex-wrap">
                    <div class="search-box position-relative mb-2">
                        <button class="btn btn-primary mb-2" (click)="openNewSidePanel(AddModal)">
                            <span class="me-2">إنشاء سلفة</span>
                            <i class="uil uil-plus-circle"></i>
                        </button>
                    </div>
                </div> -->
                    </div>
                    <div class="col-md-4">
                        <app-erp-pagination (pageChanged)="pageChanged($event)"
                            [currentPage]="employeeAdvanceResponse.currentPage"
                            [pageSize]="employeeAdvanceResponse.pageSize"
                            [totalCount]="employeeAdvanceResponse.totalCount"></app-erp-pagination>
                    </div>
                </div>
                <!-- <h5 class="mb-3 fw-bold">Table</h5> -->
                <div class="table-responsive shadow-sm radius-10 table-vp-height">
                    <table class="table table-card-table table-borderless table-middle table-hover bg-transparent m-0">
                        <thead class="table-light">
                            <tr>
                                <th>اسم الموظف</th>
                                <th>رقم السلفة </th>
                                <th>نوع السلفة</th>
                                <th>تاريخ التنفيذ</th>
                                <th>قيمة القسـط</th>
                                <th>الحالة</th>
                                <th>ملاحظات</th>
                                <!-- <th>العمليات</th> -->
                            </tr>
                        </thead>
                        <tbody>
                            <tr *ngFor="let item of employeeAdvanceResponse.results">
                                <td>{{item.employeeName}}</td>
                                <td>{{item.advanceNumber}}</td>
                                <td>{{item.advanceTypeNameAR ??item.advanceTypeNameEN}}</td>
                                <td>{{item.executionDate | date}}</td>
                                <td>{{item.moneyAmount}}</td>
                                <td>
                                    <span appWorkflowStatus [id]="item.workflowStatusId"
                                        [nameEN]="item?.workflowStatusNameEN" [nameAR]="item?.workflowStatusNameAR">
                                    </span>
                                </td>
                                <td class="word-break">{{item.notes}}</td>
                                <!-- <td>
                            <div class="d-flex align-items-center justify-content-center text-center">
                                <button class="button-table-action btn-edit d-flex align-items-center justify-content-center gap-2 me-2" (click)="openNewSidePanel(addModal,item)">
                                    <i class="uil uil-pen"></i>
                                    <span>تعديل التاريخ</span>
                                </button>
                                <button class="button-table-action btn-delete d-flex align-items-center justify-content-center gap-2" (click)="openDeleteModal(deleteModal,item.advancePaymentId)">
                                    <i class="uil uil-trash-alt"></i>
                                    <span>الغاء</span>
                                </button>
                            </div>
                        </td> -->
                            </tr>
                            <tr *ngIf="!employeeAdvanceResponse.results.length || showLoader">
                                <td colspan="8" class="text-right">
                                    <app-empty-data
                                        [showEmptyData]="!employeeAdvanceResponse.results.length&&!showLoader"
                                        [showLoader]="showLoader"></app-empty-data>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>
</ng-template>
