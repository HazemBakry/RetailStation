<div class="employee-card-body row">
    <form [formGroup]="formGroup" autocomplete="off">
        <div class="employee-card-body row">

            <div class="col-xl-5">
                <div class="form-floating mb-3">
                    <input type="text" formControlName="iqamaNumber" class="form-control" id="floatingInput1" placeholder="any">
                    <label for="floatingInput5">رقم الاقامة</label>
                    <div *ngIf="formErrors.iqamaNumber" class="text-danger  font-small-3 m-03">
                        {{formErrors.iqamaNumber}}
                    </div>
                </div>
            </div>
            <div class="col-xl-1"></div>
            <div class="col-xl-5 mb-3">
                <!-- <label class="form-label">مكان الاصدار</label> -->
                <app-drop-down-form-control formControlName="iqamaIssuePlaceId" [placeholder]="'مكان الاصدار'" [data]="iqamaIssuePlacesSelectorData"></app-drop-down-form-control>
                <div *ngIf="formErrors.iqamaIssuePlaceId" class="text-danger  font-small-3 m-03">
                    {{formErrors.iqamaIssuePlaceId}}
                </div>
            </div>
            <div class="col-xl-1"></div>
            <div class="col-xl-5">
                <div class="form-floating mb-3">
                    <input type="date" formControlName="iqamaIssueDate" class="form-control" id="floatingInput1" placeholder="any">
                    <label for="floatingInput6">تاريخ الاصدار</label>
                    <div *ngIf="formErrors.iqamaIssueDate" class="text-danger  font-small-3 m-03">
                        {{formErrors.iqamaIssueDate}}
                    </div>
                </div>
            </div>
            <div class="col-xl-1"></div>
            <div class="col-xl-5">
                <div class="form-floating mb-3">
                    <input type="date" formControlName="iqamaExpireDate" class="form-control" id="floatingInput1" placeholder="any">
                    <label for="floatingInput7">تاريخ الانتهاء</label>
                    <div *ngIf="formErrors.iqamaExpireDate" class="text-danger  font-small-3 m-03">
                        {{formErrors.iqamaExpireDate}}
                    </div>
                </div>
            </div>
            <div class="col-xl-1"></div>
            <div class="col-xl-5 mb-3">
                <!-- <label class="form-label">عمل الاقامة</label> -->
                <app-drop-down-form-control formControlName="iqamaJobId" [placeholder]="'عمل الاقامة'" [data]="iqamaJobselectorData"></app-drop-down-form-control>
                <div *ngIf="formErrors.iqamaJobId" class="text-danger  font-small-3 m-03">
                    {{formErrors.iqamaJobId}}
                </div>
            </div>
            <!-- <div class="col-xl-1"></div>
            <div class="col-xl-5">
                <div class="form-floating mb-3">
                    <input type="text" formControlName="visaNumber" class="form-control" id="floatingInput1" placeholder="any">
                    <label for="floatingInput5">رقم التأشيرة</label>
                    <div *ngIf="formErrors.visaNumber" class="text-danger  font-small-3 m-03">
                        {{formErrors.visaNumber}}
                    </div>
                </div>

            </div>
            <div class="col-xl-1"></div>
            <div class="col-xl-5">
                <div class="form-floating mb-3">
                    <input type="date" formControlName="visaIssueDate" class="form-control" id="floatingInput1" placeholder="any">
                    <label for="floatingInput5">تاريخ اصدار التأشيرة</label>
                    <div *ngIf="formErrors.visaIssueDate" class="text-danger  font-small-3 m-03">
                        {{formErrors.visaIssueDate}}
                    </div>
                </div>
            </div> -->
        </div>
    </form>
    <div class="d-flex justify-content-left">
        <button [disabled]="showAddLoader" (click)="saveEmployeeVerificationInfo()" class="btn btn-primary m-2">
            <span *ngIf="!isUpdate" class="ms-3">إضافة</span>
            <span *ngIf="isUpdate" class="ms-3">تعديل</span>
        </button>
        <button (click)="initNewForm()" class="btn btn-danger m-2">
            <span class="ms-3">إلغاء</span>
        </button>
    </div>
</div>
