<app-breadcrumb [TitleList]="TitleList"></app-breadcrumb>

<div class="inputs-wrapper border rounded bg-white mb-3">
    <div class="inputs-sec-title fw-semibold fs-16 px-3 py-2 border-bottom mb-2">
        <!-- الحضور والانصراف -->
    </div>
    <div class="inputs-sec-content px-3 py-2">

        <div class="row gy-3">
            <div class="col-lg-3">
                <div class="mb-2">
                    <label class="form-label d-flex align-items-center gap-2">
                        الفرع
                        <span class="text-danger">*</span>
                    </label>
                    <app-general-selector (valueChanged)="getSelectedBranch($event)" [data]="branchSelectorData" [placeholder]="'الفروع'" [showSearch]="true"></app-general-selector>
                </div>
            </div>
            <div class="col-lg-3">
                <div class="mb-2">
                    <label class="form-label d-flex align-items-center gap-2">
                        من تاريخ
                        <span class="text-danger">*</span>
                    </label>
                    <input type="date" autocomplete="off" class="form-control nw-form-input" />
                </div>
            </div>
            <div class="col-lg-3">
                <div class="mb-2">
                    <label class="form-label d-flex align-items-center gap-2">
                        الي تاريخ
                        <span class="text-danger">*</span></label>
                    <input type="date" autocomplete="off" class="form-control nw-form-input" />
                </div>
            </div>
            <div class="col-lg-3">
                <div class="mb-2">
                    <label class="form-label d-flex align-items-center gap-2">
                        مركز التكلفة
                        <span class="text-danger">*</span>
                    </label>
                    <app-general-selector [data]="employeeSelectorData" [placeholder]="'اسم الموظف'" [showSearch]="true"></app-general-selector>
                </div>
            </div>
        </div>
    </div>

    <div class="inputs-sec-title fw-semibold fs-16 px-3 py-2 border-top">
        <button class="btn btn-primary me-2" (click)="getAttendance_Data()">
            <i class="fas fa-search"></i>
            <span class="ms-2">بحث</span>
        </button>
        <!-- <button [disabled]="showExportLoader" (click)="exportData()"
            class="btn  btn-outline-success gap-2 border rounded px-3 me-2">
            <i class="fas fa-file-download"></i>
            <span>تصدير CSV</span>
        </button> -->
        <button class="btn btn-table-action  gap-2 border rounded px-3 me-2">
            <i class="fas fa-print fs-7"></i>
            <span>طباعة</span>
        </button>
        <!-- <button class="btn btn-secondary me-2" (click)="printData()">
            <i class="fas fa-print"></i>
            <span class="ms-2">طباعة</span>
        </button> -->
    </div>
</div>

<div class="inputs-wrapper border rounded bg-white mb-3">
    <div class="inputs-sec-title fw-semibold fs-16 px-3 py-2 border-bottom mb-2">
        <div class="table-responsive shadow-sm radius-10 ">
            <table class="table table-card-table table-borderless table-middle table-hover bg-transparent m-0 table-vp-height">
                <thead>
                    <tr>
                        <th>الرقم الوظيفى</th>
                        <th>اسم الموظف</th>
                        <th>الفرع</th>
                        <th>تاريخ الحضور</th>
                        <th>اليوم</th>
                        <th>الفترة الأولى</th>
                        <th>الفترة الثانية</th>
                        <th>إجمالى الوقت</th>
                        <th class="text-center"></th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let item of pagedResponseModel.results">
                        <td>{{item.code}}</td>
                        <td>{{item.fullNameAR}}</td>
                        <td>{{item.branchNameAR}}</td>
                        <td>{{item.attendanceDate}}</td>
                        <td>{{item.attendanceDay}}</td>
                        <td>{{item.firstShift}}</td>
                        <td>{{item.secondShift}}</td>
                        <td>{{item.totalTime}}</td>
                        <td>
                            <div class="d-flex align-items-center justify-content-center">
                                <div ngbDropdown container="body">
                                    <button class="btn-sm-action sm-action-dropdown" (click)="goToEmployeeDetails(item.employeeId)">
                                        <i class="fas fa-ellipsis-v"></i>
                                    </button>
                                    <!-- <div ngbDropdownMenu class="border">
                                        <button ngbDropdownItem (click)="cancelPaymentOrder(item.paymentOrderId)">اسقاط</button>
                                        <button ngbDropdownItem routerLink="/general-accounts/create-payment-receipt" [queryParams]="{PaymentOrderId:item.paymentOrderId}">انشاء سند
                                            الصرف</button>
                                    </div> -->
                                </div>
                            </div>
                            <!-- <div class="w-100 d-flex align-items-center justify-content-center">
                                <button (click)="CancelPaymentReceipt(item.paymentReceiptId)" class="button-table-action btn-delete d-flex align-items-center justify-content-center gap-2">
                                    <i class="uil uil-times"></i>
                                    <span>إلغاء</span>
                                </button>
                                <button class="btn btn-primary me-2">
                                    <i class="fas fa-edit"></i>
                                    <span class="ms-2">Edit</span>
                                </button>
                            </div> -->
                        </td>
                    </tr>
                    <tr *ngIf="!pagedResponseModel.results.length">
                        <td colspan="9" class="text-right">
                            <app-empty-data [showEmptyData]="!pagedResponseModel.results.length"></app-empty-data>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
