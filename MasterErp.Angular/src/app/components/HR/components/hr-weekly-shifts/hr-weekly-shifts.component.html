<div class="inputs-wrapper border rounded bg-white mb-3">
    <div class="inputs-sec-content px-3 py-2">


        <div class="row gy-3">
            <div class="col-lg-3">
                <div class="mb-2">
                    <label class="form-label d-flex align-items-center gap-2">
                        الفرع
                        <span class="text-danger">*</span>
                    </label>
                    <app-general-selector [(ngModel)]="selectedBranchId" [data]="branchSelectorData"
                        [placeholder]="'الفروع'" [showSearch]="true"></app-general-selector>
                </div>
            </div>
            <!-- <div class="col-lg-3">
                <div class="mb-2">
                    <label class="form-label d-flex align-items-center gap-2">
                        من تاريخ

                    </label>
                    <input [(ngModel)]="fromDate" type="date" autocomplete="off" class="form-control nw-form-input" />
                </div>
            </div>
            <div class="col-lg-3">
                <div class="mb-2">
                    <label class="form-label d-flex align-items-center gap-2">
                        الي تاريخ
                        <span class="text-danger">*</span></label>
                    <input [(ngModel)]="toDate" type="date" autocomplete="off" class="form-control nw-form-input" />
                </div>
            </div> -->
            <div class="col-lg-3">
                <div class="mb-2">
                    <label class="form-label d-flex align-items-center gap-2">
                        اسم الموظف
                        <span class="text-danger">*</span>
                    </label>
                    <app-general-selector [(ngModel)]="selectedEmployeeId" [data]="employeeSelectorData"
                        [placeholder]="'اسم الموظف'" [showSearch]="true"></app-general-selector>
                </div>
            </div>
        </div>
    </div>

    <div class="inputs-sec-title fw-semibold fs-16 px-3 py-2 border-top">
        <button class="btn btn-primary me-2" [disabled]="showLoader" (click)="search()">
            <i class="fas fa-search"></i>
            <span class="ms-2">بحث</span>
        </button>

        </button> -->
    </div>
</div>

<div class="card radius-10 border-0 card-shadow mb-4">
    <div class="card-body">
        <div class="row p-2">
            <div class="col-md-8">
                <div class="d-flex align-items-center flex-wrap">
                    <div class="search-box position-relative mb-2">
                        <!-- <button class="btn btn-primary mb-2" (click)="(AddModal)">
                            <span class="me-2">إنشاء </span>
                            <i class="uil uil-plus-circle"></i>
                        </button> -->
                    </div>
                    <!-- <ng-container *ngIf="filterList.length > 0">
                        <app-pos-filters [FilterList]="filterList" (filterChanged)="filterChecked($event)"></app-pos-filters>
                    </ng-container> -->
                </div>
            </div>
            <div class="col-md-4">
                <app-erp-pagination (pageChanged)="pageChanged($event)" [currentPage]="pagedResponseModel.currentPage"
                    [pageSize]="pagedResponseModel.pageSize"
                    [totalCount]="pagedResponseModel.totalCount"></app-erp-pagination>
            </div>
        </div>
        <div class="text-center mb-4">
            <h2 class="text-xl font-bold">السبت</h2>
            <p class="text-gray-500">2025-07-19</p>
        </div>
        <!-- <h5 class="mb-3 fw-bold">Table</h5> -->
        <div class="table-responsive shadow-sm radius-10 table-vp-height">
            <table class="table table-card-table table-borderless table-middle table-hover bg-transparent m-0 ">

                <thead>

                    <tr class="bg-gray-100 text-sm">
                        <th class="p-2 border">الكود</th>
                        <th class="p-2 border">اسم الموظف</th>
                        <ng-container *ngFor="let day of weekDays">
                            <th colspan="4" class="p-2 border">{{ day.name }}<br>{{ day.date }}</th>
                        </ng-container>
                    </tr>
                    <tr class="bg-gray-50 text-xs">
                        <th colspan="2"></th>
                        <ng-container *ngFor="let _ of weekDays">
                            <th class="p-1 border">1</th>
                            <th class="p-1 border">2</th>
                            <th class="p-1 border">3</th>
                            <th class="p-1 border">4</th>
                        </ng-container>
                    </tr>

                </thead>
                <tbody>
                    <tr *ngFor="let emp of pagedResponseModel.results" class="text-sm">
                        <td class="p-2 border text-gray-600 font-semibold">{{ emp.employeeCode }}</td>
                        <td class="p-2 border text-right">{{ emp.employeeNameAR }}</td>
                        <ng-container *ngFor="let day of weekDays">
                            <td class="p-1 border">
                                <input type="time" class="form-control nw-form-input"
                                    [(ngModel)]="getShift(emp.employeeId, day.date).shiftOneFrom" />
                            </td>
                            <td class="p-1 border">
                                <input type="time" class="form-control nw-form-input"
                                    [(ngModel)]="getShift(emp.employeeId, day.date).shiftOneTo" />
                            </td>
                            <td class="p-1 border">
                                <input type="time" class="form-control nw-form-input"
                                    [(ngModel)]="getShift(emp.employeeId, day.date).shiftTwoFrom" />
                            </td>
                            <td class="p-1 border">
                                <select class="form-control nw-form-input"
                                    [(ngModel)]="getShift(emp.employeeId, day.date).shiftType">
                                    <option value="">--</option>
                                    <option value="Shift A">Shift A</option>
                                    <option value="Shift B">Shift B</option>
                                </select>
                            </td>
                        </ng-container>
                    </tr>
                </tbody>
            </table>

        </div>
    </div>
</div>
