<div class="inputs-wrapper border rounded bg-white mb-3">

    <div class="px-3 py-2 mb-2">

        <app-erp-pagination (pageChanged)="pageChanged($event)" [currentPage]="pagedResponseModel.currentPage" [pageSize]="pagedResponseModel.pageSize" [totalCount]="pagedResponseModel.totalCount"></app-erp-pagination>
    </div>

    <div class="table-responsive shadow-sm radius-10  small-scroll">
        <table class="table table-card-table table-borderless table-middle table-hover bg-transparent m-0">
            <thead>
                <tr>
                    <th>الرقم الوظيفى</th>
                    <th>اسم الموظف</th>
                    <th>تاريخ العملية</th>
                    <th>النوع</th>
                    <th>عدد الأيام</th>
                    <th>إجمالى القيمة</th>
                    <th>نوع العملية</th>
                    <th>حالة الطلب</th>
                    <th class="text-center"></th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let item of pagedResponseModel.results">
                    <td>{{item.code}}</td>
                    <td>{{item.fullNameAR}}</td>
                    <td>{{item.requestDate | date}}</td>
                    <td>{{item.typeNameAR}}</td>
                    <td>{{item.noDays}}</td>
                    <td>{{item.moneyAmount}}</td>
                    <td>{{item.processType}}</td>
                    <td>
                        <span appWorkflowStatus [id]="item.statusId" [nameEN]="item?.jobStatusEN" [nameAR]="item?.jobStatusAR">
                        </span>
                    </td>
                    <td>
                        <div class="d-flex align-items-center justify-content-center">
                            <div ngbDropdown container="body">
                                <button class="btn-sm-action sm-action-dropdown" (click)="goToEmployeeDetails(item.employeeId)">
                                    <i class="fas fa-ellipsis-v"></i>
                                </button>
                                <!-- <div ngbDropdownMenu class="border">
                                    <button ngbDropdownItem (click)="cancelPaymentOrder(item.paymentOrderId)">اسقاط</button>
                                    <button ngbDropdownItem routerLink="/general-accounts/create-payment-receipt" [queryParams]="{PaymentOrderId:item.paymentOrderId}">انشاء سند
                                        الصرف</button>
                                </div> -->
                            </div>
                        </div>
                        <!-- <div class="w-100 d-flex align-items-center justify-content-center">
                            <button (click)="CancelPaymentReceipt(item.paymentReceiptId)" class="button-table-action btn-delete d-flex align-items-center justify-content-center gap-2">
                                <i class="uil uil-times"></i>
                                <span>إلغاء</span>
                            </button>
                            <button class="btn btn-primary me-2">
                                <i class="fas fa-edit"></i>
                                <span class="ms-2">Edit</span>
                            </button>
                        </div> -->
                    </td>
                </tr>
                <tr *ngIf="!pagedResponseModel.results.length">
                    <td colspan="9" class="text-right">
                        <app-empty-data [showEmptyData]="!pagedResponseModel.results.length"></app-empty-data>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
