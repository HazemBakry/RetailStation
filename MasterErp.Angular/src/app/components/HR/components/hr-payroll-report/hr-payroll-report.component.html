<app-breadcrumb [TitleList]="TitleList"></app-breadcrumb>

<div class="inputs-wrapper border rounded bg-white mb-3">
    <div class="inputs-sec-title fw-semibold fs-16 px-3 py-2 border-bottom mb-2">
    </div>
    <div class="inputs-sec-content px-3 py-2">
        <div class="row gy-3">
            <div class="col-lg-3">
                <div class="mb-2">
                    <label class="form-label d-flex align-items-center gap-2">
                        نوع العملية
                        <span class="text-danger">*</span>
                    </label>
                    <app-general-selector [data]="payrollProcessTypes" [placeholder]="'نوع العملية'"
                        [(ngModel)]="TypeId" (valueChanged)="actionTypeChanged($event)"></app-general-selector>
                </div>
            </div>
            <ng-container *ngIf="pagedResponseModel.results.length > 0">
                <app-erp-filters [FilterList]="filterList" (filterChanged)="filterChecked($event)"
                    [searchPlaceholder]="'البحث بالاسم , الرقم الوظيفى ...'"></app-erp-filters>
            </ng-container>
        </div>
    </div>

    <div class="inputs-sec-title fw-semibold fs-16 px-3 py-2 border-top mb-2">

        <button class="btn btn-secondary me-2" (click)="getEmployeePayrollReport(TypeId)">
            <i class="fas fa-search"></i>
            <span class="ms-2">بحث</span>
        </button>
        <!-- <button class="btn btn-primary me-2">
            <i class="fas fa-check-circle"></i>
            <span class="ms-2">تأكيد</span>
        </button> -->
        <button class="btn btn-success me-2" [disabled]="showExportLoader" (click)="exportData(TypeId)">
            <i class="fas fa-file-download"></i>
            <span class="ms-2">تصدير</span>
        </button>
    </div>
</div>

<div class="inputs-wrapper border rounded bg-white mb-3">

    <div
        class="align-items-center border-bottom d-flex flex-wrap justify-content-between p-3 table-card-title bg-light">
        <div class="d-flex align-items-center gap-2">
            <button *ngIf="pagedResponseModel.results.length" (click)="approve()" class="btn btn-success d-flex align-items-center gap-2 border rounded px-3">
                <i class="fas fa-plus-circle"></i>
                <span>Approve</span>
            </button>
        </div>
        <div class="justify-content-end">
            <app-erp-pagination (pageChanged)="pageChanged($event)" [currentPage]="pagedResponseModel.currentPage"
                [pageSize]="pagedResponseModel.pageSize"
                [totalCount]="pagedResponseModel.totalCount"></app-erp-pagination>
        </div>
    </div>

    <div class="table-responsive shadow-sm radius-10  small-scroll">
        <table class="table table-card-table table-borderless table-middle table-hover bg-transparent m-0">
            <thead>
                <tr>
                    <th class="min-width-50 width-50 max-width-50">
                        <input type="checkbox" [(ngModel)]="selectAll" (change)="selectAllData()"
                            class="big-checkbox cursor-pointer" />
                    </th>
                    <th>الرقم الوظيفى</th>
                    <th>اسم الموظف</th>
                    <th>تاريخ العملية</th>
                    <th>النوع</th>
                    <th>عدد الأيام</th>
                    <th>إجمالى القيمة</th>
                    <th>نوع العملية</th>
                    <th>حالة الطلب</th>
                    <th class="text-center"></th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let item of pagedResponseModel.results">
                    <td>
                        <input type="checkbox" class="big-checkbox" [(ngModel)]="item.isChecked">
                    </td>
                    <td>{{item.code}}</td>
                    <td>{{item.fullNameAR}}</td>
                    <td>{{item.requestDate | date}}</td>
                    <td>{{item.typeNameAR}}</td>
                    <td>{{item.period}}</td>
                    <td>{{item.moneyAmount}}</td>
                    <td>{{item.processType}}</td>
                    <td>
                        <span appWorkflowStatus [id]="item.statusId" [nameEN]="item?.jobStatusEN"
                            [nameAR]="item?.jobStatusAR">
                        </span>
                    </td>
                    <td>
                        <div class="d-flex align-items-center justify-content-center">
                            <div ngbDropdown container="body">
                                <button class="btn-sm-action sm-action-dropdown"
                                    (click)="goToEmployeeDetails(item.employeeId)">
                                    <i class="fas fa-ellipsis-v"></i>
                                </button>
                            </div>
                        </div>
                    </td>
                </tr>
                <tr *ngIf="!pagedResponseModel.results.length">
                    <td colspan="9" class="text-right">
                        <app-empty-data [showEmptyData]="!pagedResponseModel.results.length"></app-empty-data>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
