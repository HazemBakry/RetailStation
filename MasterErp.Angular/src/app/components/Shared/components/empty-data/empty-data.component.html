<div *ngIf="showContainer">
    <div class="boxstyle1-content hastable loading-mess-stl text-center m-0 py-3">
        <span>No Data</span>
    </div>
</div>

<div *ngIf="showLoader && !showContainer" >
    <div class="prcs flex-box  hastable loading-mess-stl ">
        <div class="prcs-lbl-container">
            <span class="prcs-lbl" id="prcs_lbl">Loading Data ...</span>
        </div>
        <app-erp-spinner-component></app-erp-spinner-component>

    </div>
</div>
