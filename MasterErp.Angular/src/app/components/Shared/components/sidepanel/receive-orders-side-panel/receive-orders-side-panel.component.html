<button class="btn btn-primary" (click)="OpenSidePanel(OrderSearchSidepanel)">

    <i class="fas fa-search"></i>
    <span class="ms-2">بحث أذن أضافة</span>
</button>
<ng-template #OrderSearchSidepanel let-offcanvas>
    <div class="m-1">

        <div class="offcanvas-header pb-0" style="z-index: 9999;">
            <div>
                <!-- <h4 class="offcanvas-title m-0 d-flex align-items-center w-100"><i
                        class="fas fa-history fa-2x main-color me-2"></i> التفاصيل</h4> -->
            </div>
            <button type="button" class="btn bg-danger text-white rounded" aria-label="Close"
                (click)="offcanvas.dismiss()">
                <i class="fas fa-times"></i>
            </button>
        </div>

        <div class="offcanvas-body pt-0">

            <div class="employee-card-body my-5 row">
                <div class="col-xl-5 mb-3">
                    <app-drop-down-form-control [disabled]="true" [(ngModel)]="selectedSupplierId" [data]="suppliersSelectorData"
                        [showSearch]="true" [placeholder]="'قائمة الموردين'"></app-drop-down-form-control>
                </div>
                <!-- <div class="col-xl-1"></div> -->
                <div class="col-xl-2  mb-3">
                    <div class="form-floating mb-3">
                        <input type="text" autocomplete="off" [(ngModel)]="orderNumber" class="form-control"
                            id="floatingInput1" placeholder="any">
                        <label for="floatingInput1">رقم الطلب</label>
                    </div>
                </div>

                <!-- <div class="col-xl-1"></div> -->
                <div class="col-xl-3  mb-3">
                    <div class="form-floating mb-3">
                        <input type="date" [(ngModel)]="orderDate" class="form-control" id="floatingInput6"
                            placeholder="any">
                        <label for="floatingInput6">تاريخ الاصدار</label>
                    </div>
                </div>
                <div class="col-xl-2  mb-3">
                    <button (click)="loadData()" class="btn btn-primary mt-2">بحث</button>

                </div>
            </div>
            <div class="boxstyle1-content">
                <button (click)="SelectOrders()" class="button-table-action btn-edit d-flex align-items-center justify-content-center gap-2 me-2">
                    <i class="far fa-eye"></i>
                    <span>تحميل</span>
                </button>
            </div>
            <div class="boxstyle1-content hastable table-responsive table-vp-height small-scroll">
                <table class="table table-bordered table-responsive table-middle table-hover m-0 bg-white bigtitle">
                    <thead>
                        <tr>
                            <th>
                                <input class="cursor-pointer" (change)="selectAllData()"  [(ngModel)]="selectAll" type="checkbox" >

                            </th>
                            <th>رقم الفاتورة</th>
                            <th>الرقم الدفترى</th>
                            <th>تاريخ الفاتورة</th>
                            <th>اسم المورد</th>
                            <th>المخزن</th>
                            <th>القيمة الإجمالية</th>
                            <th>حالة الفاتورة</th>
                            <th class="text-center"></th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let item of pagedResponseModel.results">
                            <td>
                                <input class="cursor-pointer" type="checkbox"  [(ngModel)]="item.isChecked">

                            </td>
                            <td>
                                <div class="d-flex align-items-center gap-2">
                                    <div class="fs-5 fw-bold text-center">{{item.orderNumber}}</div>
                                </div>
                            </td>
                            <td>{{item.docNumber}}</td>
                            <td>{{item.orderDate | date}}</td>
                            <td>{{item.supplierNameAR}}</td>
                            <td>{{item.storeNameAR}}</td>
                            <td>{{item.totalValue}}</td>
                            <td>
                                <span class="badge rounded-pill default p-2 text-uppercase px-3">
                                    {{item.orderStatus}}
                                </span>
                            </td>
                            <td>
                                <div class="w-100 d-flex align-items-center justify-content-center">
                                    <button (click)="SelectOrder(item)" class="button-table-action btn-edit d-flex align-items-center justify-content-center gap-2 me-2">
                                        <i class="far fa-eye"></i>
                                        <span>تحميل</span>
                                    </button>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                    
                </table>
               
                <app-empty-data [showContainer]="!pagedResponseModel.results?.length&&!showLoader"
                    [showLoader]="showLoader"></app-empty-data>
            </div>

        </div>
    </div>

</ng-template>
