<div class="card radius-10 border-0 card-shadow">
    <div class="card-body">
        <div class="row ps-3 pt-3">
            <div class="col-lg-3">
                <app-erp-selector-with-search #Selector [SelectorName]="'رقم الحساب'" [ItemsList]="AccountsList" [Height]="'35px'" [SearchKey]="'nameAR'" (ItemObj)="GetSelectedPaymentType($event)">
                </app-erp-selector-with-search>
            </div>
            <div class="col-lg-4">
                <app-erp-selector-with-search #Selector [SelectorName]="'اسم الحساب'" [ItemsList]="AccountsList" [Height]="'35px'" [SearchKey]="'nameAR'" (ItemObj)="GetSelectedPaymentType($event)">
                </app-erp-selector-with-search>
            </div>
        </div>
        <div class="row ps-3">
            <div class="col-xl-2" *ngIf="ShowSearchInput">
                <div class="search-box position-relative mb-2">
                    <input type="text" class="form-control" [(ngModel)]="SearchText" placeholder="Search By Phone" style="height: 50px;">
                    <i class="fas fa-search search-icon text-muted cursor-pointer"></i>
                </div>
            </div>
            <div class="col-xl-3">
                <div class="form-floating mb-3">
                    <input _ngcontent-ntw-c119="" type="date" id="FromDate" placeholder="From Date" class="form-control ng-pristine ng-valid ng-touched">
                    <!-- <input type="date" class="form-control" [(ngModel)]="FromDate" id="FromDate" placeholder="From Date"> -->
                    <label for="FromDate"> من تاريخ : <sup>*</sup></label>
                </div>
            </div>
            <div class="col-xl-3 offset-lg-1">
                <div class="form-floating mb-3">
                    <input type="date" class="form-control" [(ngModel)]="ToDate" id="ToDate" placeholder="From Date">
                    <label for="ToDate">حتى تاريخ : <sup>*</sup></label>
                </div>
            </div>
        </div>
        <div class="row ps-3">
            <div class="col-xl-12 mt-3">
                <div class="d-flex align-items-center">
                    <button class="btn btn-primary me-2" (click)="ReportSearchClick()">
                        <i class="fas fa-search"></i>
                        <span class="ms-2">بحث</span>
                    </button>
                    <button class="btn btn-success me-2" (click)="ReportExportClick()">
                        <i class="fas fa-file-export"></i>
                        <span class="ms-2">تصدير</span>
                    </button>
                    <button class="btn btn-secondary me-2" (click)="PrintClick()">
                        <i class="fas fa-print"></i>
                        <span class="ms-2">طباعة</span>
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
