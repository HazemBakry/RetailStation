<div class="card stats-card shadow border-0 text-white">
  <div class="card-body">
    <h5 class="card-title fw-bold">{{ stats.title }}</h5>
    <div class="d-flex align-items-center justify-content-between">
      <i class="uil {{ stats.icon }} stats-icon"></i>
      <div class="fw-bold fs-3">{{ stats.number }}</div>
    </div>
    <div class="d-flex align-items-center justify-content-between">
      <div>{{ stats.orderName }}</div>
      <div class="fs-6">{{ stats.orderNumber }}</div>
    </div>
  </div>
</div>
