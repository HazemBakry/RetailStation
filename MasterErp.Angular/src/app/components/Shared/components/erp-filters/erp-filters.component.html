<div class="d-flex align-items-center flex-wrap mb-3">
    <div ngbDropdown class="dropdown-filter-wrapper d-inline-block" *ngFor="let filter of FilterList;let i = index">
        <button type="button" class="btn-filter" id="filterInput1" ngbDropdownToggle>
            {{filter.categoryDisplayName}}
        </button>
        <div ngbDropdownMenu aria-labelledby="filterInput1" class="dropdown-filter p-0 overflow-hidden">
            <div class="p-2 bg-light border-bottom">
                <input type="text" [(ngModel)]="SearchText" class="form-control form-control-sm" placeholder="Search..." />
            </div>
            <div class="max-height-150 min-width-200 overflow-auto small-scroll">
                <div class="check-row px-2" *ngFor="let filterItem of filter.filterItems | searchArry: SearchText:'itemFlag';let x = index">
                    <div class="form-check">
                        <input class="form-check-input" [(ngModel)]="filterItem.isChecked" (change)="filterChecked(filterItem)" type="checkbox" id="filter-input_{{i}}_{{x}}">
                        <label class="form-check-label d-flex align-items-center justify-content-between w-100 pe-2" for="filter-input_{{i}}_{{x}}">
                            <span>{{filterItem.itemFlag}}</span>
                            <span>{{filterItem.itemValue}}</span>
                        </label>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<div class="d-flex align-items-center flex-wrap">
    <span class="badge badge-size bg-primary me-1 mb-1" *ngFor="let selected of SelectedFilter;let i = index">
        {{selected.itemFlag}} : {{selected.itemValue}}
        <i class="fas fa-times-circle ms-1 icon-close cursor-pointer" (click)="RemoveSelectedFilter(selected,i)"></i>
    </span>
    <span class="badge badge-size bg-secondary me-1 mb-1" *ngIf="SelectedFilter.length > 0">
        Clear All
        <i class="fas fa-times-circle ms-1 icon-close cursor-pointer" (click)="RemoveAllFilters()"></i>
    </span>
</div>
