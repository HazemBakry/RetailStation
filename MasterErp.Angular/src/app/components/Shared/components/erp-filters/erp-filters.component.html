<div class="d-flex align-items-center">
    <div class="col-md-2">
        <div class="input-group">
            <span class="input-group-text">
                <button (click)="filterChecked()" class="border-0">
                    <i class="fas fa-search"></i>
                </button>

            </span>
            <input [(ngModel)]="SearchText" (keyup.enter)="filterChecked()" type="text" [placeholder]="searchPlaceholder" class="form-control">
        </div>
    </div>
    <div ngbDropdown class="dropdown-filter-wrapper d-inline-block" *ngFor="let filter of FilterList;let i = index">
        <button type="button" class="btn-filter" id="filterInput1" ngbDropdownToggle>
            {{filter.categoryDisplayName}}
        </button>
        <div ngbDropdownMenu aria-labelledby="filterInput1" class="dropdown-filter p-0 overflow-hidden">
            <div class="p-2 bg-light border-bottom">
                <input type="text" [(ngModel)]="filterSearch" class="form-control form-control-sm" placeholder="Search..." />
            </div>
            <div class="erp-filter-box small-scroll">
                <div class="check-row px-2" *ngFor="let filterItem of filter.filterItems | searchArry: filterSearch:'itemFlag';let x = index">
                    <div class="form-check">
                        <input class="form-check-input cursor-pointer" [(ngModel)]="filterItem.isChecked" (change)="filterChecked(filterItem)" type="checkbox" id="filter-input_{{i}}_{{x}}">
                        <label class="form-check-label d-flex align-items-center justify-content-between w-100 pe-2" for="filter-input_{{i}}_{{x}}">
                            <!-- <span>{{filterItem.itemFlag}}</span> -->
                            <span class="cursor-pointer">{{filterItem.itemKey}}</span>
                            <span>{{filterItem.itemValue}}</span>
                        </label>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<div class="d-flex align-items-center p-2">
    <span class="badge badge-size bg-primary me-1 mb-1  cursor-pointer" *ngFor="let selected of SelectedFilter;let i = index" (click)="RemoveSelectedFilter(selected,i)">
        {{selected.categoryDisplayName}} : {{selected.itemKey}}
        <i class="fas fa-times-circle ms-1 icon-close cursor-pointer"></i>
    </span>
    <span class="badge badge-size bg-secondary me-1 mb-1  cursor-pointer" (click)="RemoveAllFilters()" *ngIf="SelectedFilter.length > 0">
        Clear All
        <i class="fas fa-times-circle ms-1 icon-close cursor-pointer"></i>
    </span>
</div>
