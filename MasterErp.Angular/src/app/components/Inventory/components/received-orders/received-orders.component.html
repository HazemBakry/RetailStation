<div class="card radius-10 border-0 card-shadow mb-3">
    <div class="boxstyle1">
        <div class="boxstyle1-header bg-light">
            <div class="boxstyle1-header-left mb-3">
                <button class="btn btn-primary" routerLink="./../add-receive-order">
                    <i class="fas fa-plus-circle"></i>
                    <span class="ms-2">اذن إضافة جديد</span>
                </button>
            </div>
        </div>
        <div class="card radius-10 border-0 card-shadow">
            <div class="card-body">
                <div class="main-card-action pb-3">
                    <div class="row">
                        <div class="col-md-8">
                            <!-- <div class="col-md-12">
                                <div class="d-flex align-items-center flex-wrap">
                                    <ng-container *ngIf="filterList.length > 0">
                                        <app-pos-filters [FilterList]="filterList"
                                            (filterChanged)="filterChecked($event)"></app-pos-filters>
                                    </ng-container>
                                </div>
                            </div> -->
                        </div>
                        <div class="col-md-4">
                            <app-erp-pagination (pageChanged)="pageChanged($event)" [currentPage]="FilterModel.currentPage" [pageSize]="FilterModel.pageSize" [totalCount]="TotalCount" [totalPages]="TotalPages"></app-erp-pagination>
                        </div>
                    </div>
                </div>
                <div class="table-responsive table-vp-height large-scroll">

                    <table class="table table-bordered table-middle bg-white m-0 table-hover bigtitle">
                        <thead>
                            <tr>
                                <th>رقم الفاتورة</th>
                                <th>الرقم الدفترى</th>
                                <th>تاريخ الفاتورة</th>
                                <th>اسم المورد</th>
                                <th>القيمة الإجمالية</th>
                                <th>حالة الفاتورة</th>
                                <th class="text-center"></th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr *ngFor="let item of OrderList">
                                <td>{{item.orderNumber}}</td>
                                <td>{{item.docNumber}}</td>
                                <td>{{item.receiveDate | date}}</td>
                                <td>{{item.supplierName}}</td>
                                <td>{{item.totalValue}}</td>
                                <td>
                                    <span class="badge rounded-pill default p-2 text-uppercase px-3" [ngClass]="getStatusColor(item.isLocked)">
                                        {{item.orderStatus}}
                                    </span>
                                </td>
                                <td>
                                    <div class="w-100 d-flex align-items-center justify-content-center">
                                        <button class="btn btn-danger me-2" (click)="CancelOrder(item.receiveOrderId)">
                                        <i class="fas fa-times"></i>
                                        <span class="ms-2">الغاء</span>
                                    </button>
                                        <!-- <button class="btn btn-secondary me-2">
                                    <i class="far fa-eye"></i>
                                    <span class="ms-2">Lock Order</span>
                                </button>
                                <button class="btn btn-primary me-2">
                                    <i class="fas fa-edit"></i>
                                    <span class="ms-2">Edit</span>
                                </button> -->
                                        <app-invoice-details-sidepanel [invoiceId]="item.receiveOrderId">
                                        </app-invoice-details-sidepanel>
                                    </div>
                                </td>
                            </tr>
                        </tbody>

                    </table>
                </div>
            </div>
        </div>
    </div>
    <app-empty-data [showContainer]="!OrderList?.length&&!showLoader" [showLoader]="showLoader"></app-empty-data>
</div>
