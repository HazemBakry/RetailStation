<app-breadcrumb [TitleList]="TitleList"></app-breadcrumb>

<div class="card radius-10 border-0 card-shadow mb-3">
    <div class="card-header bg-white">
        <span class="m-0 fw-bold card-header-title">أذن أضافة</span>
    </div>
    <div class="card-body bg-light">

        <form [formGroup]="formGroup" autocomplete="off">
            <div class="row">
                <div class="col-md-3 ">
                    <app-drop-down-form-control [showSearch]="true" formControlName="storeId" [placeholder]="'المخازن'" [data]="inventoriesSelectorData"></app-drop-down-form-control>
                    <div *ngIf="formErrors.storeId" class="text-danger  font-small-3 m-03">
                        {{formErrors.storeId}}
                    </div>
                </div>
                <div class="col-md-3 mb-3 offset-md-2">
                    <app-drop-down-form-control [showSearch]="true" formControlName="supplierId" [placeholder]="'الموردين'" [data]="suppliersSelectorData"></app-drop-down-form-control>
                    <div *ngIf="formErrors.supplierId" class="text-danger  font-small-3 m-03">
                        {{formErrors.supplierId}}
                    </div>
                </div>
                <ng-container *ngIf="!isUpdate">
                    <!-- <div class="form-floating">
                            <input type="text" [value]="selectedPurchaseOrder?.orderNumber ?? ''" disabled class="form-control" id="floatingInput1" placeholder="any">
                            <label for="floatingInput1">رقم أمر الشراء</label>
                        </div> -->
                    <div *ngIf="formErrors.purchaseOrderId" class="text-danger  font-small-3 m-03">
                        {{formErrors.purchaseOrderId}}
                    </div>
                    <div class="col-md-2">
                        <app-order-search-sidepanel (selectedOrder)="searchOrderSelected($event)"></app-order-search-sidepanel>
                    </div>
                </ng-container>

            </div>
            <div class="row">
                <div class="col-md-8">
                    <div class="form-floating mb-3 min-height-30">
                        <textarea type="text" formControlName="notes" class="form-control" id="floatingInput10" placeholder="ملاحظات"></textarea>
                        <label for="floatingInput10">ملاحظات</label>

                        <div *ngIf="formErrors.notes" class="text-danger  font-small-3 m-03">
                            {{formErrors.notes}}
                        </div>
                    </div>
                </div>
            </div>
        </form>

        <app-general-order-products [selectedProducts]="orderProducts" [clearAllProducts]="clearAllProducts" (selectedProductsList)="getSelectedProductsList($event)"></app-general-order-products>
        <!-- <app-order-products [selectedSupplierProducts]="ItemsBySupplier" [clearAllProducts]="clearAllProducts" (selectedProductsList)="getSelectedProductsList($event)"></app-order-products> -->

        <div class="mt-3">
            <button class="btn btn-primary btn-lg fs-6 me-2" (click)="saveReceiveOrder()">
                <i class="fas fa-check-circle"></i>
                <span class="ms-2">حفظ</span>
            </button>
            <button class="btn btn-warning btn-lg fs-6 me-2" (click)="initNewForm()">
                <i class="fas fa-times"></i>
                <span class="ms-2">مسح</span>
            </button>
        </div>

    </div>
</div>
