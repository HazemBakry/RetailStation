<div class="container-fluid pt-2">
    <div class="card card-with-table border shadow-none">
        <div class="card-header bg-white border-bottom d-flex align-items-center justify-content-between">
            <div class="d-flex align-items-center gap-3">
                <button class="btn btn-outline-primary border d-flex align-items-center gap-2 py-2" routerLink="./../add-receive-order">
                    <i class="uil uil-plus fs-5"></i>
                    <span>إضافة إذن جديد</span>
                </button>
            </div>
            <nav>
                <ul class="table-pagination pagination m-0 p-0 gap-2">
                    <li class="page-item">
                        <a class="page-link" aria-label="Previous">
                            <i class="fas fa-chevron-right"></i>
                        </a>
                    </li>
                    <li class="page-item"><a class="page-link">1</a></li>
                    <li class="page-item"><a class="page-link active">2</a></li>
                    <li class="page-item"><a class="page-link">3</a></li>
                    <li class="page-item">
                        <a class="page-link" aria-label="Next">
                            <i class="fas fa-chevron-left"></i>
                        </a>
                    </li>
                </ul>
            </nav>
        </div>
        <div class="card-body table-responsive p-0">
            <table class="table table-borderless align-middle table-hover table-component m-0">
                <thead>
                    <tr>
                        <th>رقم الفاتورة</th>
                        <th>الرقم الدفترى</th>
                        <th>تاريخ الفاتورة</th>
                        <th>اسم المورد</th>
                        <th>المخزن</th>
                        <th>القيمة الإجمالية</th>
                        <th>حالة الفاتورة</th>
                        <th class="text-center"></th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let item of OrderList">
                        <td>
                            <div class="d-flex align-items-center gap-2">
                                <div class="fs-5 fw-bold text-center">{{item.orderNumber}}</div>
                            </div>
                        </td>
                        <td>{{item.docNumber}}</td>
                        <td>{{item.orderDate | date}}</td>
                        <td>{{item.supplierNameAR}}</td>
                        <td>{{item.storeNameAR}}</td>
                        <td>{{item.totalValue}}</td>
                        <td>
                            <span class="badge rounded-pill default p-2 text-uppercase px-3" [ngClass]="getStatusColor(item.isLocked)">
                                {{item.orderStatus}}
                            </span>
                        </td>
                        <td>
                            <div class="w-100 d-flex align-items-center justify-content-center">
                                <button class="btn btn-danger me-2" (click)="CancelOrder(item.orderId)">
                                    <i class="fas fa-times"></i>
                                    <span class="ms-2">الغاء</span>
                                </button>
                                <button routerLink="../add-receive-order" [queryParams]="{ReceiveOrderId:item.orderId}" class="button-table-action btn-edit d-flex align-items-center justify-content-center gap-2">
                                    <i class="uil uil-pen"></i>
                                    <span>تعديل</span>
                                </button>
                                <!-- <button class="btn btn-secondary me-2">
                                            <i class="far fa-eye"></i>
                                            <span class="ms-2">Lock Order</span>
                                        </button>
                                        <button class="btn btn-primary me-2">
                                            <i class="fas fa-edit"></i>
                                            <span class="ms-2">Edit</span>
                                        </button> -->
                                <app-invoice-details-sidepanel [invoiceId]="item.orderId">
                                </app-invoice-details-sidepanel>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>


    <app-empty-data [showContainer]="!OrderList?.length && !showLoader" [showLoader]="showLoader"></app-empty-data>
</div>
