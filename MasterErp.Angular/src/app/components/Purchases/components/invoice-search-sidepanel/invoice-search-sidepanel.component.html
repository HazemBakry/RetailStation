<button class="btn btn-primary" (click)="OpenSidePanel(InvoiceSearchSidepanel)">
    <i class="fas fa-search"></i>
    <span class="ms-2">بحث عن فاتورة</span>
</button>
<ng-template #InvoiceSearchSidepanel let-offcanvas >
    <div class="m-1">

        <div class="offcanvas-header pb-0" style="z-index: 9999;">
            <div>
                <h4 class="offcanvas-title m-0 d-flex align-items-center w-100"><i
                        class="fas fa-history fa-2x main-color me-2"></i> التفاصيل</h4>
            </div>
            <button type="button" class="btn bg-danger text-white rounded" aria-label="Close" (click)="offcanvas.dismiss()">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="offcanvas-sub-header m-3" >
            <!-- <div>
                <h5 class="m-0"> اسم المورد : {{supplierName}}</h5>

            </div> -->
        </div>
        <div class="offcanvas-body m-2 row">
            <div class="col-xl-5 mb-3">
                <app-drop-down-form-control [disabled]="true" [(ngModel)]="selectedSupplierId" [data]="suppliersSelectorData"
                    [showSearch]="true" [placeholder]="'قائمة الموردين'"></app-drop-down-form-control>
            </div>
            <div class="col-lg-3">
                <div class="form-floating mb-3">
                    <input type="text" [(ngModel)]="invoiceNumber" class="form-control"
                      id="floatingInput1" placeholder="any">
                    <label for="floatingInput1">رقم الفاتورة</label>
                  </div>
            </div>
            <div class="col-lg-3">
                <div class="form-floating mb-3">
                    <input type="date" [(ngModel)]="invoiceDate" class="form-control"
                      id="floatingInput6" placeholder="any">
                    <label for="floatingInput6">تاريخ الاصدار</label>
                </div>
            </div>
            <div class="col-lg-3">
                <button (click)="loadData()" class="btn btn-primary mt-2">بحث</button>
            </div>
        </div>
        
        
        <div class="offcanvas-body pt-0">


            <div class="boxstyle1-content hastable table-responsive table-vp-height small-scroll">
                <table class="table table-bordered table-responsive table-middle table-hover m-0 bg-white bigtitle">
                    <thead>
                        <tr>
                            <th>رقم الفاتورة</th>
                            <th>الرقم الدفترى</th>
                            <th>تاريخ الفاتورة</th>
                            <th>اسم المورد</th>
                            <th>نوع الفاتورة</th>
                            <!-- <th>Insert User</th>
                            <th>Insert Date</th>
                            <th>Is Locked</th> -->
                            <th>القيمة الإجمالية</th>
                            <th>حالة الفاتورة</th>
                            <th class="text-center"></th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let item of pagedResponseModel.results">
                            <td>{{item.orderNumber}}</td>
                            <td>{{item.docNumber}}</td>
                            <td>{{item.orderDate | date}}</td>
                            <td>{{item.supplierNameAR}}</td>
                            <td>{{item.orderTypeName}}</td>
                            <!-- <td>{{item.insertUser}}</td>
                            <td>{{item.insertDate | date}}</td>
                            <td>{{item.isLocked}}</td> -->
                            <td>{{item.totalValue}}</td>
                            <td>
                                <span class="badge rounded-pill default p-2 text-uppercase px-3" >
                                    {{item.orderStatus}}
                                </span>
                            </td>
                            <td>
                                <div class="w-100 d-flex align-items-center justify-content-center">
                                    <button (click)="SelectInvoice(item)" class="button-table-action btn-edit d-flex align-items-center justify-content-center gap-2 me-2">
                                        <i class="far fa-eye"></i>
                                        <span>تحميل</span>
                                    </button>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                    
                    

                </table>
            </div>
            <app-empty-data [showContainer]="!PurchaseList?.length&&!showLoader" [showLoader]="showLoader"></app-empty-data>

        </div>
    </div>

</ng-template>
