<div class="card radius-10 border-0 card-shadow mb-3">
    <div class="boxstyle1">
        <div class="boxstyle1-header">
            <div class="boxstyle1-header-left">
                <button class="btn btn-primary" routerLink="/purchases/add-purchase-returns">
                    <i class="fas fa-plus-circle"></i>
                    <span class="ms-2">فاتورة مرتجعات</span>
                </button>
            </div>
        </div>
        <div class="boxstyle1-content hastable table-responsive table-vp-height small-scroll">
            <table class="table table-bordered table-middle table-hover m-0 bg-white bigtitle">
                <thead>
                    <tr>
                        <th>رقم الفاتورة</th>
                        <th>تاريخ الارتجاع</th>
                        <th>إجمالى القيمة</th>
                        <th>الموظف المسؤول</th>
                        <th>تاريخ الارتجاع</th>

                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let item of pagedResponseModel.results">
                        <td>{{item.orderNumber}}</td>
                        <td>{{item.orderDate | date}}</td>
                        <td>{{item.totalValue}}</td>
                        <td>{{item.createdByName}}</td>
                        <td>{{item.createdDate | date}}</td>

                        <td>
                            <div class="w-100 d-flex align-items-center justify-content-center">
                                <button routerLink="/purchases/add-purchase-returns" [queryParams]="{PurchaseReturnsId:item.orderId}" class="button-table-action btn-edit d-flex align-items-center justify-content-center gap-2 me-2" >
                                    <i class="uil uil-pen"></i>
                                    <span>تعديل</span>
                                </button>
                                <!-- <button class="button-table-action btn-delete d-flex align-items-center justify-content-center gap-2" (click)="CancelPurchaseInvoice(item.orderId)">
                                    <i class="uil uil-trash-alt"></i>
                                    <span>حذف</span>
                                </button> -->
                             
                            </div>
                        </td>
                    </tr>
                </tbody>

            </table>
            <app-empty-data [showEmptyData]="!pagedResponseModel.results?.length&&!showLoader" [showLoader]="showLoader"></app-empty-data>
        </div>

    </div>
</div>

<!-- <ngx-loading [show]="showLoader"></ngx-loading> -->
