<app-breadcrumb [TitleList]="TitleList"></app-breadcrumb>

<div class="card card-with-table border shadow-none">
    <div class="card-header bg-white border-bottom d-flex align-items-center justify-content-between">
        <div class="d-flex align-items-center gap-3">
            <button class="btn btn-outline-primary border d-flex align-items-center gap-2 py-2" routerLink="/purchases/add-purchase-quotation">
                <i class="uil uil-plus fs-5"></i>
                <span>انشاء عرض مشترايات</span>
            </button>
        </div>
        <div class="col-md-4">
            <app-erp-pagination (pageChanged)="pageChanged($event)" [currentPage]="pagedResponseModel.currentPage" [pageSize]="pagedResponseModel.pageSize" [totalCount]="pagedResponseModel.totalCount"></app-erp-pagination>
        </div>
    </div>
    <div class="card-body table-responsive p-0">
        <table class="table table-borderless align-middle table-hover table-component text-center m-0 p-0">
            <thead>
                <tr>
                    <th>رقم العرض</th>
                    <th>تاريخ العرض</th>
                    <th>تفاصيل</th>
                    <th class="text-center"></th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let item of pagedResponseModel.results">
                    <td>{{item.quotationNumber}}</td>
                    <td>{{item.quotationDate | date}}</td>
                    <td>{{item.notes}}</td>

                    <td>
                        <div class="w-100 d-flex align-items-center justify-content-center">
                            <button routerLink="/purchases/add-purchase-quotation" [queryParams]="{PurchaseQuotationId:item.purchaseQuotationId}"
                                class="button-table-action btn-edit d-flex align-items-center justify-content-center gap-2 me-2">
                                <i class="uil uil-pen"></i>
                                <span>تعديل</span>
                            </button>
                           
                            <button (click)="showQuotationDetails(item)"
                                class="button-table-action btn-edit d-flex align-items-center justify-content-center gap-2 me-2">
                                <i class="uil uil-pen"></i>
                                <span>تفاصيل</span>
                            </button>
                        </div>
                    </td>
                </tr>
            </tbody>

        </table>
        <app-empty-data [showContainer]="!pagedResponseModel.results?.length&&!showLoader" [showLoader]="showLoader"></app-empty-data>
    </div>
</div>

<ng-template appComponentHost></ng-template>
