<div class="card radius-10 border-0 card-shadow mb-3">
    <div class="card-header bg-white">
        <span class="m-0 fw-bold card-header-title">فاتوره مشترايات</span>
    </div>
    <div class="card-body bg-light">

        <form [formGroup]="formGroup" autocomplete="off">
            <div class="employee-card-body row">
                <div class="col-xl-4 mb-3">

                    <app-drop-down-form-control [disabled]="isUpdate" formControlName="supplierId" [placeholder]="'الموردين'"
                        [data]="suppliersSelectorData"
                        (valueChanged)="getSelectedSupplier($event)"></app-drop-down-form-control>
                    <div *ngIf="formErrors.supplierId" class="text-danger  font-small-3 m-03">
                        {{formErrors.supplierId}}
                    </div>
                </div>
                <div class="col-xl-1"></div>
                <div class="col-xl-4  mb-3">

                    <app-drop-down-form-control formControlName="orderTypeId" [placeholder]="'نوع الفاتورة'"
                        [data]="invoiceTypesSelectorData"></app-drop-down-form-control>
                    <div *ngIf="formErrors.orderTypeId" class="text-danger  font-small-3 m-03">
                        {{formErrors.orderTypeId}}
                    </div>

                </div>
                <!-- <div class="col-xl-3 mb-3">

                    <button class="btn btn-secondary me-2" (click)="getSupplierItemsBySupplierId()">
                        <i class="fas fa-upload"></i>
                        <span class="ms-2">تحميل أصناف المورد</span>
                    </button>

                </div> -->
                <!-- <div class="col-xl-1"></div> -->
                <ng-container *ngIf="!isUpdate">
                    <!-- <div class="col-xl-2  mb-3">
     
                        <div class="form-floating">
                            <input type="text" [value]="selectedReceiveOrder?.orderNumber ?? ''" disabled class="form-control" id="floatingInput1" placeholder="any">
                            <label for="floatingInput1">رقم أمر الاستلام</label>
                        </div>
                        <div *ngIf="formErrors.purchaseOrderId" class="text-danger  font-small-3 m-03">
                            {{formErrors.purchaseOrderId}}
                        </div>
                    </div> -->
                    <div *ngIf="selectedSupplierId" class="col-xl-2 mb-3">
                      
                        <app-receive-orders-side-panel [selectedSupplierId]="selectedSupplierId" (selectedOrder)="searchOrderSelected($event)"></app-receive-orders-side-panel>
         
                    </div>
                 </ng-container>
                

                <div class="col-xl-4 mb-3">


                    <div class="form-floating mb-3">
                        <input type="date" formControlName="orderDate" class="form-control" id="floatingInput1"
                            placeholder="any">
                        <label for="floatingInput6">تاريخ الاصدار</label>
                        <div *ngIf="formErrors.orderDate" class="text-danger  font-small-3 m-03">
                            {{formErrors.orderDate}}
                        </div>
                    </div>

                </div>
                <div class="col-xl-1"></div>
                <div class="col-xl-4">


                    <div class="form-floating mb-3">
                        <input type="date" formControlName="dueDate" class="form-control" id="floatingInput1"
                            placeholder="any">
                        <label for="floatingInput6">تاريخ الاستحقاق</label>
                        <div *ngIf="formErrors.dueDate" class="text-danger  font-small-3 m-03">
                            {{formErrors.dueDate}}
                        </div>
                    </div>

                </div>
                
                <div class="col-xl-4 mb-3">
                    <div class="form-floating">
                        <input type="text" formControlName="docNumber" class="form-control" id="floatingInput1"
                            placeholder="any">
                        <label for="floatingInput3"> الرقم الدفتري</label>
                        <div *ngIf="formErrors.docNumber" class="text-danger  font-small-3 m-03">
                            {{formErrors.docNumber}}
                        </div>
                    </div>
                </div>
                <div class="col-xl-1"></div>
                <div class="col-xl-9">
                    <div class="form-floating mb-3">
                        <textarea type="text" formControlName="notes" class="form-control" id="floatingInput10"
                            placeholder="ملاحظات"></textarea>
                        <label for="floatingInput10">ملاحظات</label>

                        <div *ngIf="formErrors.notes" class="text-danger  font-small-3 m-03">
                            {{formErrors.notes}}
                        </div>
                    </div>


                </div>
            </div>

            <div class="m-3">
                <button class="btn btn-primary btn-lg fs-6 me-2" (click)="savePurchaseInvoice()">
                    <i class="fas fa-check-circle"></i>
                    <span class="ms-2">حفظ</span>
                </button>
                <button class="btn btn-warning btn-lg fs-6 me-2" (click)="initNewForm()">
                    <i class="fas fa-times"></i>
                    <span class="ms-2">مسح</span>
                </button>
            </div>
        </form>

        <app-general-order-products [selectedProducts]="orderProducts" [clearAllProducts]="clearAllProducts"
                [showEditQuantity]="false" [showAddNew]="false"
            (selectedProductsList)="getSelectedProductsList($event)"></app-general-order-products>
        <!-- <app-order-products [selectedSupplierProducts]="ItemsBySupplier" [clearAllProducts]="clearAllProducts" (selectedProductsList)="getSelectedProductsList($event)"></app-order-products> -->


    </div>
</div>
