<div class="card radius-10 border-0 card-shadow mb-3">
    <div class="card-header bg-white">
        <!-- <h5 class="m-0 fw-bold">عملية الشراء رقم : {{InvoiceNumber}}</h5> -->
        <h6 class="m-0 fw-bold">انشاء فاتورة شراء</h6>
    </div>
    <div class="card-body bg-light">
        <div class="row">
            <div class="col-lg-4 mb-3">
                <div class="form-floating">
                    <input type="text" class="form-control" style="height: calc(3rem)" [(ngModel)]="InvoiceNumber" placeholder="Invoice Number" disabled>
                    <label>رقم الفاتورة</label>
                </div>
            </div>
            <div class="col-lg-4 offset-lg-1">
                <app-erp-selector [SelectorName]="TypeName" [ItemsList]="InvoiceTypesList" (ItemObj)="GetSelectedInvoiceType($event)"></app-erp-selector>
            </div>
            <!-- <div class="col-lg-4 offset-lg-1">
                <app-erp-selector [SelectorName]="BranchName" [ItemsList]="BranchesList"
                    (ItemObj)="GetSelectedBranch($event)"></app-erp-selector>
            </div> -->
        </div>
        <div class="row">
            <div class="col-lg-4 mb-3">
                <div class="form-floating">
                    <input type="date" class="form-control input-size" style="height: calc(3rem)" [(ngModel)]="InvoiceDate" id="floatingInput2" placeholder="any" autocomplete="off">
                    <label for="floatingInput2">تاريخ الفاتورة</label>
                </div>
            </div>
            <div class="col-lg-4 offset-lg-1">
                <app-erp-selector [SelectorName]="SupplierName" [ItemsList]="SuppliersList" (ItemObj)="GetSelectedSupplier($event)"></app-erp-selector>
            </div>
            <div class="col-lg-2">
                <button class="btn btn-secondary me-2" (click)="LoadSupplierItems()">
                    <i class="fas fa-upload"></i>
                    <span class="ms-2">تحميل أصناف المورد</span>
                </button>
            </div>
        </div>
        <div class="row">
            <div class="col-lg-9 h-100 ">
                <!-- <textarea class="form-control" placeholder="Notes *" [(ngModel)]="notes"></textarea> -->

                <div class="form-floating ">
                    <textarea [(ngModel)]="notes" class="form-control" id="floatingInput6" placeholder="any"></textarea>
                    <label for="floatingInput6">Notes</label>
                </div>
            </div>
        </div>
    </div>

    <div class="m-3">
        <button class="btn btn-primary btn-lg fs-6 me-2" (click)="CreateNewPurchaseOrder()">
            <i class="fas fa-check-circle"></i>
            <span class="ms-2">حفظ</span>
        </button>
        <button class="btn btn-secondary btn-lg fs-6 me-2" (click)="PrintOrder()">
            <i class="fas fa-print"></i>
            <span class="ms-2">طباعة</span>
        </button>
        <button class="btn btn-warning btn-lg fs-6 me-2 font-white" (click)="ClearAllFields()">
            <i class="fas fa-trash"></i>
            <span class="ms-2">افراغ الخانات</span>
        </button>
    </div>
</div>



<app-order-products [selectedSupplierProducts]="ItemsBySupplier" [clearAllProducts]="clearAllProducts" (selectedProductsList)="GetSelectedProductsList($event)"></app-order-products>


<ngx-loading [show]="showLoader"></ngx-loading>
