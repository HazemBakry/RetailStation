<div class="inputs-wrapper border rounded bg-white mb-3">
    <div class="inputs-sec-title fw-semibold fs-16 px-3 py-2 border-bottom mb-2">
        كشف حساب مورد
    </div>
    <div class="inputs-sec-content px-3 py-2">

        <div class="row gy-3">
            <div class="col-lg-4">
                <div class="mb-2">
                    <label class="form-label d-flex align-items-center gap-2">
                        المورد
                        <span class="text-danger">*</span>
                    </label>
                    <app-general-selector [data]="suppliersSelectorData" [placeholder]="'الموردين'" [showSearch]="true"
                        (valueChanged)="getSelectedSupplier($event)"></app-general-selector>
                </div>
            </div>
            <div class="col-lg-4">
                <div class="mb-2">
                    <label class="form-label d-flex align-items-center gap-2">
                        من تاريخ
                        <span class="text-danger">*</span>
                    </label>
                    <input [(ngModel)]="fromDate" type="date" autocomplete="off" class="form-control nw-form-input" />
                </div>
            </div>
            <div class="col-lg-4">
                <div class="mb-2">
                    <label class="form-label d-flex align-items-center gap-2">
                        الي تاريخ
                        <span class="text-danger">*</span></label>
                    <input [(ngModel)]="toDate" type="date" autocomplete="off" class="form-control nw-form-input" />
                </div>
            </div>

        </div>
    </div>

    <div class="inputs-sec-title fw-semibold fs-16 px-3 py-2 border-top">
        <button class="btn btn-primary me-2" [disabled]="showLoader" (click)="search()">
            <i class="fas fa-search"></i>
            <span class="ms-2">بحث</span>
        </button>
        <!-- <button [disabled]="showExportLoader" (click)="exportData()"
            class="btn  btn-outline-success gap-2 border rounded px-3 me-2">
            <i class="fas fa-file-download"></i>
            <span>تصدير CSV</span>
        </button> -->
        <button class="btn btn-table-action  gap-2 border rounded px-3 me-2">
            <i class="fas fa-print fs-7"></i>
            <span>طباعة</span>
        </button>
    </div>
</div>

<div class="card radius-10 border-0 card-shadow mb-4">
    <div class="card-body">
        <div class="row p-2">
            <div class="col-md-8">
                <div class="d-flex align-items-center flex-wrap">
                    <!-- <h5 *ngIf="selectedSupplierId" class="m-0"> اسم المورد : {{selectedSupplier?.nameAR}}<span> -
                        </span>{{selectedSupplier?.nameEN}}</h5> -->

                    <div class="search-box position-relative mb-2">
                        <!-- <button class="btn btn-primary mb-2" (click)="(AddModal)">
                            <span class="me-2">إنشاء </span>
                            <i class="uil uil-plus-circle"></i>
                        </button> -->
                    </div>
                    <!-- <ng-container *ngIf="filterList.length > 0">
                        <app-pos-filters [FilterList]="filterList" (filterChanged)="filterChecked($event)"></app-pos-filters>
                    </ng-container> -->
                </div>
            </div>
            <div class="col-md-4">
                <app-erp-pagination (pageChanged)="pageChanged($event)" [currentPage]="pagedResponseModel.currentPage"
                    [pageSize]="pagedResponseModel.pageSize"
                    [totalCount]="pagedResponseModel.totalCount"></app-erp-pagination>
            </div>
        </div>
        <!-- <h5 class="mb-3 fw-bold">Table</h5> -->
        <div class="table-responsive shadow-sm radius-10 table-vp-height">
            <table class="table table-card-table table-borderless table-middle table-hover bg-transparent m-0 ">

                <thead>
                    <tr>

                        <th>رقم العملية</th>
                        <th>نوع العملية</th>
                        <th>تاريخ العملية</th>
                        <th>دائن</th>
                        <th>مدين</th>
                        <th>الرصيد</th>
                        <th>الوصف</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let item of pagedResponseModel.results">

                        <td>{{item.orderNumber}}</td>
                        <td>{{item.orderType}}</td>
                        <td>{{item.orderDate | date}}</td>
                        <td>{{item.debit }}</td>
                        <td>{{item.credit}}</td>
                        <td>{{item.balance}}</td>
                        <td>{{item.description}}</td>

                    </tr>
                    <tr *ngIf="!pagedResponseModel.results.length || showLoader">
                        <td colspan="7" class="text-right">
                            <app-empty-data [showEmptyData]="!pagedResponseModel.results.length&&!showLoader"
                                [showLoader]="showLoader"></app-empty-data>
                        </td>
                    </tr>
                </tbody>
            </table>

        </div>
    </div>
</div>
