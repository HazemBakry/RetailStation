<div class="card radius-10 border-0 card-shadow mb-3">
    <div class="z2-boxstyle1">
        <div class="z2-boxstyle1-header">
            <div class="z2-boxstyle1-header-left">
                <button class="btn btn-primary" routerLink="/Finance/purchases/newPurchasesOrder">
                    <i class="fas fa-plus-circle"></i>
                    <span class="ms-2">New Purchases Order</span>
                </button>
            </div>
        </div>
        <div class="z2-boxstyle1-content hastable">
            <table class="table table-bordered table-middle table-hover m-0 bg-white bigtitle">
                <thead>
                    <tr>
                        <th>Order Number</th>
                        <th>Order Date</th>
                        <th>Total Value</th>
                        <th>Insert User</th>
                        <th>Insert Date</th>
                        <th>Is Locked</th>
                        <th>Is Cancelled</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let item of PurchaseList">
                        <td>{{item.orderNumber}}</td>
                        <td>{{item.orderDate | date}}</td>
                        <td>{{item.totalValue}}</td>
                        <td>{{item.insertUser}}</td>
                        <td>{{item.insertDate | date}}</td>
                        <td>{{item.isLocked}}</td>
                        <td>{{item.isCancelled}}</td>
                        <td>
                            <div class="w-100 d-flex align-items-center justify-content-center">
                                <button class="btn btn-danger me-2" (click)="CancelPurchaseInvoice(item.purchaseOrderID)">
                                    <i class="fas fa-times"></i>
                                    <span class="ms-2">الغاء</span>
                                </button>
                                <!-- <button class="btn btn-secondary me-2">
                                    <i class="far fa-eye"></i>
                                    <span class="ms-2">Lock Order</span>
                                </button>
                                <button class="btn btn-primary me-2">
                                    <i class="fas fa-edit"></i>
                                    <span class="ms-2">Edit</span>
                                </button> -->
                                <button class="btn btn-secondary">
                                    <i class="far fa-eye"></i>
                                    <span class="ms-2">تفاصيل</span>
                                </button>
                            </div>
                        </td>
                    </tr>
                </tbody>

            </table>
        </div>
    </div>
</div>

<ngx-loading [show]="showLoader"></ngx-loading>
