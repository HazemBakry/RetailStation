<div class="card radius-10 border-0 card-shadow mb-3">
    <div class="card-header bg-white">
        <h5 class="m-0 fw-bold">عملية البيع رقم : {{InvoiceNumber}}</h5>
    </div>
    <div class="card-body bg-light">
        <div class="row mb-3">
            <div class="col-lg-4 offset-lg-1">
                <app-erp-selector [SelectorName]="BranchName" [ItemsList]="BranchesList"
                    (ItemObj)="GetSelectedBranch($event)"></app-erp-selector>
            </div>

            <div class="col-lg-4 offset-lg-1">
                <app-erp-selector [SelectorName]="SupplierName" [ItemsList]="SuppliersList"
                    (ItemObj)="GetSelectedSupplier($event)"></app-erp-selector>
            </div>
            <div class="col-lg-2 mt-2">
                <button class="btn btn-secondary" (click)="LoadItemsBySupplier()">
                    <i class="fas fa-upload"></i>
                    <span class="ms-2">تحميل عناصر المورد</span>
                </button>
            </div>
        </div>
        <div class="row">
            <div class="col-lg-9 offset-lg-1 h-100">
                <textarea class="form-control" placeholder="Notes *" [(ngModel)]="notes"></textarea>
            </div>
        </div>
    </div>
</div>

<div class="card radius-10 border-0 card-shadow mb-3">
    <div class="card-header bg-white">
        <div class="d-flex justify-content-between align-items-center">
            <h5 class="fw-bold m-0">العناصر</h5>
            <div>
                <button class="btn btn-secondary me-2" (click)="openItemsModal(ItemModal)">
                    <i class="fas fa-plus-circle"></i>
                    <span class="ms-2">اضافة عنصر</span>
                </button>
                <button class="btn btn-secondary" (click)="openEditQuantityModal(EditQuantityModal)">
                    <i class="fas fa-edit"></i>
                    <span class="ms-2">تعديل الكمية</span>
                </button>
            </div>
        </div>
    </div>
    <div class="card-body bg-light">
        <div class="table-responsive table-vp-height small-scroll">
            <table class="table table-bordered table-middle table-hover bg-white m-0">
                <thead>
                    <tr>
                        <th>الاسم</th>
                        <th>الوحدة</th>
                        <th>السعر</th>
                        <th>الكمية</th>
                        <th>العملية</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let item of RawItemsList;let i = index">
                        <td>{{item.itemName}}</td>
                        <td>{{item.unitName}}</td>
                        <td>{{item.price}}</td>
                        <td>{{item.quantity}}</td>
                        <td class="d-flex">
                            <div>
                                <button class="btn btn-danger btn-rounded" (click)="RemoveItem(i)">
                                    <i class="fas fa-times"></i>
                                </button>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div class="mt-3">
    <button class="btn btn-primary btn-lg fs-6 me-2" (click)="SaveNewPurchaseOrder()">
        <i class="fas fa-check-circle"></i>
        <span class="ms-2">حفظ</span>
    </button>
    <button class="btn btn-warning btn-lg fs-6 me-2" (click)="ClearAllFields()">
        <i class="fas fa-times"></i>
        <span class="ms-2">مسح</span>
    </button>
</div>


<ng-template #ItemModal let-modal>
    <div class="modal-header">
        <h4 class="d-flex align-items-center m-0">
            <div class="ms-3">اضافة عنصر</div>
        </h4>
        <button class="btn btn-danger" (click)="modal.dismiss()">
            <i class="fas fa-times"></i>
        </button>
    </div>
    <div class="modal-body bg-light">
        <div class="d-flex align-items-center mb-2">
            <div class="card order-card-payment shadow-sm cursor-pointer w-50 me-2" (click)="ItemTypeChange('Item')"
                [ngClass]="{'active': activeTab == 'Item' }">
                <div class="card-body d-flex align-items-center">
                    <span class="ms-3">عنصر</span>
                </div>
            </div>
            <div class="card order-card-payment shadow-sm cursor-pointer w-50 me-3" (click)="ItemTypeChange('Lookups')"
                [ngClass]="{'active': activeTab == 'Lookups'}">
                <div class="card-body d-flex align-items-center">
                    <span class="ms-3">المخزن</span>
                </div>
            </div>
        </div>
        <hr class="border-dark">
        <div class="row" *ngIf="activeTab == 'Item'">
            <div class="col-lg-12">
                <div class="mb-3">
                    <app-erp-selector-with-search [SelectorName]="'العناصر'" [ItemsList]="ItemsList"
                        (ItemObj)="GetSelectedItem($event)"></app-erp-selector-with-search>
                </div>
            </div>
            <div class="col-lg-12">
                <div class="mb-3">
                    <i class="fas fa-info-circle ms-2 text-muted cursor-pointer me-2"
                        ngbPopover="Here will be information about field!" placement="end"
                        triggers="mouseenter:mouseleave"></i>
                    <label for="exampleFormControlInput1" class="form-label">الوحدة

                    </label>
                    <input type="text" [(ngModel)]="AddNewItem.unitName" disabled class="form-control py-3"
                        id="exampleFormControlInput1">
                </div>
            </div>
            <div class="col-lg-12">
                <div class="mb-3">
                    <i class="fas fa-info-circle ms-2 text-muted cursor-pointer me-2"
                        ngbPopover="Here will be information about field!" placement="end"
                        triggers="mouseenter:mouseleave"></i>
                    <label for="exampleFormControlInput1" class="form-label">السعر <sup class="text-danger">*</sup>

                    </label>
                    <input type="text" [(ngModel)]="AddNewItem.price" disabled class="form-control py-3"
                        id="exampleFormControlInput1">
                </div>
            </div>
            <div class="col-lg-12">
                <div class="mb-3">
                    <i class="fas fa-info-circle ms-2 text-muted cursor-pointer me-2"
                        ngbPopover="Here will be information about field!" placement="end"
                        triggers="mouseenter:mouseleave"></i>
                    <label for="exampleFormControlInput1" class="form-label">الكمية <sup class="text-danger">*</sup>

                    </label>
                    <input type="text" [(ngModel)]="AddNewItem.quantity" class="form-control py-3" autocomplete="off"
                        id="exampleFormControlInput1">
                </div>
            </div>
        </div>
        <div class="mb-3" *ngIf="activeTab == 'Lookups'">
            <app-erp-selector [SelectorName]="'المخزون'" [ItemsList]="LookupsList"
                (ItemObj)="GetSelectedLookup($event)"></app-erp-selector>
        </div>
    </div>
    <div class="modal-footer flex-nowrap">
        <button class="btn btn-primary w-100 justify-content-center py-3 fs-5 radius-10" (click)="SaveSelectedItem()">
            <i class="fas fa-check-square"></i>
            <span class="ms-2">Save</span>
        </button>
    </div>
</ng-template>

<ng-template #EditQuantityModal let-modal>
    <div class="modal-header">
        <h4 class="d-flex align-items-center m-0">
            <div class="ms-3">تعديل الكمية</div>
        </h4>
        <button class="btn btn-danger" (click)="modal.dismiss()">
            <i class="fas fa-times"></i>
        </button>
    </div>
    <div class="modal-body bg-light">
        <div class="row">
            <div class="col-lg-12" *ngFor="let item of EditQuantityList">
                <div class="mb-3">
                    <i class="fas fa-info-circle ms-2 text-muted cursor-pointer me-2"
                        ngbPopover="Here will be information about field!" placement="end"
                        triggers="mouseenter:mouseleave"></i>
                    <label for="exampleFormControlInput1" class="form-label">{{item.itemName}} <sup
                            class="text-danger">*</sup>

                    </label>
                    <input type="text" [(ngModel)]="item.quantity" class="form-control py-3"
                        id="exampleFormControlInput1">
                </div>
            </div>
        </div>
    </div>
    <div class="modal-footer flex-nowrap">
        <button class="btn btn-primary w-100 justify-content-center py-3 fs-5 radius-10" (click)="ChangeNewQuantity()">
            <i class="fas fa-check-square"></i>
            <span class="ms-2">حفظ</span>
        </button>
    </div>
</ng-template>
