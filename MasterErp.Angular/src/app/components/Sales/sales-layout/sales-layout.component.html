<app-header (toggler)="onToggler()"></app-header>
<main id="app">
    <div class="app-content">
        <!-- <app-sidebar [toggler]="toggler"></app-sidebar> -->


        <aside id="main_sidebar" class="main-sidebar" [ngClass]="{'toggled': toggler}">
            <ul class="nav list-unstyled flex-column p-0 m-0 small-scroll overflow-auto h-100 flex-column flex-nowrap">
                <div class="nalika-profile" style="background: #16487ad9;color: white;">
                    <a class="nav-link cursor-pointer text-dark d-flex align-items-center justify-content-between w-100" routerLink="/" routerLinkActive="active">
                        <div class="nav-text d-flex align-items-center w-100">
                            <i class="uil uil-home nav-icon" style="font-size: 20px; color: white;"></i>
                            <span class="nav-link-text item-sidebar fw-bold main-nav-link ms-3" style="color: white; font-size: 14px;">الرئيسية
                                </span>
                        </div>
                    </a>
                </div>
                <li class="nav-item nav-item-item">
                    <a class="nav-link main-nav cursor-pointer text-dark d-flex align-items-center justify-content-between w-100 active" (click)="toggleMenu(menu_Sales)" [ngClass]="{'active': menu_Sales.classList.contains('show')}">
                        <div class="nav-text d-flex align-items-center w-100">
                            <i class="uil uil-database nav-icon"></i>
                            <span class="nav-link-text item-sidebar main-nav-link ms-3">المبيعات</span>
                        </div>
                        <div class="nav-collapse">
                            <i class="uil uil-angle-left-b"></i>
                        </div>
                    </a>
                    <ul class="nav list-unstyled nav-sub-list flex-column p-0 m-0 show" #menu_Sales>
                        <li class="nav-item">
                            <a class="nav-link sub-nav cursor-pointer d-flex align-items-center" routerLink="./sales-invoices" routerLinkActive="active">
                                <div class="nav-text d-flex align-items-center w-100">
                                    <i class="uil uil-users-alt nav-icon"></i>
                                    <span class="nav-link-text item-sidebar main-nav-link ms-3">فواتير المبيعات</span>
                                </div>
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link sub-nav cursor-pointer d-flex align-items-center" routerLink="./add-sales-invoice" routerLinkActive="active">
                                <div class="nav-text d-flex align-items-center w-100">
                                    <i class="uil uil-users-alt nav-icon"></i>
                                    <span class="nav-link-text item-sidebar main-nav-link ms-3">انشاء فاتورة
                                        مبيعات</span>
                                </div>
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link sub-nav cursor-pointer d-flex align-items-center" routerLink="/Finance./sales-returns" routerLinkActive="active">
                                <div class="nav-text d-flex align-items-center w-100">
                                    <i class="uil uil-users-alt nav-icon"></i>
                                    <span class="nav-link-text item-sidebar main-nav-link ms-3">مرتجعات المبيعات</span>
                                </div>
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link sub-nav cursor-pointer d-flex align-items-center" routerLink="/Finance./customer-statement" routerLinkActive="active">
                                <div class="nav-text d-flex align-items-center w-100">
                                    <i class="uil uil-users-alt nav-icon"></i>
                                    <span class="nav-link-text item-sidebar main-nav-link ms-3">كشف حساب عميل</span>
                                </div>
                            </a>
                        </li>
                    </ul>
                </li>
            </ul>
        </aside>





        <div class="main-content" [ngClass]="{'toggled': toggler}">
            <router-outlet></router-outlet>
        </div>
    </div>
</main>
