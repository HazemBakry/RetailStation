  <div class="card radius-10 border-0 card-shadow">
    <div class="card-header bg-white">
      <h6 class="fw-bold m-0">رمز الحساب</h6>
    </div>
    <div class="card-body bg-light">
      <div class="row">
        <div class="col-lg-6">
          <div class="row gy-3">
            <!-- <div class="col-md-6">
              <select class="form-control" (change)="changeSearchType($event)">
                <option value="accountName" selected>اسم الحساب</option>
                <option value="accountNumber" >رقم الحساب</option>
              </select>
            </div> -->
            <div class="col-md-12">
              <div class="input-group">
                <span class="input-group-text">
                  <button (click)="loadData()" class="border-0">
                    <i  class="fas fa-search"></i>
                  </button>
                    
                </span>
                <input [(ngModel)]="SearchText" (keyup.enter)="loadData()" type="text" placeholder="اسم الحساب" class="form-control">
              </div>
            </div>
            <!-- <div class="col-md-12">
              <select class="form-control">
                <option value="0" selected disabled>رقم الحساب</option>
                <option value="1">حساب 1</option>
                <option value="2">حساب 2</option>
                <option value="3">حساب 3</option>
                <option value="4">حساب 4</option>
              </select>
            </div> -->
            <div *ngIf="AccountTreeData && AccountTreeData.length>0" class="col-md-12">
                <div class="border bg-white small-scroll overflow-auto p-2 max-height-350">
                
                    <div *ngFor="let account of AccountTreeData">
                        <app-account-tree-item  [account]="account"></app-account-tree-item>
                    </div>
                </div>
                
            </div>
          </div>
        </div>
        <div class="col-lg-6">
          <div class="row mb-3">
            <label class="col-sm-3 col-form-label col-form-label-sm">رمز الحساب</label>
            <div class="col-sm-9">
              <input [(ngModel)]="accountTreeModel.accountNumber" placeholder="رمز الحساب" type="text" class="form-control form-control-sm"  >
            </div>
          </div>
          <div class="row mb-3">
            <label class="col-sm-3 col-form-label col-form-label-sm">اسم الحساب</label>
            <div class="col-sm-9">
              <div class="input-group">
                <span class="input-group-text">
                  <i class="fas fa-user"></i>
                </span>
                <input [(ngModel)]="accountTreeModel.nameEN"  type="text" class="form-control" placeholder="اسم الحساب">
              </div>
            </div>
          </div>
          <div class="row">

            <label class="col-sm-3 col-form-label col-form-label-sm">نوع الحساب</label>
            <div class="col-sm-9">
                <app-erp-selector-with-search #Selector [SelectorName]="'نوع الحساب'" [ItemsList]="accountTypes" [Height]="'30px'" [SearchKey]="'nameAR'" (ItemObj)="GetSelectedAccountType($event)">
                </app-erp-selector-with-search>

            </div>
               
            <!-- <label class="col-sm-3 col-form-label col-form-label-sm">نوع الحساب</label>
            <div class="col-sm-9">
              <select class="form-control">
                <option value="0" disabled selected>اختر...</option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
              </select>
            </div> -->
          </div>
        
          <!-- <hr class="my-4" /> -->
          <div class="row">

            <label class="col-sm-3 col-form-label col-form-label-sm">متفرع من حساب</label>
            <div class="col-sm-9">
              <app-erp-selector-with-search #Selector1 
                [SelectorName]="'اسم الحساب'" 
                [ItemsList]="parentAccountsList" [Height]="'30px'"
                [SearchKey]="'nameAR'" (ItemObj)="GetSelectedParentAccount($event)">
              </app-erp-selector-with-search>
          
            </div>
          </div>
          <hr class="my-4" />

          <div class="row mb-3">
            <label class="col-sm-3 col-form-label col-form-label-sm">العملة الافتراضية</label>
            <div class="col-sm-9">
              <app-erp-selector-with-search #Selector [SelectorName]="'نوع العملة'" [ItemsList]="currencyType" [Height]="'30px'" [SearchKey]="'nameAR'" (ItemObj)="GetSelectedCurrencyType($event)">
              </app-erp-selector-with-search>

            </div>
            <!-- <div class="col-sm-9">
              <select class="form-control">
                <option value="0" disabled selected>اختر...</option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
              </select>
            </div> -->
          </div>
          <div class="row mb-3">
            <label class="col-sm-3 col-form-label col-form-label-sm">دعم مركز التكلفة </label>
            <div class="col-sm-9">
              <input [(ngModel)]="accountTreeModel.isDisToCostCenter" class="form-check-input" type="checkbox"  id="flexCheckDefault">
            </div>
          </div>
          
          <div class="row mb-3">
            <label class="col-sm-3 col-form-label col-form-label-sm">Is Account Freezed</label>
            <div class="col-sm-9">
              <div class="d-flex align-items-center">
                <input [(ngModel)]="accountTreeModel.isActive" class="form-check-input" type="checkbox"  id="flexCheckDefault">
                
                <!-- <button (click)="CreateNewAccount()" class="btn btn-primary ms-2">
                  <i class="fas fa-cogs"></i>
                  <span class="ms-2">Save</span>
                </button> -->

                
              </div>
              
            </div>
          </div>

          <div class="row mb-3">
            <div class="col-sm-9">
              <div class="d-flex align-items-center">
                <button (click)="CreateNewAccount()" class="btn btn-primary ms-2">
                  <i class="fas fa-cogs"></i>
                  <span class="ms-2">Save</span>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>



 

  <ngx-loading [show]="showLoader"></ngx-loading>
