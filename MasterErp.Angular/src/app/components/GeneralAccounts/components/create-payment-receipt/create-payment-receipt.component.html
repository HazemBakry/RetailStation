<div class="inputs-wrapper border rounded bg-white mb-3">
    <div class="inputs-sec-title fw-semibold fs-16 px-3 py-2 border-bottom mb-2">سندات الصرف</div>
    <div class="inputs-sec-content px-3 py-2">
        <div class="row gy-3">
            <div class="col-lg-6">
                <div class="mb-3">
                    <label class="form-label d-flex align-items-center gap-2">رقم الايصال <span class="text-danger">*</span></label>
                    <select class="form-select nw-form-input nw-form-select">
              <option value="ACC-PAY-.YYYY.-">ACC-PAY-.YYYY.-</option>
            </select>
                </div>
            </div>
            <div class="col-lg-6">
                <div class="mb-3">
                    <label class="form-label d-flex align-items-center gap-2">تاريخ النشر <span
                class="text-danger">*</span></label>
                    <input type="date" class="form-control nw-form-input" />
                </div>
            </div>
            <div class="col-lg-6">
                <div class="mb-3">
                    <label class="form-label d-flex align-items-center gap-2">نوع الدفع <span class="text-danger">*</span></label>
                    <select class="form-select nw-form-input nw-form-select">
              <option value="Receive">Receive</option>
              <option value="Pay">Pay</option>
              <option value="Internal Transfer">Internal Transfer</option>
            </select>
                </div>
            </div>
            <div class="col-lg-6">
                <div class="mb-3">
                    <label class="form-label d-flex align-items-center gap-2">الشركة <span class="text-danger">*</span></label>
                    <input type="text" class="form-control nw-form-input" value="Mishwar (Demo)" />
                </div>
            </div>
            <div class="col-lg-6">
                <div class="mb-3">
                    <label class="form-label d-flex align-items-center gap-2">طريقة الدفع <span
                class="text-danger">*</span></label>
                    <div ngbDropdown class="dropdown-filter-wrapper dropdown-as-input d-inline-block w-100">
                        <div class="position-relative">
                            <input type="text" class="form-control nw-form-input" #inputDrop ngbDropdownToggle [value]="inputDropdownValue">
                            <div class="input-drop-action d-flex align-items-center gap-1 fw-normal" *ngIf="inputDrop.value != ''">
                                <i class="uil uil-times cursor-pointer" (click)="inputDrop.value = ''"></i>
                                <i class="uil uil-corner-up-left-alt cursor-pointer"></i>
                            </div>
                        </div>
                        <div ngbDropdownMenu class="dropdown-menu-search-input p-0 overflow-hidden w-100 shadow-sm">
                            <div class="max-height-150 min-width-200 overflow-auto small-scroll">
                                <div class="check-row" *ngFor="let payment of paymentList">
                                    <a class="dropdown-item cursor-pointer fw-semibold" (click)="onChoosePayment(payment)">{{ payment
                      }}</a>
                                </div>
                            </div>
                            <div class="d-flex flex-column gap-2 bg-light border-top p-2">
                                <div class="check-row">
                                    <a class="dropdown-item d-flex align-items-center gap-2 cursor-pointer px-1">
                                        <i class="uil uil-plus"></i>
                                        <span>إنشاء طريقة دفع جديدة</span>
                                    </a>
                                </div>
                                <div class="check-row">
                                    <a class="dropdown-item d-flex align-items-center gap-2 cursor-pointer px-1">
                                        <i class="uil uil-search"></i>
                                        <span>بحث متقدم</span>
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

















<div class="card radius-10 border-0 card-shadow mb-3">
    <div class="card-header bg-white">
        <h5 class="m-0 fw-bold">سندات الصرف</h5>
    </div>
    <div class="card-body bg-light">
        <div class="row ">
            <div class="col-lg-3 offset-lg-1 mb-3">
                <div class="form-floating">
                    <input type="text" disabled [(ngModel)]="paymentReceiptModel.receiptNumber" class="form-control input-size" id="floatingInput2" placeholder="any" autocomplete="off">
                    <label for="floatingInput2"> رقم الايصال</label>
                </div>
            </div>
            <div class="col-lg-3 offset-lg-1 mb-3">
                <div class="form-floating">
                    <input type="text" [(ngModel)]="paymentReceiptModel.benefitPerson" class="form-control input-size" id="floatingInput2" placeholder="any" autocomplete="off">
                    <label for="floatingInput2"> اسم المستفيد</label>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-lg-3 offset-lg-1 mb-3">
                <app-erp-selector-with-search #Selector [SelectorName]="'طريقه الدفع'" [ItemsList]="paymentTypeList" [Height]="'35px'" [SearchKey]="'nameAR'" (ItemObj)="GetSelectedPaymentType($event)">
                </app-erp-selector-with-search>
            </div>
            <div class="col-lg-3 offset-lg-1 mb-3">

                <app-erp-selector-with-search #Selector [SelectorName]="'دفتر  ايصال'" [ItemsList]="receiptLedgerList" [Height]="'35px'" [SearchKey]="'nameAR'" [innerTextKey]="'nameAR'" (ItemObj)="GetSelectedReceiptLedger($event)">
                </app-erp-selector-with-search>
            </div>
        </div>

        <div class="row">
            <div class="col-lg-3 offset-lg-1 mb-3">
                <app-erp-selector-with-search #Selector [SelectorName]="'نوع  جهة التعامل'" [ItemsList]="agencyTypeList" [Height]="'35px'" [SearchKey]="'nameAR'" (ItemObj)="GetSelectedAgencyType($event)">
                </app-erp-selector-with-search>

            </div>
            <div *ngIf="selectedAgencyType == 0" class="col-lg-3 offset-lg-1 mb-3">
                <app-erp-selector-with-search #Selector [SelectorName]="'جهة التعامل'" [ItemsList]="supplierList" [Height]="'35px'" [SearchKey]="'nameAR'" (ItemObj)="GetSelectedSupplier($event)">
                </app-erp-selector-with-search>
            </div>

            <div *ngIf="selectedAgencyType == 1" class="col-lg-3 offset-lg-1 mb-3">
                <app-erp-selector-with-search #Selector [SelectorName]="'الحسابات'" [ItemsList]="accountList" [Height]="'35px'" [SearchKey]="'nameAR'" (ItemObj)="GetSelectedAccount($event)">
                </app-erp-selector-with-search>
            </div>
        </div>
        <div class="row">
            <div class="col-lg-3 offset-lg-1 mb-3" *ngIf="paymentReceiptModel?.paymentTypeId==3">
                <div class="form-floating">
                    <input type="text" [(ngModel)]="paymentReceiptModel.chequeNumber" class="form-control input-size" id="floatingInput2" placeholder="any" autocomplete="off">
                    <label for="floatingInput2"> رقم الشيك</label>
                </div>
            </div>
        </div>

        <div class="row">

            <div class="col-lg-3 offset-lg-1 mb-3">

                <div class="form-floating">
                    <input type="date" class="form-control input-size" [(ngModel)]="paymentReceiptModel.releaseDate" id="floatingInput2" placeholder="any" autocomplete="off">
                    <label for="floatingInput2">تاريخ </label>
                </div>
            </div>
            <div class="col-lg-3 offset-lg-1 mb-3">
                <div class="form-floating">
                    <input type="text" [(ngModel)]="paymentReceiptModel.docNumber" class="form-control input-size" id="floatingInput2" placeholder="any" autocomplete="off">
                    <label for="floatingInput2"> الرقم الدفتري</label>
                </div>
            </div>
        </div>
        <div class="row">

            <div class="col-lg-3 offset-lg-1 mb-3">
                <div class="form-floating">
                    <input type="number" [(ngModel)]="paymentReceiptModel.moneyAmount" class="form-control input-size" id="floatingInput2" placeholder="any" autocomplete="off">
                    <label for="floatingInput2"> المبلغ</label>
                </div>
            </div>
        </div>

        <div class="row mb-3">
            <div class="col-lg-9 offset-lg-1 h-100">
                <div class="form-floating">
                    <textarea type="text" [(ngModel)]="paymentReceiptModel.notes" class="form-control " id="floatingInput2" placeholder="any" autocomplete="off">
                    </textarea>
                    <label for="floatingInput2">البيان</label>
                </div>
            </div>
        </div>

        <!-- <div class="row">
            <div class="col-lg-3 offset-lg-1 mb-3">
                <div class="justify-content-center">

                    <span class="m-2 "> تحويل داخلي</span>
                    <input class="mt-5" type="checkbox" class="big-checkbox">
                </div>


            </div>
        </div> -->
        <div class="card-body ">
            <div class="offset-lg-1">

                <button class="btn btn-primary btn-lg fs-6 me-2" (click)="SavePaymentReceipt()">
                    <i class="fas fa-check-circle"></i>
                    <span class="ms-2">حفظ</span>
                </button>

                <button class="btn btn-warning btn-lg fs-6 me-2" (click)="ClearAllFields()">
                    <i class="fas fa-times"></i>
                    <span class="ms-2">مسح</span>
                </button>
            </div>

        </div>
    </div>
</div>
