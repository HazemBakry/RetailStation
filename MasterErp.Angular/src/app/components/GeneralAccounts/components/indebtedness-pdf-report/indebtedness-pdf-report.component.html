<app-breadcrumb [TitleList]="TitleList"></app-breadcrumb>
<div class="inputs-wrapper border rounded bg-white mb-3">
    <div class="inputs-sec-title fw-semibold fs-16 px-3 py-2 border-bottom mb-2">مديونية الشركة</div>
    <div class="inputs-sec-title fw-semibold fs-16 px-3 py-2 border-top mb-2">
        <button (click)="printData()" class="btn btn-table-action  gap-2 border rounded px-3 me-2">
            <i class="fas fa-print fs-7"></i>
            <span>طباعة</span>
        </button>
    </div>
</div>
<div class="mb-3">
    <div class="mb-3">
        <div class="card radius-10 border-0 card-shadow" #printSection>
            <div class="card-body">
                <div class="table-responsive large-scroll">
                    <table class="table table-bordered table-middle table-hover bg-white mb-3 table-fixed-width">
                        <thead>
                            <tr>
                                <th>المديونيات</th>
                                <th>
                                    <ng-container *ngIf="isPrinting; else editableheader1">
                                        <div class="text-center">{{ header1 }}</div>
                                    </ng-container>
                                    <ng-template #editableheader1>
                                        <input type="date" autocomplete="off" class="form-control nw-form-input" [(ngModel)]="header1" />
                                    </ng-template>
                                </th>
                                <th>
                                    <ng-container *ngIf="isPrinting; else editableheader2">
                                        <div class="text-center">{{ header2 }}</div>
                                    </ng-container>
                                    <ng-template #editableheader2>
                                        <input type="date" autocomplete="off" class="form-control nw-form-input" [(ngModel)]="header2" />
                                    </ng-template>
                                </th>
                                <th>الفروقات</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr *ngFor="let item of valueKeys">
                                <th style="background-color: #f7f7f7;">{{ item.key }}</th>
                                <td>
                                    <ng-container *ngIf="isPrinting; else editableInput1">
                                        <div class="text-center">{{ item.value1 }}</div>
                                    </ng-container>
                                    <ng-template #editableInput1>
                                        <input type="number" class="form-control form-control-sm text-center" [(ngModel)]="item.value1" (input)="calculateTotal(item)" />
                                    </ng-template>
                                </td>
                                <td>
                                    <ng-container *ngIf="isPrinting; else editableInput2">
                                        <div class="text-center">{{ item.value2 }}</div>
                                    </ng-container>
                                    <ng-template #editableInput2>
                                        <input type="number" class="form-control form-control-sm text-center" [(ngModel)]="item.value2" (input)="calculateTotal(item)" />
                                    </ng-template>
                                </td>
                                <td>
                                    <div class="text-center">{{ item.diff }}</div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div class="d-flex align-items-center mb-4">
                    <div class="w-100 me-2">
                        <label class="form-label d-flex align-items-center gap-2">أجمالي المديونية</label>
                        <div class="form-control nw-form-input w-100 text-center">{{ TotalValue }}</div>
                    </div>
                    <div class="w-100">
                        <label class="form-label d-flex align-items-center gap-2">إجمالي الفروقات</label>
                        <div class="form-control nw-form-input w-100 text-center">{{ TotalDiffValue }}</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
