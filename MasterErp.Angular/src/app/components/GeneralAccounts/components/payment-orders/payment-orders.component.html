            <app-erp-pagination (pageChanged)="pageChanged($event)" [currentPage]="pagedResponseModel.currentPage" [pageSize]="pagedResponseModel.pageSize" [totalCount]="pagedResponseModel.totalCount"></app-erp-pagination>

    <div class="p-3 bg-white">
        <div class="table-responsive shadow-sm radius-10">
            <table class="table table-card-table table-borderless table-middle table-hover bg-transparent m-0">
                <thead>
                    <tr>
                        <th>رقم الأمر</th>
                        <th>اسم المستفيد</th>
                        <!-- <th>دفتر إيصال</th> -->
                        <th>تاريخ الاصدار</th>
                        <th>طريقة الدفع</th>
                        <!-- <th>نوع جهة التعامل</th>
                    <th>جهة التعامل</th> -->

                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let item of pagedResponseModel.results">

                        <td>{{item.contactName}}</td>

                        <td>{{item.moneyAmount}}</td>
                        <!-- <td>{{item.receiptTypeName}}</td> -->

                                    </button>
                                    <div ngbDropdownMenu class="border">
                                        <button *ngIf="![wfStatus.Cancelled , wfStatus.Paid].includes(item.workflowStatusId)" ngbDropdownItem (click)="cancelPaymentOrder(item.paymentOrderId)">اسقاط</button>
                                        <button *ngIf="![wfStatus.Cancelled , wfStatus.Paid].includes(item.workflowStatusId)" ngbDropdownItem routerLink="/general-accounts/create-payment-receipt" [queryParams]="{PaymentOrderId:item.paymentOrderId}">انشاء سند
                                            الصرف</button>
                                        <button ngbDropdownItem (click)="openSidePanel(item.paymentOrderId)">
                                            تفاصيل</button>
                                    </div>
                                </div>
                            </div>
                            <!-- <div class="w-100 d-flex align-items-center justify-content-center">

                                    <span>إلغاء</span>
                                </button>
                                <button class="btn btn-primary me-2">
                                    <i class="fas fa-edit"></i>
                                    <span class="ms-2">Edit</span>
                                </button>
                            </div> -->
                        </td>
                    </tr>
                    <tr *ngIf="!pagedResponseModel.results.length">
                        <td colspan="9" class="text-right">
                            <app-empty-data [showEmptyData]="!pagedResponseModel.results.length"></app-empty-data>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

<ngx-loading [show]="showLoader"></ngx-loading>

<ng-template #DetailsSidePanel let-offcanvas>
    <div class="offcanvas-header justify-content-between gap-3 fs-4 border-bottom py-3">
        <div class="d-flex align-items-center gap-2">
            <i class="fas fa-info-circle offcanvas-header-icon"></i>
            <span>
                تفاصيل القيد رقم {{paymentOrderDetailsModel?.orderNumber}}
            </span>
        </div>
        <div class="cursor-pointer text-danger fs-2" (click)="offcanvas.dismiss()">
            <i class="uil uil-times-circle"></i>
        </div>
    </div>
    <div class="offcanvas-body pt-4 bg-light">

        <div *ngIf="paymentOrderDetailsModel" class="employee-card-body mb-3">
            <div class="inputs-wrapper border rounded bg-white mb-3">
                <div class="inputs-sec-content px-3 py-3">
                    <div class="row gy-3">
                        <div class="col-lg-6">
                            <div class="mb-2">
                                <label class="form-label d-flex align-items-center gap-2">رقم الطلب</label>
                                <input type="text" disabled class="form-control nw-form-input" ngModel={{paymentOrderDetailsModel?.orderNumber}} />
                            </div>
                        </div>
                        <div class="col-lg-6">
                            <div class="mb-2">
                                <label class="form-label d-flex align-items-center gap-2">تاريخ الطلب</label>
                                <input type="text" disabled class="form-control nw-form-input" ngModel={{paymentOrderDetailsModel?.releaseDate|date}} />
                            </div>
                        </div>
                        <div class="col-lg-6">
                            <div class="mb-2">
                                <label class="form-label d-flex align-items-center gap-2">المبلغ</label>
                                <input type="text" disabled class="form-control nw-form-input" ngModel={{paymentOrderDetailsModel?.moneyAmount}} />
                            </div>
                        </div>
                        <div class="col-lg-6">
                            <div class="mb-2">
                                <label class="form-label d-flex align-items-center gap-2">الحالة</label>
                                <span appWorkflowStatus [id]="paymentOrderDetailsModel.workflowStatusId" [nameEN]="paymentOrderDetailsModel?.workflowStatusNameEN" [nameAR]="paymentOrderDetailsModel?.workflowStatusNameAR">
                                </span>
                            </div>
                        </div>
                        <div class="col-lg-6">
                            <div class="mb-2">
                                <label class="form-label d-flex align-items-center gap-2">نوع الدفع</label>
                                <input type="text" disabled class="form-control nw-form-input" ngModel={{paymentOrderDetailsModel?.paymentTypeName}} />
                            </div>
                        </div>
                        <div class="col-lg-12">
                            <div class="mb-2">
                                <label class="form-label d-flex align-items-center gap-2">المستفيد</label>
                                <input type="text" disabled class="form-control nw-form-input" ngModel={{paymentOrderDetailsModel?.contactName}} />
                            </div>
                        </div>
                        <div class="col-lg-12">
                            <div class="mb-2">
                                <label class="form-label d-flex align-items-center gap-2">
                                    البيان
                                </label>
                                <input type="text" disabled class="form-control nw-form-input description-area" ngModel={{paymentOrderDetailsModel?.description}} />
                            </div>
                        </div>
                    </div>
                </div>
                <!-- <div class="d-flex justify-content-start m-3">
                    <button (click)="offcanvas.dismiss()"  class="button-table-action btn-edit d-flex align-items-center justify-content-center gap-2 me-2">
                        <i class="uil uil-pen"></i>
                        <span>تعديل</span>
                    </button>
                    <button class="btn btn-table-action  gap-2 border rounded px-3 me-2">
                        <i class="fas fa-print fs-7"></i>
                        <span>طباعة</span>
                    </button>
                </div> -->
            </div>
        </div>

        <!-- <hr class="border-black" /> -->


    </div>

</ng-template>
