<app-breadcrumb [TitleList]="TitleList"></app-breadcrumb>


<div class="inputs-wrapper border rounded bg-white mb-3">
    <div class="inputs-sec-title fw-semibold fs-16 px-3 py-2 border-bottom mb-2">سند صرف</div>
    <div class="inputs-sec-content px-3 py-3">
        <form [formGroup]="formGroup" autocomplete="off">
            <div class="row gy-3">
                <div class="col-lg-6">
                    <div class="mb-2">
                        <label class="form-label d-flex align-items-center gap-2">رقم الايصال <span
                                class="text-danger">*</span></label>
                        <input type="text" disabled class="form-control nw-form-input" formControlName="receiptNumber" />
                    </div>
                </div>
                <div class="col-lg-6">
                    <div class="mb-2">
                        <label class="form-label d-flex align-items-center gap-2">المستفيـد<span
                                class="text-danger">*</span></label>

                        <input type="text" class="form-control nw-form-input" formControlName="contactName" />
                    </div>
                </div>
                <div class="col-lg-6">
                    <div class="mb-2">
                        <label class="form-label d-flex align-items-center gap-2">تاريخ السند <span
                                class="text-danger">*</span></label>
                        <input type="date" class="form-control nw-form-input" formControlName="releaseDate" placeholder="any" autocomplete="off">
                    </div>
                </div>
                <div class="col-lg-6">
                    <div class="mb-2">
                        <label class="form-label d-flex align-items-center gap-2">طريقة الدفع <span
                                class="text-danger">*</span></label>

                        <app-general-selector formControlName="paymentTypeId" [data]="paymentTypeList" [placeholder]="'طريقة الدفع'"></app-general-selector>
                    </div>
                </div>
                <div class="col-lg-6">
                    <div class="mb-2">
                        <label class="form-label d-flex align-items-center gap-2">نوع جهة التعامل <span
                                class="text-danger">*</span></label>
                        <!-- <app-general-selector [data]="agencyTypeList" (ItemObj)="GetSelectedAgencyType($event)">
                        </app-general-selector> -->

                        <app-general-selector formControlName="agencyTypeId" [data]="agencyTypeList" (valueChanged)="getSelectedAgencyType($event)" [placeholder]="'نوع جهة التعامل '"></app-general-selector>
                    </div>
                </div>
                <div class="col-lg-6">
                    <div class="mb-2">
                        <label class="form-label d-flex align-items-center gap-2">الحساب / جهة التعامل <span
                                class="text-danger">*</span></label>
                        <app-general-selector *ngIf="selectedAgencyType == 1" formControlName="accountId" [data]="accountList" [placeholder]="'الحساب'">
                        </app-general-selector>

                        <app-general-selector *ngIf="selectedAgencyType == 3" formControlName="customerId" [data]="customerList" [placeholder]="'العميل'">
                        </app-general-selector>
                    </div>
                </div>
                <div class="col-lg-6">
                    <div class="mb-2">
                        <label class="form-label d-flex align-items-center gap-2"> دفتر الايصال <span
                                class="text-danger">*</span></label>

                        <app-general-selector formControlName="receiptLedgerId" [data]="receiptLedgerList" [placeholder]="'دفتر الإيصال'"></app-general-selector>

                        <!-- <app-erp-selector-with-search #Selector [ItemsList]="receiptLedgerList" [Height]="'35px'" [SearchKey]="'nameAR'" [innerTextKey]="'nameAR'" (ItemObj)="GetSelectedReceiptLedger($event)">
                    </app-erp-selector-with-search> -->
                    </div>
                </div>
                <div class="col-lg-6">
                    <div class="mb-2">
                        <label class="form-label d-flex align-items-center gap-2"> نوع السند <span
                                class="text-danger">*</span></label>

                        <app-general-selector formControlName="receiptTypeId" [data]="receiptTypeList" [placeholder]="'نوع السند'"></app-general-selector>
                    </div>
                </div>
                <div class="col-lg-6">
                    <div class="mb-2">
                        <label class="form-label d-flex align-items-center gap-2">المبلغ</label>

                        <input type="number" class="form-control nw-form-input text-center" formControlName="moneyAmount" />
                    </div>
                </div>
                <div class="col-lg-12">
                    <div class="mb-2">
                        <label class="form-label d-flex align-items-center gap-2">البيان</label>

                        <input type="text" class="form-control nw-form-input description-area" formControlName="description" />
                    </div>
                </div>
            </div>
        </form>
    </div>
    <div class="inputs-sec-title fw-semibold fs-16 px-3 py-2 border-top mb-2">
        <button class="btn btn-primary btn-lg fs-6 me-2 mt-2" (click)="SaveReceiveReceipt()">
            <i class="fas fa-check-circle"></i>
            <span class="ms-2">حفظ</span>
        </button>

        <button class="btn btn-warning btn-lg fs-6 me-2 mt-2" (click)="ClearAllFields()">
            <i class="fas fa-times"></i>
            <span class="ms-2">مسح</span>
        </button>

        <button class="btn btn-secondary btn-lg fs-6 me-2 mt-2">
            <i class="fas fa-print"></i>
            <span class="ms-2">طباعة</span>
        </button>
    </div>

</div>
