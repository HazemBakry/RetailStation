                </div>
            </div>
            <div class="col-lg-6">

                    <input type="text" class="form-control nw-form-input" [(ngModel)]="receiveReceiptModel.contactName" />
                </div>
            </div>
            <div class="col-lg-6">
                <div class="mb-2">
                    <label class="form-label d-flex align-items-center gap-2">تاريخ السند <span
                            class="text-danger">*</span></label>
                    <input type="date" class="form-control nw-form-input" [(ngModel)]="receiveReceiptModel.releaseDate" id="floatingInput2" placeholder="any" autocomplete="off">
                </div>
            </div>
            <div class="col-lg-6">
                <div class="mb-2">
                    <label class="form-label d-flex align-items-center gap-2">طريقة الدفع <span
                            class="text-danger">*</span></label>
                    <app-erp-selector-with-search #Selector [ItemsList]="paymentTypeList" [Height]="'35px'" [SearchKey]="'nameAR'" (ItemObj)="GetSelectedPaymentType($event)">
                    </app-erp-selector-with-search>
                </div>
            </div>
            <div class="col-lg-6">
                <div class="mb-2">
                    <label class="form-label d-flex align-items-center gap-2">نوع جهة التعامل <span
                            class="text-danger">*</span></label>
                    <app-erp-selector-with-search #Selector [ItemsList]="agencyTypeList" [Height]="'35px'" [SearchKey]="'nameAR'" (ItemObj)="GetSelectedAgencyType($event)">
                    </app-erp-selector-with-search>
                </div>
            </div>
            <div class="col-lg-6">
                <div class="mb-2">
                    <label class="form-label d-flex align-items-center gap-2">الحساب / جهة التعامل <span
                            class="text-danger">*</span></label>
                    <app-erp-selector-with-search *ngIf="selectedAgencyType == 1" #Selector [SelectorName]="'الحسابات'" [ItemsList]="accountList" [Height]="'35px'" [SearchKey]="'nameAR'" (ItemObj)="GetSelectedAccount($event)">
                    </app-erp-selector-with-search>

                    <app-erp-selector-with-search *ngIf="selectedAgencyType == 2" #Selector [SelectorName]="'جهة التعامل'" [ItemsList]="supplierList" [Height]="'35px'" [SearchKey]="'nameAR'" (ItemObj)="GetSelectedSupplier($event)">
                    </app-erp-selector-with-search>
                </div>
            </div>
            <div class="col-lg-6">
                <div class="mb-2">
                    <label class="form-label d-flex align-items-center gap-2"> دفتر الايصال <span
                        class="text-danger">*</span></label>

                    <app-erp-selector-with-search #Selector [ItemsList]="receiptLedgerList" [Height]="'35px'" [SearchKey]="'nameAR'" [innerTextKey]="'nameAR'" (ItemObj)="GetSelectedReceiptLedger($event)">
                    </app-erp-selector-with-search>
                </div>
            </div>
            <div class="col-lg-6">
                <div class="mb-2">
                    <label class="form-label d-flex align-items-center gap-2">المبلغ</label>

                    <input type="number" class="form-control nw-form-input text-center" [(ngModel)]="receiveReceiptModel.moneyAmount" />
                </div>
            </div>
            <div class="col-lg-12">
                <div class="mb-2">
                    <label class="form-label d-flex align-items-center gap-2">البيان</label>

                    <input type="text" class="form-control nw-form-input description-area" [(ngModel)]="receiveReceiptModel.description" />
                </div>
            </div>
        </div>
    </div>
    <div class="inputs-sec-title fw-semibold fs-16 px-3 py-2 border-top mb-2">
        <button class="btn btn-primary btn-lg fs-6 me-2 mt-2" (click)="SavePaymentReceipt()">
            <i class="fas fa-check-circle"></i>
            <span class="ms-2">حفظ</span>
        </button>
        <button class="btn btn-warning btn-lg fs-6 me-2 mt-2" (click)="ClearAllFields()">
            <i class="fas fa-times"></i>
            <span class="ms-2">مسح</span>
        </button>
        <button class="btn btn-secondary btn-lg fs-6 me-2 mt-2" (click)="ClearAllFields()">
            <i class="fas fa-print"></i>
            <span class="ms-2">طباعة</span>
        </button>
    </div>
</div>
