<app-breadcrumb [TitleList]="TitleList"></app-breadcrumb>

<div class="table-card border radius-10 overflow-hidden shadow-sm">
    <div
        class="align-items-center border-bottom d-flex flex-wrap justify-content-between p-3 table-card-title bg-light">
        <div class="d-flex align-items-center gap-2">
            <button (click)="openAddModal(addNewModal)"
                class="btn btn-success d-flex align-items-center gap-2 border rounded px-3">
                <i class="fas fa-plus-circle"></i>
                <span>إضافة</span>
            </button>
        </div>
        <div class="justify-content-end">
            <app-erp-pagination (pageChanged)="pageChanged($event)" [currentPage]="pagedResponse.currentPage"
                [pageSize]="pagedResponse.pageSize" [totalCount]="pagedResponse.totalCount"></app-erp-pagination>
        </div>
    </div>
    <div class="p-3 bg-white">
        <div class="table-responsive shadow-sm radius-10">
            <table class="table table-card-table table-borderless table-middle table-hover bg-transparent m-0">
                <thead>
                    <tr>
                        <th>الاسم (AR)</th>
                        <th>الاسم (EN)</th>
                        <th>الكود</th>
                        <th>نشط</th>
                        <th>ملاحظات</th>
                        <th class="text-center"></th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let item of pagedResponse.results">
                        <td>{{item.nameAR}}</td>
                        <td>{{item.nameEN}}</td>
                        <td>{{item.code}}</td>
                        <td>{{item.isActive}}</td>
                        <td>{{item.notes}}</td>
                        <td>
                            <div class="d-flex align-items-center justify-content-center">
                                <!-- <button *ngIf="isUpdate"
                                    class="button-table-action btn-edit d-flex align-items-center justify-content-center gap-2"
                                    (click)="openAddNewImporterSidePanel(AddNewImporterDialog)">
                                    <i class="uil uil-pen"></i>
                                    <span>تعديل</span>
                                </button> -->
                            </div>

                        </td>
                    </tr>
                    <tr *ngIf="!pagedResponse.results.length">
                        <td colspan="6" class="text-right">
                            <app-empty-data [showEmptyData]="!pagedResponse.results?.length&&!showLoader"
                                [showLoader]="showLoader"></app-empty-data>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<ngx-loading [show]="showLoader"></ngx-loading>



<ng-template #addNewModal let-modal>
    <div class="modal-header modal-header-bg justify-content-between">
        <h4 class="d-flex align-items-center gap-2">
            <i class="uil uil-plus"></i>
            <span>املأ البيانات الأتية</span>
            <span *ngIf="!isUpdate" class="ms-3">(إضافة)</span>
            <span *ngIf="isUpdate" class="ms-3">(تعديل)</span>
        </h4>
        <div class="cursor-pointer text-danger fs-2" (click)="modal.dismiss()">
            <i class="uil uil-times-circle"></i>
        </div>
    </div>
    <div class="modal-body">

        <div class="card ">
            <!-- <div class="card-header bg-white">
                <h6 class="fw-bold m-0">
                    <span *ngIf="!isUpdate" class="ms-3">إضافة</span>
                    <span *ngIf="isUpdate" class="ms-3">تعديل</span>
                </h6>
            </div> -->
            <!-- bg-light  >> for gray card-->
            <div class="card-body ">
                <div class="p-2">


                    <form [formGroup]="formGroup" autocomplete="off">


                        <div class="row mb-3">
                            <label class="form-label d-flex align-items-center gap-2">
                                الاسم بالعربي
                            </label>
                            <input type="text" class="form-control nw-form-input" formControlName="nameAR"
                                autocomplete="off" />

                            <div *ngIf="formErrors.nameAR" class="text-danger  font-small-3 m-03">
                                {{formErrors.nameAR}}
                            </div>
                        </div>
                        <div class="row mb-3">
                            <label class="form-label d-flex align-items-center gap-2">
                                الاسم بالانجليزي
                            </label>
                            <input type="text" class="form-control nw-form-input" formControlName="nameEN"
                                autocomplete="off" />

                            <div *ngIf="formErrors.nameEN" class="text-danger  font-small-3 m-03">
                                {{formErrors.nameEN}}
                            </div>
                        </div>

                        <div class="row mb-3">
                            <label class="form-label d-flex align-items-center gap-2">
                                الرمز
                            </label>
                            <input type="text" class="form-control nw-form-input" formControlName="code"
                                autocomplete="off" />

                            <div *ngIf="formErrors.code" class="text-danger  font-small-3 m-03">
                                {{formErrors.code}}
                            </div>

                        </div>
                        <div class="row mb-3">
                            <label class="form-label d-flex align-items-center gap-2">
                                الملاحظات
                            </label>

                            <textarea formControlName="notes" class="form-control"></textarea>
                            <div *ngIf="formErrors.notes" class="text-danger  font-small-3 m-03">
                                {{formErrors.notes}}
                            </div>

                        </div>


                        <!-- <div class="row mb-3">
                            <label class="form-label d-flex align-items-center gap-2">
                                نوع 
                                <span class="text-danger">*</span>
                            </label>
                            <app-general-selector formControlName="accountTypeId" [data]="accountTypesSelectorData" [showSearch]="true" [placeholder]="'نوع الحساب'"></app-general-selector>

                            <div *ngIf="formErrors.accountTypeId" class="text-danger  font-small-3 m-03">
                                {{formErrors.accountTypeId}}
                            </div>
                        </div> -->
                        <hr class="my-4" />
                        <div class="row mb-3">
                            <div class="col-sm-4">
                                <label class="form-label d-flex align-items-center gap-2">
                                    نشط
                                </label>
                                <input class="big-checkbox" formControlName="isActive" type="checkbox">

                                <div *ngIf="formErrors.isActive" class="text-danger  font-small-3 m-03">
                                    {{formErrors.isActive}}
                                </div>
                            </div>

                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <div class="modal-footer flex-nowrap gap-2">
        <button [disabled]="showAddLoader" (click)="saveRecord()" type="button"
            class="btn btn-success d-flex align-items-center justify-content-center gap-2 w-100">
            <i class="uil uil-save fs-3"></i>
            <span>{{isUpdate?'تعديل':'أضافة'}}</span>
        </button>

        <button type="button" class="btn btn-danger d-flex align-items-center gap-2"
            (click)="initNewForm();modal.close()">
            <i class="uil uil-times-circle fs-3"></i>
            <span>الغاء</span>
        </button>
    </div>
</ng-template>
