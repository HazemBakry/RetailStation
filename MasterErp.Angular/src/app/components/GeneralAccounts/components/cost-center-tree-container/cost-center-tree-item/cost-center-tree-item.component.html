<div (click)="toggleNode(costCenter)"
  class="tree-row d-flex align-items-center justify-content-between cursor-pointer  pss-{{costCenter.costLevel+1}}" [style]="getLevelClass(costCenter.costLevel)">

  <div class="tree-row-text d-flex align-items-center">
    <i *ngIf="costCenter.children?.length" class="fas " [class]="!expanded?'fa-plus-circle':'fa-minus-circle'"></i>
    <span class="ms-2" [ngClass]="{'bg-warning': costCenter.isSelected}">{{ costCenter.nameEN }}</span>

  </div>
  <!-- <div class="col-lg-6 align-self-start" >
            <a (click)="onEvent($event,costCenter)" class="text-underline text-primary cursor-pointer fs-6">Select</a>
        </div> -->
  <div class="tree-row-icon d-flex align-items-center">
    <i class="fas fa-edit cursor-pointer" (click)="onEvent($event,costCenter)"></i>

  </div>
</div>
<!-- (costCenter.isSelected||expanded) -->
<div *ngIf="costCenter.children &&(expanded||costCenter.isSelected) ">
  <app-cost-center-tree-item (selectedCostCenter)="selectCostCenter($event)" *ngFor="let child of costCenter.children"
    [costCenter]="child"></app-cost-center-tree-item>
</div>
