<app-breadcrumb [TitleList]="TitleList"></app-breadcrumb>


<div class="inputs-wrapper border rounded bg-white mb-3">
    <div class="inputs-sec-title fw-semibold fs-16 px-3 py-2 border-bottom mb-2">المركز المالي</div>
    <div class="inputs-sec-content px-3 py-2">
        <app-accounts-report-search (searchDataChanged)="searchDataChanged($event)" [showAccounts]="true">
        </app-accounts-report-search>

        <div class="row">

            <div class="col-lg-6">
                <div class="mb-2">
                    <label class="form-label d-flex align-items-center gap-2">
                        التفرع
                    </label>
                    <input type="number" class="form-control nw-form-input"
                        [(ngModel)]="balanceSheetResponse.searchLevel" autocomplete="off" />

                </div>
            </div>
            <div class="col-lg-6">
                <div class="mb-2">
                    <label class="form-label d-flex align-items-center gap-2">
                        نوع التفرع
                    </label>
                    <app-general-selector [showSearch]="true" [(ngModel)]="balanceSheetResponse.searchType"
                        [data]="levelTypesSelector" [placeholder]="'نوع التفرع'"></app-general-selector>
                </div>
            </div>
        </div>

        <div class="row">

            <div class="col-lg-4  mb-3">
                <label class="form-label d-flex align-items-center gap-2">
                    اخفاء الحسابات بدون رصيد
                </label>
                <input class="big-checkbox" [(ngModel)]="balanceSheetResponse.hideEmptyAccounts" type="checkbox">

            </div>
        </div>
    </div>

    <div class="inputs-sec-title fw-semibold fs-16 px-3 py-2 border-top mb-2">
        <button class="btn btn-primary me-2" (click)="loadData()">
            <i class="fas fa-search"></i>
            <span class="ms-2">بحث</span>
        </button>
        <button [disabled]="showExportLoader" (click)="exportData()"
            class="btn  btn-outline-success gap-2 border rounded px-3 me-2">
            <i class="fas fa-file-download"></i>
            <span>تصدير CSV</span>
        </button>
        <button (click)="printData()" class="btn btn-table-action  gap-2 border rounded px-3 me-2">
            <i class="fas fa-print fs-7"></i>
            <span>طباعة</span>
        </button>
        <!-- <button class="btn btn-secondary me-2" (click)="printData()">
            <i class="fas fa-print"></i>
            <span class="ms-2">طباعة</span>
        </button> -->
    </div>
</div>

<div class="inputs-wrapper border rounded bg-white mb-3">
    <div class="inputs-sec-title fw-semibold fs-16 px-3 py-2 border-bottom mb-2">
        الحسابات

    </div>
    <!-- <div class="px-3 py-2 mb-2">

        <app-erp-pagination (pageChanged)="pageChanged($event)" [currentPage]="balanceSheetResponse.currentPage"
            [pageSize]="balanceSheetResponse.pageSize" [totalCount]="balanceSheetResponse.totalCount"></app-erp-pagination>
    </div> -->

    <div class="table-responsive shadow-sm  table-vp-height small-scroll">
        <table class="table table-card-table table-borderless table-middle table-hover bg-transparent m-0">

            <thead>
                <tr>
                    <th>الكـود</th>
                    <th>نوع الحســاب</th>
                    <th>الحســاب</th>
                    <th>الرصيد الحالى (مدين)</th>
                    <th>الرصيد الحالى (دائن)</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let item of  balanceSheetResponse.results">
                    <td>{{item.accountNumber}}</td>
                    <td>
                        
                        <span *ngIf="item.isParent" class="badge bg-primary">حساب رئيسى</span>
                        <span *ngIf="!item.isParent" class="badge bg-secondary">حساب فرعى</span>
                    </td>
                    <td>{{item.accountNameAR ?? item.accountNameEN}}</td>
                    <td>{{item.balanceDebit}}</td>
                    <td>{{item.balanceCredit}}</td>
                </tr>
                <tr *ngIf="!balanceSheetResponse.results.length">
                    <td colspan="5" class="text-right">
                        <app-empty-data [showEmptyData]="!balanceSheetResponse.results.length"></app-empty-data>
                    </td>
                </tr>
            </tbody>

        </table>

    </div>
    <ng-container *ngIf="totalDebit !=null &&totalCredit !=null">
        <hr />
        <div class="row justify-content-end m-3">
            <div class="col-md-2">
                <label class="form-label d-flex align-items-center gap-2">
                    أجمالي دائن
                </label>
                <input type="text" class="form-control nw-form-input" [value]="totalCredit" disabled
                    autocomplete="off" />
            </div>
            <div class="col-md-2">
                <label class="form-label d-flex align-items-center gap-2">
                    أجمالي مدين
                </label>
                <input type="text" class="form-control nw-form-input" [value]="totalDebit" disabled
                    autocomplete="off" />
            </div>
        </div>
        <div class="row justify-content-end mb-3">

        </div>

    </ng-container>
</div>
