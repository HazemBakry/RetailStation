<app-breadcrumb [TitleList]="TitleList"></app-breadcrumb>

<div class="table-card border radius-10 overflow-hidden shadow-sm">
    <div class="align-items-center border-bottom d-flex flex-wrap justify-content-between p-3 table-card-title bg-light">
        <div class="d-flex align-items-center gap-2">
            <button class="btn btn-success d-flex align-items-center gap-2 border rounded px-3">
                <i class="fas fa-plus-circle"></i>
                <span>إضافة سند</span>
            </button>
            <button class="btn btn-table-action d-flex align-items-center gap-2 border rounded px-3">
                <i class="fas fa-file-download"></i>
                <span>تصدير CSV</span>
            </button>
            <div ngbDropdown class="d-inline-block">
                <button type="button" class="btn btn-table-action d-flex align-items-center gap-2 border rounded px-3" id="dropdownBasic1" ngbDropdownToggle>
                    <i class="fas fa-cogs"></i>
                    <span>الإجراءات</span>
                </button>
                <div ngbDropdownMenu aria-labelledby="dropdownBasic1" class="border rounded">
                    <button ngbDropdownItem class="d-flex align-items-center gap-2">
                        <i class="fas fa-edit"></i>
                        <span>تعديل</span>
                    </button>
                    <button ngbDropdownItem class="d-flex align-items-center gap-2">
                        <i class="fas fa-trash-alt"></i>
                        <span>حذف</span>
                    </button>
                </div>
            </div>
            <button class="btn btn-table-action d-flex align-items-center gap-2 border rounded px-3">
                <i class="fas fa-filter"></i>
                <span>إضافة فلتر</span>
            </button>
            <!--    <button class="btn btn-table-action d-flex align-items-center gap-2 border rounded px-3">
          <i class="fas fa-save"></i>
          <span>المرشحات المحفوظة</span>
        </button> -->
        </div>
        <nav>
            <ul class="pagination table-paging m-0">
                <li class="page-item disabled">
                    <a class="page-link">السابق</a>
                </li>
                <li class="page-item"><a class="page-link">1</a></li>
                <li class="page-item active" aria-current="page">
                    <a class="page-link">2</a>
                </li>
                <li class="page-item"><a class="page-link">3</a></li>
                <li class="page-item">
                    <a class="page-link">التالى</a>
                </li>
            </ul>
        </nav>
    </div>
    <div class="p-3 bg-white">
        <div class="table-responsive shadow-sm radius-10">
            <table class="table table-card-table table-borderless table-middle table-hover bg-transparent m-0">
                <thead>
                    <tr>
                        <th>رقم الايصال</th>
                        <th>اسم المستفيد</th>
                        <th>دفتر إيصال</th>
                        <th>تاريخ الاصدار</th>
                        <th>طريقة الدفع</th>
                        <!-- <th>نوع جهة التعامل</th>
                    <th>جهة التعامل</th> -->
                        <th>المبلغ</th>
                        <th>ملاحظات</th>
                        <th class="text-center"></th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let item of List">
                        <td>{{item.receiptNumber}}</td>
                        <td>{{item.contactName}}</td>
                        <td>{{item.receiptLedgerName}}</td>
                        <td>{{item.releaseDate | date}}</td>
                        <td>{{item.paymentTypeName }}</td>
                        <!-- <td>{{item.agencyTypeId}}</td>
                    <td>{{item.agencyId}}</td> -->
                        <td>{{item.moneyAmount}}</td>
                        <td class="min-width-200">{{item.notes}}</td>
                        <!-- <td>
                        <span class="badge rounded-pill default p-2 text-uppercase px-3" [ngClass]="getStatusColor(item.isLocked)">
                            {{item.orderStatus}}
                        </span>
                    </td> -->
                        <td>
                            <div class="w-100 d-flex align-items-center justify-content-center">
                                <!-- <button class="btn btn-danger me-2"
                                (click)="CancelPaymentReceipt(item.paymentReceiptId)">
                                <i class="fas fa-times"></i>
                                <span class="ms-2">الغاء</span>
                            </button> -->

                                <button (click)="CancelPaymentReceipt(item.paymentReceiptId)" class="button-table-action btn-delete d-flex align-items-center justify-content-center gap-2">
                                    <i class="uil uil-times"></i>
                                    <span>إلغاء</span>
                                </button>

                                <!-- <button class="btn btn-secondary me-2">
                            <i class="far fa-eye"></i>
                            <span class="ms-2">Lock Order</span>
                        </button>
                        <button class="btn btn-primary me-2">
                            <i class="fas fa-edit"></i>
                            <span class="ms-2">Edit</span>
                        </button> -->
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <app-empty-data [showEmptyData]="!List?.length&&!showLoader" [showLoader]="showLoader"></app-empty-data>
</div>


<ngx-loading [show]="showLoader"></ngx-loading>
