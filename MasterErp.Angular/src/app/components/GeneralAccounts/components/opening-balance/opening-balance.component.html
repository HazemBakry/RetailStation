        </div>

        <hr class="my-4" />

        <ng-container *ngIf="accountsOpeningBalance?.length==0">
            <button class="btn btn-primary btn-lg d-flex align-items-center fs-6 me-2 px-3 mb-1"
                (click)="loadData()">
                <i class="fas fa-eye"></i>
                <span class="ms-2">اظهر جميع الحسابات</span>
            </button>
            <hr class="my-4" />
        </ng-container>


        <ng-container *ngIf="accountsOpeningBalance?.length>0">
            <div class="btn-action d-flex align-items-center flex-wrap mb-3">
                <button (click)="updateAccountsOpeningBalance()" class="btn btn-secondary btn-lg d-flex align-items-center fs-6 me-2 px-3 mb-1">
                    <i class="fas fa-save"></i>
                    <span class="ms-2">حفظ</span>
                </button>
                <button class="btn btn-secondary btn-lg d-flex align-items-center fs-6 me-2 px-3 mb-1"
                    (click)="ClearAllFields()">
                    <i class="fas fa-window-close"></i>
                    <span class="ms-2">الغاء</span>
                </button>
            </div>

            <hr class="my-4" />

            <div class="table-responsive table-vp-height large-scroll">
                <table class="table  transparent-table align-middle border-top">
                    <thead>
                        <tr>
                            <th class="bg-white border-end-0">رمز الحساب</th>
                            <th class="bg-white border-end-0">اسم الحساب</th>
                            <th class="bg-white border-end-0">مدين</th>
                            <th class="bg-white border-end-0">دائن</th>
                        </tr>
                    </thead>
                    <tbody class="table-group-divider text-center">
                        <tr  *ngFor="let item of accountsOpeningBalance">
                            <td>
                                <input type="text" [value]="item.accountNumber" class="form-control" disabled />
                            </td>
                            <td>
                                <input type="text" [value]="item.nameEN" class="form-control" disabled />
                            </td>
                            <td>
                                <input type="text" [(ngModel)]="item.preDebit"  autocomplete="off" (keypress)="NumbersOnly($event.key)" class="form-control">
                            </td>
                            <td>
                                <input type="text" [(ngModel)]="item.preCredit" autocomplete="off" (keypress)="NumbersOnly($event.key)" class="form-control">
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </ng-container>
    </div>
</div>

<ngx-loading [show]="showLoader"></ngx-loading>
