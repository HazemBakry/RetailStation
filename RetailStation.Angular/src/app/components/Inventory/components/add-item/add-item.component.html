<div class="card radius-10 border-0 card-shadow mb-1">
    <div class="card-header border-bottom bg-gray d-flex align-items-center justify-content-between">
        <h5 class="mb-0 fw-bold">السلف</h5>
        <button class="btn btn-secondary gap-2" (click)="goToItems()">
            <i class="fa fa-arrow-left"></i>
            <span>عودة للأصناف</span>
        </button>
    </div>

    <div class="card-body">
        <div class="employee-card-body row">
            <form [formGroup]="formGroup" autocomplete="off">
                <div class="employee-card-body row">
                    <div class="col-xl-5">
                        <div class="form-floating  mb-3 mt-3">
                            <input type="text" formControlName="nameAR" class="form-control" id="floatingInput1" placeholder="any">
                            <label for="floatingInput1">الاسم عربي</label>
                            <div *ngIf="formErrors.nameAR" class="text-danger  font-small-3 m-03">
                                {{formErrors.nameAR}}
                            </div>
                        </div>
                    </div>

                    <div class="col-xl-1"></div>

                    <div class="col-xl-5">
                        <div class="form-floating mb-3 mt-3">
                            <input type="text" formControlName="nameEN" class="form-control" id="floatingInput1" placeholder="any">
                            <label for="floatingInput2">الاسم انجليزي</label>
                            <div *ngIf="formErrors.nameEN" class="text-danger  font-small-3 m-03">
                                {{formErrors.nameEN}}
                            </div>
                        </div>
                    </div>

                    <div class="col-xl-1"></div>

                    <div class="col-xl-5 mb-3 mt-3">
                        <app-drop-down-form-control formControlName="itemCategoryId" [placeholder]="'مجموعات الأصناف'" [showSearch]="true" [data]="categoriesSelectorData"></app-drop-down-form-control>
                        <div *ngIf="formErrors.itemCategoryId" class="text-danger  font-small-3 m-03">
                            {{formErrors.itemCategoryId}}
                        </div>
                    </div>

                    <div class="col-xl-1"></div>

                    <div class="col-xl-5 mb-3 mt-3">
                        <div class="d-flex">
                            <input class="form-check-input width-30 height-30" formControlName="isActive" type="checkbox" value="" id="flexCheckDefault">
                            <label class=" form-label m-2 ms-3">نشط</label>
                        </div>
                        <div *ngIf="formErrors.isActive" class="text-danger  font-small-3 m-03">
                            {{formErrors.isActive}}
                        </div>
                    </div>
                </div>
            </form>
            <div class="d-flex justify-content-left">
                <button [disabled]="showAddLoader" (click)="saveItem()" class="btn btn-primary m-2">
                    <i class="fas fa-check-circle"></i>
                    <span class="ms-3">حفــظ</span>
                </button>
                <!-- <button (click)="initNewForm()" class="btn btn-danger m-2">
                    <span class="ms-3">إلغاء</span>
                </button> -->
            </div>
        </div>
    </div>
</div>
