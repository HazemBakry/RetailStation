<div (click)="OpenSidePanel(OrderSearchSidepanel)">
  <i class="uil uil-pen"></i>
  <span class="ms-2">تحميل من أمر شراء</span>
</div>

<ng-template #OrderSearchSidepanel let-offcanvas>
  <div class="offcanvas-header justify-content-between gap-3 fs-4 border-bottom py-3">
    <div class="d-flex align-items-center gap-2">
      <i class="fas fa-store offcanvas-header-icon"></i>
      <span>بحث فى أوامر الشراء</span>
    </div>
    <div class="cursor-pointer text-danger fs-2" (click)="offcanvas.dismiss()">
      <i class="uil uil-times-circle"></i>
    </div>
  </div>
  <div class="offcanvas-body pt-4 bg-light">

    <div class="employee-card-body row mb-3">
      <div class="col-xl-4 mb-2">
        <app-general-selector [(ngModel)]="selectedSupplierId" [disabled]="true" [data]="suppliersSelectorData"
          [showSearch]="true" [placeholder]="'الموردين'"></app-general-selector>
      </div>
      <div class="col-xl-4 mb-2">
        <input type="text" autocomplete="off" [(ngModel)]="orderNumber" class="form-control nw-form-input"
          placeholder="رقم الطلب">

      </div>
      <div class="col-xl-4 mb-2">
        <input type="date" [(ngModel)]="orderDate" class="form-control nw-form-input" placeholder="تاريخ الاصدار">
      </div>
      <div class="col-xl-12">
        <div class="d-flex justify-content-center mt-3">
          <button (click)="loadData()" class="btn btn-primary w-50 justify-content-center py-2 fs-5 radius-10">
            بحث
          </button>
        </div>
      </div>
    </div>
    <hr class="border-black" />
    <div class="card card-with-table border shadow-none">
      <div class="card-header bg-white border-bottom d-flex align-items-center justify-content-between">
                <div>

                </div>
                <app-erp-pagination (pageChanged)="pageChanged($event)" [currentPage]="pagedResponseModel.currentPage"
                    [pageSize]="pagedResponseModel.pageSize"
                    [totalCount]="pagedResponseModel.totalCount"></app-erp-pagination>

            </div>
      <div class="card-body table-responsive p-0 shadow-sm radius-10">
        <table class="table table-card-table table-borderless table-middle table-hover bg-transparent small-scroll m-0">
          <thead>
            <tr>
              <th>رقم الطلب</th>
              <th>تاريخ الاصدار</th>
              <th>اسم المورد</th>
              <th>تفاصيل</th>
              <th>القيمة الإجمالية</th>
              <th>حالة الطلب</th>
              <th class="text-center"></th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let item of pagedResponseModel.results">
              <td>{{item.serialNumber}}</td>
              <td>{{item.orderDate | date}}</td>
              <td>{{item.supplierNameAR ?? item.supplierNameEN}}</td>
              <td>{{item.notes}}</td>

              <td>{{item.totalValue}}</td>
              <td>
                <span appWorkflowStatus [id]="item.workflowStatusId" [nameEN]="item?.workflowStatusNameEN"
                  [nameAR]="item?.workflowStatusNameAR">
                </span>
              </td>
              <td>
                <!-- <div class="d-flex align-items-center justify-content-center">
                  <button (click)="SelectOrder(item)" class="btn btn-secondary">
                    <i class="fas fa-upload"></i>
                  </button>
                </div> -->
                <div class="w-100 d-flex align-items-center justify-content-center">
                  <button (click)="SelectOrder(item)"
                    class="button-table-action btn-edit d-flex align-items-center justify-content-center gap-2 me-2">
                    <i class="fas fa-upload"></i>
                    <span>تحميل</span>
                  </button>
                </div>
              </td>

            </tr>
            <tr *ngIf="!pagedResponseModel?.results.length || showLoader">
              <td colspan="7" class="text-right">
                <app-empty-data [showEmptyData]="!pagedResponseModel?.results.length&&!showLoader"
                  [showLoader]="showLoader"></app-empty-data>
              </td>
            </tr>
          </tbody>
        </table>

      </div>
    </div>
