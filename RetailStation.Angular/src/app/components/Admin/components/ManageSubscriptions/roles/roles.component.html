<app-breadcrumb [TitleList]="TitleList"></app-breadcrumb>

<div class="table-card border radius-10 overflow-hidden shadow-sm">
    <div
        class="align-items-center border-bottom d-flex flex-wrap justify-content-between p-3 table-card-title bg-light">
        <div class="d-flex align-items-center gap-2">
            <button (click)="openAddModal(addNewModal)"
                class="btn btn-success d-flex align-items-center gap-2 border rounded px-3">
                <i class="fas fa-plus-circle"></i>
                <span>Add New Role</span>
            </button>
        </div>
        <div class="justify-content-end">
            <!-- <app-pagination (pageChanged)="pageChanged($event)" [currentPage]="pagedResponse.currentPage"
                [pageSize]="pagedResponse.pageSize" [totalCount]="pagedResponse.totalCount"></app-pagination> -->
        </div>
    </div>
    <div class="p-3 bg-white">
        <div class="table-responsive shadow-sm radius-10">
            <table class="table table-card-table table-borderless table-middle table-hover bg-transparent m-0">

                <thead>
                    <tr>
                        <th>Role Name</th>
                        <th>Role Normalized Name</th>
                        <th class="text-center"></th>

                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let item of pagedResponse.results">
                        <td>{{item.roleName}}</td>
                        <td>{{item.roleNormalizedName}}</td>
                        <td>
                            <div class="d-flex align-items-center justify-content-center">
                                <button
                                    class="button-table-action btn-edit d-flex align-items-center justify-content-center gap-2 me-2"
                                    routerLink="/admin/manage-role-pages/{{item.roleId}}">

                                    <i class="uil uil-pen"></i>
                                    <span>Manage Permissions</span>
                                </button>

                                <!-- <button
                                    class="button-table-action btn-delete d-flex align-items-center justify-content-center gap-2"
                                    (click)="openDeleteModal(deleteModal,item.unitId)">
                                    <i class="uil uil-pen"></i>
                                    <span>حذف</span>
                                </button> -->
                            </div>

                        </td>
                    </tr>
                    <tr *ngIf="!pagedResponse.results.length">
                        <td colspan="3" class="text-right">
                            <app-empty-data [showEmptyData]="!pagedResponse.results?.length&&!showLoader"
                                [showLoader]="showLoader"></app-empty-data>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- <ngx-loading [show]="showLoader"></ngx-loading> -->



<ng-template #addNewModal let-modal>
    <div class="modal-header modal-header-bg justify-content-between">
        <h4 class="d-flex align-items-center gap-2">
            <i class="uil uil-plus"></i>
            <span>املأ البيانات الأتية</span>
        </h4>
        <div class="cursor-pointer text-danger fs-2" (click)="modal.dismiss()">
            <i class="uil uil-times-circle"></i>
        </div>
    </div>
    <div class="modal-body">

        <div class="p-2">
            <div class="row mb-3">
                <label class="form-label d-flex align-items-center gap-2">
                    Role Name
                </label>
                <input [(ngModel)]="roleName" type="text" class="form-control nw-form-input" autocomplete="off" />
            </div>
        </div>
        <!-- <div class="card ">
            <div class="card-body ">
            </div>
        </div> -->
    </div>
    <div class="modal-footer flex-nowrap gap-2">
        <button [disabled]="showAddLoader" (click)="addNewRole()" type="button"
            class="btn btn-success d-flex align-items-center justify-content-center gap-2 w-100">
            <i class="uil uil-save fs-3"></i>
            <span>{{isUpdate?'تعديل':'أضافة'}}</span>
        </button>

        <button type="button" class="btn btn-danger d-flex align-items-center gap-2" (click)="modal.close()">
            <i class="uil uil-times-circle fs-3"></i>
            <span>الغاء</span>
        </button>
    </div>
</ng-template>


<ng-template #deleteModal let-modal>
    <div class="modal-header">
        <h4 class="modal-title">تأكيد العملية</h4>
    </div>
    <div class="modal-body">
        <p class="fs-5 m-0">هل انت متأكد من الحذف ؟</p>
    </div>
    <div class="modal-footer justify-content-start">
        <button type="button" [disabled]="showAddLoader" class="btn btn-success"
            (click)="modal.close('Save click');deleteRole()">
            <i class="fas fa-check"></i>
            <span class="ms-2">نعم</span>
        </button>
        <button type="button" [disabled]="showAddLoader" class="btn btn-danger" (click)="modal.close('Save click')">
            <i class="fas fa-times"></i>
            <span class="ms-2">الغاء</span>
        </button>
    </div>
</ng-template>
<!-- <ngx-loading [show]="showLoader"></ngx-loading> -->
