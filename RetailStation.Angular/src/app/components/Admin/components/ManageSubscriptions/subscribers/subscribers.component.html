<app-breadcrumb [TitleList]="TitleList"></app-breadcrumb>

  <div class="align-items-center border-bottom d-flex flex-wrap justify-content-between p-3 table-card-title bg-light">
    <div class="col-md-8 mb-2">
      <div class="d-flex align-items-center gap-2">
        <button class="btn btn-success d-flex align-items-center gap-2 border rounded px-3"
          routerLink="/admin/manage-subscriptions/add-subscriber">
          <i class="fas fa-plus-circle"></i>
          <span>إنشاء</span>
        </button>

        <!-- <button [disabled]="showExportLoader" (click)="exportData()"
                    class="btn  btn-outline-success d-flex align-items-center gap-2 border rounded px-3">
                    <i class="fas fa-file-download"></i>
                    <span>تصدير CSV</span>
                </button>
                <div ngbDropdown class="d-inline-block">
                    <button type="button"
                        class="btn btn-table-action d-flex align-items-center gap-2 border rounded px-3"
                        id="dropdownBasic1" ngbDropdownToggle>
                        <i class="fas fa-cogs"></i>
                        <span>الإجراءات</span>
                    </button>
                    <div ngbDropdownMenu aria-labelledby="dropdownBasic1" class="border rounded">
                        <button ngbDropdownItem class="d-flex align-items-center gap-2" (click)="cancel()">
                            <i class="fas fa-trash-alt"></i>
                            <i class="fas fa-times"></i>
                            <span class="px-2"> test</span>
                        </button>
                        
                    </div>
                </div> -->
      </div>
    </div>
    <div class="col-md-4 mb-2">
      <app-pagination (pageChanged)="pageChanged($event)" [currentPage]="pagedResponseModel.currentPage"
        [pageSize]="pagedResponseModel.pageSize" [totalCount]="pagedResponseModel.totalCount"></app-pagination>
    </div>



    <div class="col-md-12 mt-3">
      <div class="d-flex align-items-center">
        <ng-container>
          <app-erp-filters (filterChanged)="filterChecked($event)" [searchPlaceholder]="'البحث  ...'"></app-erp-filters>
        </ng-container>
      </div>
    </div>
  </div>
  <div class="p-3 bg-white">
    <div class="table-responsive shadow-sm radius-10">
      <table class="table table-card-table table-borderless table-middle table-hover bg-transparent m-0 ">
        <thead class="table-light">

          <tr>
            <th>اسم المشترك</th>
            <th>البريد الألكتروني</th>
            <th>نوع المشترك</th>
            <th>الدومين</th>
            <th>تاريخ التفعيل</th>
            <th>الحالة</th>
            <th>العمليات</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let item of pagedResponseModel.results">
            <td>
              <a routerLink="/admin/manage-subscriptions/subscriber-profile/{{item.subscriberId}}">{{item.subscriberName}}</a>
            </td>
            <td>{{item?.email ?? '-'}}</td>
            <td>
              <span *ngIf="item.subscriberTypeId == SubscriberType.Admin">Admin</span>
              <span *ngIf="item.subscriberTypeId == SubscriberType.Customer">Customer</span>
              <span *ngIf="item.subscriberTypeId == SubscriberType.Supplier">Supplier</span>

            </td>
            <td>{{item?.domainName ?? '-'}}</td>
            <td>-</td>
            <td>
              <div>
                <span class="badge bg-success" *ngIf="item.isActive">Active</span>
                <span class="badge bg-danger" *ngIf="!item.isActive">InActive</span>
                
              </div>
              <div>
                <span class="badge bg-success" *ngIf="item.isApproved">Approved</span>
                <span class="badge bg-warning" *ngIf="!item.isApproved">Pending</span>
              </div>
            </td>
            <!-- <td>
              <span appWorkflowStatus [id]="item.workflowStatusId" [nameEN]="item?.workflowStatusNameEN"
                [nameAR]="item?.workflowStatusNameAR">
              </span>
            </td> -->
            <td>

              <div class="d-flex align-items-center justify-content-center">
                <div ngbDropdown container="body">
                  <button class="btn-sm-action sm-action-dropdown" ngbDropdownToggle>
                    <i class="fas fa-ellipsis-v"></i>
                  </button>
                  <div ngbDropdownMenu class="border">
                    <button ngbDropdownItem (click)="openDeleteModal(deleteModal,item.subscriberId)">
                      <!-- <i class="uil uil-trash-alt"></i> -->
                      حذف
                    </button>


                  </div>
                </div>
              </div>
              <!-- <div class="d-flex align-items-center justify-content-center">
                                    <button class="z2actionbtnA me-2" (click)="OpenManageProductsModal()">
                                        <i class="fas fa-tasks me-1"></i> Manage Products
                                    </button>
                                    <button class="btn btn-primary btn-rounded me-2">
                                        <i class="fas fa-pen"></i>
                                    </button>
                                    <button class="btn btn-danger btn-rounded">
                                        <i class="fas fa-trash"></i>
                                    </button>
                                </div> -->
            </td>

          </tr>
          <tr *ngIf="!pagedResponseModel.results.length || showLoader">
            <td colspan="14" class="text-right">
              <app-empty-data [showEmptyData]="!pagedResponseModel.results.length&&!showLoader"
                [showLoader]="showLoader"></app-empty-data>
            </td>
          </tr>
        </tbody>

      </table>
    </div>
  </div>
</div>


<ng-template #deleteModal let-modal>
  <div class="modal-header">
    <h4 class="modal-title">رسالة تأكيد</h4>
  </div>
  <div class="modal-body">
    <p class="fs-5 m-0">هل أنت متأكد من الالغاء ؟</p>
  </div>
  <div class="modal-footer justify-content-start">
    <button type="button" class="btn btn-success" (click)="modal.close('Save click');deleteEmployeeDues()">
      <i class="fas fa-check"></i>
      <span class="ms-2">نعم</span>
    </button>
    <button type="button" class="btn btn-danger" (click)="modal.close('Save click')">
      <i class="fas fa-times"></i>
      <span class="ms-2">عودة</span>
    </button>
  </div>
</ng-template>


<ngx-loading [show]="showLoader"></ngx-loading>
