<div class="card radius-10 border-0 card-shadow m-4">
    <div class="card-body">
        <div class="main-card-action pb-3">
            <div class="row">
                <div class="col-md-8">
                    <div class="d-flex align-items-center flex-wrap">
                        <!-- <div class="search-box position-relative mb-2">
                            <input type="text" class="form-control" placeholder="SearchByName">
                            <i class="fas fa-search search-icon text-muted cursor-pointer"></i>
                        </div> -->
                        <ng-container>
                            <!-- <app-filters [FilterList]="filterList"
                                (filterChanged)="filterChecked($event)"></app-filters> -->
                        </ng-container>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="d-flex justify-content-end">
                        <button [disabled]="showAddLoader" (click)="saveSubscriberApplications()"
                            class="btn btn-primary m-2">
                            <span class="ms-3">Update</span>
                        </button>
                    </div>
                    <!-- <app-pagination (pageChanged)="pageChanged($event)" [currentPage]="FilterModel.currentPage"
                        [pageSize]="pageSize" [totalCount]="totalCount" [totalPages]="totalPages"></app-pagination> -->
                </div>
            </div>
        </div>
        <!-- <div class="main-card-action py-3 bg-white border-top">
            <button class="btn btn-primary">
                <i class="fas fa-plus-circle"></i>
                <span class="ms-2"> Add New Subscriber</span>
            </button>
        </div> -->
        <div class="table-responsive table-vp-height large-scroll">
            <table class="table table-borderless table-middle table-hover bg-white m-0">
                <thead>
                    <tr>
                        <th>Product</th>
                        <th>Start Date</th>
                        <th>Expiry Date</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let app of subscriberApplications">
                        <td>{{app.applicationName}}</td>

                        <td>
                            <input type="date" (change)="startDateChanged($event,app)"
                                [value]="getFormattedDate(app.startDate)" class="form-control" placeholder="Start Date">

                        </td>
                        <td>
                            <input type="date" (change)="endDateChanged($event,app)"
                                [value]="getFormattedDate(app.endDate)" class="form-control" placeholder="Start Date">

                        </td>
                        <td>
                            <label class="switch me-2">
                                <input type="checkbox" [(ngModel)]="app.isActive" class="ng-valid ng-dirty ng-touched">
                                <span class="slider round"></span>
                            </label>
                            <!-- <div class="d-flex align-items-center justify-content-center">
                                <button class="btn btn-primary btn-rounded me-2">
                                    <i class="fas fa-pen"></i>
                                </button>
                                <button class="btn btn-danger btn-rounded">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </div> -->
                        </td>
                    </tr>
                </tbody>
            </table>
            <app-empty-data [showEmptyData]="!subscriberApplications?.length&&!showLoader"
                [showLoader]="showLoader"></app-empty-data>

            <!-- <div class="d-flex justify-content-end">
                <button [disabled]="showAddLoader" (click)="saveSubscriberApplications()" class="btn btn-primary m-2">
                    <span class="ms-3">Update</span>
                </button>
            </div> -->
        </div>
    </div>
</div>
