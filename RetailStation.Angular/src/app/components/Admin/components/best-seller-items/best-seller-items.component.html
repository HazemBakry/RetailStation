<app-breadcrumb [TitleList]="TitleList"></app-breadcrumb>

<div class="table-card border radius-10 overflow-hidden shadow-sm">
    <div
        class="align-items-center border-bottom d-flex flex-wrap justify-content-between p-2 table-card-title bg-light">
        <div class="d-flex align-items-center gap-2 p-2">
            
        </div>
        <div class="d-flex justify-content-between align-items-center gap-2 p-2">
            <div class="d-flex flex-wrap gap-2">
                 <button [disabled]="showAddLoader" class="btn btn-blue d-flex align-items-center gap-2 px-3" (click)="openConfirmModal(confirmModal)">
                    <i class="ph ph-plus"></i>
                    <span>حفظ التغييرات</span>
                </button>
            </div>
        </div>
    </div>
    <div class="p-3 bg-white">
        <div class="d-flex justify-content-between gap-4 align-items-center align-content-">
            <div class="w-100">
                <app-general-selector [data]="merchantsSelectorData"
                    [disabled]="merchantsSelectorData?.length==0||showLoader" [showSearch]="true"
                    [placeholder]="'Merchants'" (valueChanged)="onMerchantChange($event)">
                </app-general-selector>
                <div class="table-responsive shadow-sm radius-10 mt-2">
                    <table class="table table-card-table table-borderless table-hover bg-transparent m-0">
                        <thead>
                            <tr>
                                <th>الصنف</th>
                                <th>اسم التاجر</th>
                                <th class="text-center"></th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr *ngFor="let item of merchantItems">
                                <td>{{item.merchantItemName}}</td>
                                <td>{{item.merchantName}}</td>
                                <td class="text-center">
                                    <div class="d-flex align-items-center justify-content-center">

                                        <button *ngIf="!item.isBestSellerAdded"
                                            class="button-table-action btn-edit d-flex align-items-center justify-content-center gap-2 me-2"
                                            (click)="addToBestSellerList(item)">
                                            <i class="fas fa-arrow-left"></i>
                                        </button>
                                    </div>
                                </td>
                            </tr>
                            <tr *ngIf="!merchantItemsResponseModel.results.length">
                                <td colspan="6" class="text-right">
                                    <app-empty-data
                                        [showEmptyData]="!merchantItemsResponseModel.results?.length&&!showMerchantLoader"
                                        [showLoader]="showMerchantLoader"></app-empty-data>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div class="p-3 border-top mt-3" style="direction: ltr;">
                    <app-pagination (pageChanged)="pageChanged($event)"
                        [currentPage]="merchantItemsResponseModel.currentPage"
                        [pageSize]="merchantItemsResponseModel.pageSize"
                        [totalCount]="merchantItemsResponseModel.totalCount"></app-pagination>
                </div>
            </div>
            <div class="w-100">
                <div class="table-responsive shadow-sm radius-10">
                    <table class="table table-card-table table-borderless table-hover bg-transparent m-0">
                        <thead>
                            <tr>
                                <th>الصنف</th>
                                <th>اسم التاجر</th>
                                <th class="text-center"></th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr *ngFor="let item of bestSellerItems; let i = index">
                                <td>{{item.merchantItemName}}</td>
                                <td>{{item.merchantName}}</td>
                                <td class="text-center">
                                    <div class="d-flex align-items-center justify-content-center">

                                        <button *ngIf="i !=0"
                                            class="button-table-action btn-edit d-flex align-items-center justify-content-center gap-2 me-2"
                                            (click)="moveItemAndReindex(-1,item)">
                                            <!-- <i class="uil uil-pen"></i> -->
                                            <i class="fas fa-arrow-up"></i> </button>
                                        <button  *ngIf="i !=(bestSellerItems?.length-1)"
                                            class="button-table-action btn-edit d-flex align-items-center justify-content-center gap-2 me-2"
                                            (click)="moveItemAndReindex(1,item)">
                                            <i class="fas fa-arrow-down"></i>
                                        </button>
                                        <button
                                            class="button-table-action btn-edit d-flex align-items-center justify-content-center gap-2 me-2"
                                            (click)="removeFromBestSellerList(item)">
                                            <!-- <i class="uil uil-pen"></i> -->
                                            <i class="fas fa-trash-alt"></i>
                                        </button>
                                    </div>
                                </td>
                            </tr>
                            <tr *ngIf="!bestSellerItems.length">
                                <td colspan="6" class="text-right">
                                    <app-empty-data [showEmptyData]="!bestSellerItems?.length&&!showLoader"
                                        [showLoader]="showLoader"></app-empty-data>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>
</div>

<!-- <ngx-loading [show]="showLoader"></ngx-loading> -->




<ng-template #confirmModal let-modal>
    <div class="modal-header">
        <h4 class="modal-title">تأكيد العملية</h4>
    </div>
    <div class="modal-body">
        <p class="fs-5 m-0" *ngIf="!showAddLoader" >هل انت متأكد من الحفظ ؟</p>
        <p class="fs-5 m-0" *ngIf="showAddLoader">جاري الحفظ ...</p>
    </div>
    <div class="modal-footer justify-content-start">
        <button type="button" [disabled]="showAddLoader" class="btn btn-success"
            (click)="updateBestSellerItems()">
            <i class="fas fa-check"></i>
            <span class="ms-2">نعم</span>
        </button>
        <button type="button" [disabled]="showAddLoader" class="btn btn-danger" (click)="modal.close('Save click')">
            <i class="fas fa-times"></i>
            <span class="ms-2">الغاء</span>
        </button>
    </div>
</ng-template>
<!-- <ngx-loading [show]="showLoader"></ngx-loading> -->
