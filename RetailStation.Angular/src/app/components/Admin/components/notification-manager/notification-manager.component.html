<app-breadcrumb [TitleList]="TitleList"></app-breadcrumb>

<div class="card radius-10 border-0 card-shadow">
    <div class="card-body">
        <div class="main-card-action pb-3">
            <div class="row">
                <div class="col-md-8"></div>
                <div class="col-md-4">
                    <app-pagination (pageChanged)="pageChanged($event)" [currentPage]="currentPage" [pageSize]="pageSize" [totalCount]="totalCount" [totalPages]="totalPages"></app-pagination>
                </div>
            </div>
        </div>
        <div class="main-card-action py-3 bg-white border-top">
            <button class="btn btn-primary" (click)="open(addNotificationModal, null)">
        <i class="fas fa-plus-circle"></i>
        <span class="ms-2">Add Notification</span>
      </button>
        </div>
        <div class="table-responsive table-vp-height large-scroll">
            <table class="table table-bordered table-middle table-hover bg-white m-0">
                <thead>
                    <tr>
                        <th>Title</th>
                        <th>status</th>
                        <th>Created Date</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let item of NotificationData">
                        <td>{{ item.subject }}</td>
                        <td>{{ item.statusName }}</td>
                        <td>{{ item.createdDate | date }}</td>
                        <td>
                            <div class="d-flex align-items-center justify-content-center">
                                <div class="form-check form-switch">
                                    <input class="form-check-input" type="checkbox" role="switch" [checked]="item.isActive" (change)="onToggleStatus(item)" id="flexSwitchCheck{{ item.id }}" />
                                    <label class="form-check-label" [for]="'flexSwitchCheck' + item.id">
                    {{ item.isActive ? "Active" : "Inactive" }}
                  </label>
                                </div>

                                <button class="btn btn-primary me-2" (click)="openEdit(editNotificationModal, item)">
                  <i class="fas fa-edit"></i>
                  <span class="ms-2">Edit</span>
                </button>

                                <button class="btn btn-secondary" (click)="openSidepanel(item)">
                  <i class="far fa-eye"></i>
                  <span class="ms-2">View</span>
                </button>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<ng-template #addNotificationModal let-modal>
    <div class="modal-header">
        <h4 class="modal-title">{{ "Add Notification" }}</h4>
    </div>
    <div class="modal-body bg-light">
        <form [formGroup]="form" autocomplete="off">
            <div class="row">
                <div class="col-lg-6">
                    <div class="form-floating mb-3">
                        <input required type="text" class="form-control" formControlName="title" id="floatingInput" placeholder="name" />
                        <label for="floatingInput">{{ "Title" }}</label>
                    </div>
                </div>
                <div class="col-lg-12">
                    <div class="form-floating mb-3">
                        <input required type="text" class="form-control" formControlName="content" id="floatingInput" placeholder="name" />
                        <label for="floatingInput">{{ "Content" }}</label>
                    </div>
                </div>

                <div class="col-lg-12 mb-3">
                    <label class="form-label">{{ "Recipients" }}</label>
                    <ng-select [items]="customers" bindLabel="name" bindValue="id" [typeahead]="customerSearch$" formControlName="subscriberIds" [multiple]="true" [loading]="loadingCustomers" placeholder="{{'Select recipients'}}">
                    </ng-select>
                </div>
            </div>
        </form>
    </div>
    <div class="modal-footer justify-content-start">
        <button type="button" class="btn btn-primary" (click)="modal.close('Save click'); SaveNotification()">
      <i class="fas fa-save"></i>
      <span class="ms-2">{{ "Save"}}</span>
    </button>

        <button type="button" class="btn btn-danger" (click)="modal.close('Save click')">
      <i class="fas fa-times"></i>
      <span class="ms-2">{{ "Close"}}</span>
    </button>
    </div>
</ng-template>

<ng-template #NotificationDetailsSidePanel let-offcanvas>
    <div class="offcanvas-header pb-0">
        <div>
            <h4 class="offcanvas-title m-0 d-flex align-items-center w-100">
                <i class="fas fa-history fa-2x main-color me-2"></i> Notification Details
            </h4>
        </div>
        <button type="button" class="btn bg-danger text-white rounded" aria-label="Close" (click)="offcanvas.dismiss()">
      <i class="fas fa-times"></i>
    </button>
    </div>
    <div class="offcanvas-body pt-0">
        <hr />
        <div class="mb-3">
            <div class="table-responsive">
                <table class="table table-middle gray-table m-0">
                    <table class="table table-middle bg-light m-0 border">
                        <tbody>
                            <tr>
                                <td class="min-width-160">Title</td>
                                <td class="d-flex align-items-center">
                                    <input type="text" value="{{ notificationDetail?.subject }}" class="form-control me-2" disabled />
                                </td>
                            </tr>
                            <tr>
                                <td class="min-width-160">Content</td>
                                <td class="d-flex align-items-center">
                                    <input value="{{ notificationDetail?.content }}" class="form-control me-2" disabled />
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </table>
            </div>
        </div>
        <div class="offcanvas-title m-0 d-flex align-items-center w-100">
            <h4>Notification Recipients</h4>
        </div>
        <div class="table-responsive sidepanel-table-h large-scroll mb-2">
            <table class="table table-bordered table-middle table-hover bg-white m-0">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Address</th>
                        <th>Phone</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let item of notificationRecipient">
                        <td>
                            <div>{{ item.name }}</div>
                        </td>
                        <td>{{ item.address }}</td>
                        <td>
                            <div>{{ item.phone }}</div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- <div class="offcanvas-title m-0 d-flex align-items-center w-100">
            <h4>Discount Item</h4>
        </div>
        <div class="table-responsive sidepanel-table-h large-scroll">
            <table class="table table-bordered table-middle table-hover bg-white m-0">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Price</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let item of DiscountItems">
                        <td>
                            <div>{{item.nameEn}}</div>
                            <div>{{item.nameAr}}</div>
                        </td>
                        <td>{{item.price}}</td>
                    </tr>
                </tbody>
            </table>
        </div> -->
    </div>
</ng-template>

<ng-template #editNotificationModal let-modal>
    <div class="modal-header">
        <h4 class="modal-title">{{ "Edit Notification"}}</h4>
    </div>
    <div class="modal-body bg-light">
        <form [formGroup]="form" autocomplete="off">
            <div class="row">
                <div class="col-lg-6">
                    <div class="form-floating mb-3">
                        <input required type="text" class="form-control" formControlName="title" id="floatingInput" placeholder="name" />
                        <label for="floatingInput">{{ "Title"}}</label>
                    </div>
                </div>
                <div class="col-lg-12">
                    <div class="form-floating mb-3">
                        <input required type="text" class="form-control" formControlName="content" id="floatingInput" placeholder="name" />
                        <label for="floatingInput">{{ "Content"}}</label>
                    </div>
                </div>

                <div class="col-lg-12 mb-3">
                    <label class="form-label">{{ "Recipients"}}</label>
                    <!-- <ng-select [items]="customers" bindLabel="name" bindValue="id" [typeahead]="customerSearch$" formControlName="subscriberIds" [multiple]="true" [loading]="loadingCustomers" placeholder="{{ 'Select recipients'}}">
                    </ng-select> -->

                    <app-general-selector [(ngModel)]="selectedSponsorId" [selectMulti]="true" [showSearch]="true" (valueChanged)="selectMultiSponsor($event)" [data]="loadingCustomers" [placeholder]="'المشتركين'"></app-general-selector>

                </div>
            </div>
        </form>
    </div>
    <div class="modal-footer justify-content-start">
        <button type="button" class="btn btn-primary" (click)="modal.close('Save click'); UpdateNotification()">
      <i class="fas fa-save"></i>
      <span class="ms-2">{{ "Update"}}</span>
    </button>

        <button type="button" class="btn btn-danger" (click)="modal.close('Save click')">
      <i class="fas fa-times"></i>
      <span class="ms-2">{{ "Close"}}</span>
    </button>
    </div>
</ng-template>

<ngx-loading [show]="showLoader"></ngx-loading>
