<div id="page-wrapper" class="container position-relative p-5 bg-light">

    <div class="row g-4">

        <!-- Left Column -->
        <div class="col-lg-12">
            <!-- Personal Info Card -->
            <div class="card border-0 shadow-sm mb-4">
                <form [formGroup]="formGroup" (ngSubmit)="editUser()">

                    <div class="card-body">
                        <h5 class="card-title fw-bold mb-3 text-primary">المعلومات الشخصية</h5>
                        <div class="d-flex align-items-center mb-4">
                            <img [src]="userModel?.imageUrl || '{{systemURL}}assets/images/default-image.png'" class="rounded-circle border user_image" alt="صورة المستخدم" width="80" height="80" />
                            <div class="position-relative ms-3">
                                <button type="button" class="btn btn-outline-primary d-flex align-items-center gap-2 cursor-pointer" (click)="fileInput.click()">
                                    <i class="fas fa-edit"></i>
                                    تغيير الصورة
                                </button>
                                <span>
                                    {{imageFile ? imageFile.name : ''}}
                                </span>
                                <input type="file" #fileInput accept="image/*" class="d-none" (change)="onFileChange($event)" />
                            </div>
                        </div>


                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">
                                    الاسم الأول (First Name)

                                </label>
                                <input type="text" formControlName="firstName" class="form-control">
                                <div *ngIf="formErrors.firstName" class="text-danger font-small-3 m-03">
                                    {{formErrors.firstName}}
                                </div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">
                                    اسم العائلة (Last Name)

                                </label>
                                <input type="text" formControlName="lastName" class="form-control">
                                <div *ngIf="formErrors.lastName" class="text-danger font-small-3 m-03">
                                    {{formErrors.lastName}}
                                </div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">
                                    البريد الألكتروني (Email)

                                </label>
                                <input type="email" class="form-control" formControlName="email">
                                <div *ngIf="formErrors.email" class="text-danger font-small-3 m-03">
                                    {{formErrors.email}}
                                </div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">
                                    رقم الهاتف (Phone Number)

                                </label>
                                <input type="text" class="form-control" formControlName="phoneNumber">
                                <div *ngIf="formErrors.phoneNumber" class="text-danger font-small-3 m-03">
                                    {{formErrors.phoneNumber}}
                                </div>
                            </div>
                            <!-- <div class="col-md-6">
                            <label class="form-label fw-semibold">
                                                                    العنوان (Address)

                            </label>
                            <input type="text" class="form-control" formControlName="address">
                              <div *ngIf="formErrors.address" class="text-danger font-small-3 m-03">
                                    {{formErrors.address}}
                                </div>
                        </div> -->
                        </div>

                        <div class="text-end mt-4">
                            <button type="submit" [disabled]="showAddLoader" class="btn btn-primary px-4">
                                <span *ngIf="!showAddLoader"> تعديل المعلومات </span>
                                <span *ngIf="showAddLoader">جاري التعديل ...</span>
                            </button>
                        </div>
                    </div>
                </form>

            </div>

            <!-- Security Settings -->
            <div class="card border-0 shadow-sm">
                <div class="card-body">
                    <h5 class="card-title fw-bold mb-3 text-primary">الإعدادات الأمنية</h5>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">اسم المستخدم</label>
                        <input [(ngModel)]="userName" type="text" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">كلمة المرور الحالية</label>
                        <input [(ngModel)]="password" type="password" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">كلمة مرور جديدة</label>
                        <input [(ngModel)]="newPassword" type="password" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">تاكيد كلمة المرور</label>
                        <input [(ngModel)]="confirmPassword" type="password" class="form-control">
                    </div>
                    <!-- <div class="form-check form-switch mb-3">
                        <input class="form-check-input" type="checkbox" id="twoFactor">
                        <label class="form-check-label" for="twoFactor">تفعيل المصادقة الثنائية</label>
                    </div> -->
                    <div class="text-end">
                        <button (click)="changePassword()" class="btn btn-primary px-4">
                            <span *ngIf="!showAddLoader"> حفظ التغييرات </span>
                            <span *ngIf="showAddLoader">جاري التعديل ...</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
