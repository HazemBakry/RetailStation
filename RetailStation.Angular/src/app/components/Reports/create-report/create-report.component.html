<div *ngIf="ContentData.length > 0 && ContentHeaderData.length > 0">
    <div id="ReportData" dir="rtl">
        <table width="100%" border="0" cellspacing="0" cellpadding="0" align="center" bgcolor="#ffffff">
            <tbody>
                <tr style="height: unset;">
                    <td>
                        <table width="1040" border="0" cellspacing="0" cellpadding="0" align="center" bgcolor="" style="max-width: 1040px; min-width: 400px;">
                            <tbody>
                                <tr style="height: unset;">
                                    <td>
                                        <table width="100%" style="margin-bottom: 10px;">
                                            <tbody>
                                                <tr style="height: unset;">
                                                    <td width="80%">
                                                        <table>
                                                            <tbody>
                                                                <tr style="height: unset;">
                                                                    <td style="padding-bottom: 5px;">
                                                                        <font size="3"><strong>{{ReportParams.pageName}}</strong></font>
                                                                    </td>
                                                                </tr>
                                                                <tr style="height: unset;">
                                                                    <td>
                                                                        <table>
                                                                            <tr style="height: unset;">
                                                                                <td>
                                                                                    <font size="2"><strong>شارع الملك خالد،تقاطع 10، حي الخبر الشمالية، الخبر</strong></font>
                                                                                </td>
                                                                            </tr>
                                                                            <tr style="height: unset;">
                                                                                <td>
                                                                                    <font size="2"><strong>الحساب:</strong> الأصول </font>
                                                                                </td>
                                                                            </tr>
                                                                            <tr style="height: unset;">
                                                                                <td>
                                                                                    <font size="2"><strong>من تاريخ:</strong> {{FromDate | date}} </font>
                                                                                </td>
                                                                            </tr>
                                                                            <tr style="height: unset;">
                                                                                <td>
                                                                                    <font size="2"><strong>الى تاريخ:</strong> {{ToDate | date}} </font>
                                                                                </td>
                                                                            </tr>
                                                                        </table>
                                                                    </td>
                                                                </tr>
                                                            </tbody>
                                                        </table>
                                                    </td>
                                                    <td width="20%" align="left">
                                                        <table>
                                                            <tbody>
                                                                <tr style="height: unset;">
                                                                    <td><img id="ReportImage" src="../../../../assets/images/av-1.png" style="height: 70%; max-width: 100%; width: 100px;"></td>
                                                                </tr>
                                                                <!-- <tr style="height: unset;">
                                                                    <td style="padding-top: 10px;">
                                                                        <font size="2"><strong>Current date</strong><span style="margin: 0 15px;">|</span> 30 June 2024 </font>
                                                                    </td>
                                                                </tr> -->
                                                            </tbody>
                                                        </table>
                                                    </td>
                                                </tr>
                                            </tbody>
                                        </table>
                                        <table cellpadding="5" cellspacing="0" width="100%" style="border-collapse: collapse; text-align: center;">
                                            <thead>
                                                <tr style="background-color: #eee;">
                                                    <th *ngFor="let header of ContentHeaderData">{{header.propDisName}}</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                <tr *ngFor="let item of ContentData">
                                                    <td style="border: 1px solid #eee;" *ngFor="let header of ContentHeaderData">{{item[header.propKey]}}</td>
                                                </tr>
                                            </tbody>
                                            <tfoot *ngIf="ContentHeaderData.length > 0">
                                                <tr style="height: unset;">
                                                    <td [attr.colspan]="ContentHeaderData.length" style="border: 1px solid #eee;">&nbsp;</td>
                                                </tr>
                                                <tr style="font-weight: bold;">
                                                    <td style="border: 1px solid #eee;">أجمالي دائن</td>
                                                    <td [attr.colspan]="ContentHeaderData.length - 1" align="right" style="border: 1px solid #eee; background-color: #eee;">5800 ر.س</td>

                                                </tr>
                                                <tr style="font-weight: bold;">
                                                    <td style="border: 1px solid #eee;">أجمالي مدين</td>
                                                    <td [attr.colspan]="ContentHeaderData.length - 1" align="right" style="border: 1px solid #eee; background-color: #eee;">4800 ر.س</td>

                                                </tr>
                                            </tfoot>
                                        </table>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
