<app-breadcrumb [TitleList]="TitleList"></app-breadcrumb>

<div class="inputs-wrapper border rounded bg-white mb-3">
    <div class="inputs-sec-title fw-semibold fs-16 px-3 py-2 border-bottom mb-2"> تقرير الموظفين
    </div>

    <div class="card-body">
        <div class="row  py-3 px-3">
            <div class="col-lg-3">
                <div class="mb-2">
                    <label class="form-label d-flex align-items-center gap-2">
                        من تاريخ
                        <span class="text-danger">*</span>
                    </label>
                    <input [(ngModel)]="fromDate" type="date" autocomplete="off" class="form-control nw-form-input" />
                </div>
            </div>
            <div class="col-lg-3">
                <div class="mb-2">
                    <label class="form-label d-flex align-items-center gap-2">
                        الي تاريخ
                        <span class="text-danger">*</span></label>
                    <input [(ngModel)]="toDate" type="date" autocomplete="off" class="form-control nw-form-input" />
                </div>
            </div>
        </div>

        <div class="inputs-sec-title fw-semibold fs-16 px-3 mb-3">
            <button class="btn btn-primary me-2" (click)="searchData()">
                <i class="fas fa-search"></i>
                <span class="ms-2">بحث</span>
            </button>
            <button [disabled]="showExportLoader" (click)="exportData()" class="btn  btn-outline-success gap-2 border rounded px-3 me-2">
                <i class="fas fa-file-download"></i>
                <span>تصدير CSV</span>
            </button>
            <!-- <button (click)="printData()" class="btn btn-table-action  gap-2 border rounded px-3 me-2">
            <i class="fas fa-print fs-7"></i>
            <span>طباعة</span>
        </button>
        <button class="btn btn-secondary me-2" (click)="printData()">
            <i class="fas fa-print"></i>
            <span class="ms-2">طباعة</span>
        </button> -->
        </div>
    </div>


    <div class="inputs-sec-content px-3 border-top">
        <div class="row gy-3 py-3">
            <ng-container>
                <app-erp-filters [FilterList]="filterList" (filterChanged)="filterChecked($event)" [searchPlaceholder]="'البحث بالاسم , الرقم الوظيفى ...'"></app-erp-filters>
            </ng-container>
        </div>
    </div>
</div>

<div class="inputs-wrapper border rounded bg-white mb-3">

    <div class="px-3 py-3 mb-2">
        <app-erp-pagination (pageChanged)="pageChanged($event)" [currentPage]="pagedResponseModel.currentPage" [pageSize]="pagedResponseModel.pageSize" [totalCount]="pagedResponseModel.totalCount"></app-erp-pagination>
    </div>

    <div class="table-responsive shadow-sm radius-10">
        <table class="table table-card-table table-borderless table-middle table-hover bg-transparent m-0 table-vp-height">
            <thead class="table-light">
                <tr>
                    <th>الرقم الوظيفى</th>
                    <th>اسم الموظف</th>
                    <th>رقم الهوية</th>
                    <th>الفرع</th>
                    <th>الجنسية</th>
                    <th>اسم المؤسسة</th>
                    <th>الوظيفة</th>
                    <th>الحالة</th>
                    <th>تاريخ الإضافة</th>
                    <th class="text-center"></th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let item of pagedResponseModel.results">
                    <td>{{item.code}}</td>
                    <td>{{item.fullNameAR}}</td>
                    <td>{{item.iqamaNumber}}</td>
                    <td>{{item.branchNameAR}}</td>
                    <td>{{item.nationalityNameAR}}</td>
                    <td>{{item.SponsorNameAR}}</td>
                    <td>{{item.jobNameAR}}</td>
                    <td>
                        <span appWorkflowStatus [id]="item.statusId" [nameAR]="item?.employeeStatusNameAR" [nameEN]="item?.employeeStatusNameEN" [type]="'employeeStatus'">
                        </span>
                    </td>
                    <td>{{item.createdDate | date:'yyyy-MM-dd'}}</td>
                    <td>
                        <div class="d-flex align-items-center justify-content-center">
                            <div ngbDropdown container="body">
                                <button class="btn-sm-action sm-action-dropdown" (click)="goToEmployeeDetails(item.employeeId)">
                                    <i class="fas fa-ellipsis-v"></i>
                                </button>
                            </div>
                        </div>
                    </td>
                </tr>
                <tr *ngIf="!pagedResponseModel.results.length">
                    <td colspan="9" class="text-right">
                        <app-empty-data [showEmptyData]="!pagedResponseModel.results.length"></app-empty-data>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
