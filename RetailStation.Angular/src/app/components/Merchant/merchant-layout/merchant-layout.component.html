<div class="p-4 gradient-nw-wrraper-bg">

    <app-header></app-header>

    <main class="main-design-wrapper pt-3">
        <div class="d-flex">

            <aside id="main-sidebar" class="nw-sidebar-wrapper mt-3" [class.is-toggle]="isToggle">
                <button class="sidebar-button-collapser" (click)="onToggleContent()">
                        <i class="uil uil-angle-left"></i>
                    </button>

                <!-- <div class="d-flex justify-content-center p-3 border-bottom">
                        <img src="../../../../../assets/images/av-7.png" class="tour-logo-image" loading="lazy" alt="tour-package" />
                    </div> -->
                <div *ngIf="menuItem && menuItem.subMenus?.length >0" class="p-2">
                    <div class="sidebar-scrolling small-scroll d-flex flex-column gap-3 nw-sidebar-height">
                        <section *ngFor="let item of menuItem.subMenus" class="d-flex flex-column gap-4">
                            <h4 class="nw-sidebar-title cursor-pointer mb-0">
                                {{item.displayName}}
                            </h4>

                            <!-- <ul class="nw-sidebar-list list-unstyled p-0 m-0 d-flex flex-column gap-3"> -->
                            <ul class="list-unstyled sidebar-list d-flex flex-column gap-2 m-0 border-top">
                                <li *ngFor="let sub of item.subMenus" class="tour-package-item">
                                    <a class="sidebar-link d-flex align-items-center gap-3" [routerLink]="sub.route" routerLinkActive="active">
                                        <div class="nw-sidebar-icon">
                                            <i [class]="sub.icon"></i>
                                        </div>
                                        <div class="sidebar-link-text">{{sub.displayName}}</div>
                                    </a>
                                </li>
                            </ul>
                        </section>

                    </div>
                </div>
            </aside>


            <div class="main-general-account-content py-3">
                <router-outlet></router-outlet>
            </div>
        </div>

        <div id="overlaying-element" class="cursor-pointer" [class.show]="isToggle" (click)="onOverlayClicked()">
        </div>
    </main>

</div>
