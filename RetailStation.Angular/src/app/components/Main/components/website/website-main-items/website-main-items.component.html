<div class="container-fluid py-5">
    <div class="row">
        <div class="col-xl-2">


            <app-website-filters [FilterList]="filterList" (filterChanged)="filterChecked($event)"
                [searchPlaceholder]="'البحث  ...'"></app-website-filters>

        </div>
        <div class="col-xl-10 pe-4">
            <h3 class="d-flex align-items-end mb-4">
                <span class="ms-2">مطعم</span>
            </h3>
            <div class="row">

                <div *ngFor="let item of suppliersData" class="col-md-6 col-xl-4">
                    <div class="resturant-card px-2 pt-3 pb-4 mb-4 cursor-pointer">
                        <div class="card-inner">
                            <div class="card-slider">
                                <a class="card-img-box d-block position-relative">
                                    <img [src]="item.imageUrl" alt="order-img"
                                        (error)="$event.target.src = defaultItemImage" />
                                    <div class="highlight-text order-highlight">
                                        <h6 class="m-0">{{item.description}}</h6>
                                    </div>
                                </a>
                            </div>
                            <div class="card-content mt-3">
                                <div class="card-content-info d-flex mb-3">
                                    <div class="card-content-img">
                                        <img [src]="supplierLogo" alt="restaurant-logo" />
                                    </div>
                                    <div class="me-2 w-100">
                                        <div class="foods-title d-flex align-items-center justify-content-between">
                                            <a class="m-0 fw-bold" style="color: black;">{{item.nameAR}}</a>
                                            <div class="d-flex align-items-center">
                                                <app-rate></app-rate>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="offer-box align-items-center text-center"
                                    style="height: 40px;padding-top: 10px;">
                                    <a class="me-2" style="color: #4caf50;">اوردر أونلاين</a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
