<div class="container pt-4">
    <div class="card shadow">
        <div class="card-header main-bg text-white fs-4 py-3">
            <div class="d-flex align-items-center">
                <i class="fas fa-share-square ms-3"></i>
                <span>اشترك معنا</span>
            </div>
        </div>
        <div class="card-body bg-light">
            <form [formGroup]="formGroup" autocomplete="off">

                <div class="mb-3">
                    <label class="form-label fs-6">الأسم</label>
                    <div class="form-floating">
                        <input type="text" formControlName="subscriberName" class="form-control" id="floatingInput1"
                            placeholder="name@example.com">
                        <label for="floatingInput1">الأسم</label>
                    </div>
                    <div *ngIf="formErrors.subscriberName" class="text-danger  font-small-3 m-03">
                        {{formErrors.subscriberName}}
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label fs-6">السجل التجاري</label>
                    <div class="form-floating">
                        <input type="email" formControlName="commercialRegister" class="form-control"
                            id="floatingInput2" placeholder="name@example.com">
                        <label for="floatingInput2">السجل التجاري</label>
                    </div>
                    <div *ngIf="formErrors.commercialRegister" class="text-danger  font-small-3 m-03">
                        {{formErrors.commercialRegister}}
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label fs-6">رقم الهاتف</label>
                    <div class="form-floating">
                        <input type="tel" formControlName="phoneNumber" class="form-control" id="floatingInput3"
                            placeholder="name@example.com">
                        <label for="floatingInput3">رقم الهاتف</label>
                    </div>
                    <div *ngIf="formErrors.phoneNumber" class="text-danger  font-small-3 m-03">
                        {{formErrors.phoneNumber}}
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label fs-6">البريد الالكتروني</label>
                    <div class="form-floating">
                        <input type="text" formControlName="email" class="form-control" id="floatingInput4"
                            placeholder="name@example.com">
                        <label for="floatingInput4">البريد الالكتروني</label>
                    </div>
                    <div *ngIf="formErrors.email" class="text-danger  font-small-3 m-03">
                        {{formErrors.email}}
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label fs-6">نوع الاشتراك</label>
                    <div class="form-floating">
                        <div class="d-flex flex-wrap gap-3">
                            <div class="form-check">
                                <input class="form-check-input" type="radio" formControlName="subscriberTypeId"
                                    id="customerRadio" [value]="SubscriberType.Customer">
                                <label class="form-check-label" for="customerRadio">عميل</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" formControlName="subscriberTypeId"
                                    id="supplierRadio" [value]="SubscriberType.Supplier">
                                <label class="form-check-label" for="supplierRadio">مورد</label>
                            </div>
                        </div>
                    </div>
                    <div *ngIf="formErrors.subscriberTypeId" class="text-danger  font-small-3 m-03">
                        {{formErrors.subscriberTypeId}}
                    </div>
                </div>
                <div class="line-seperate bg-light"></div>
                <button (click)="saveSubscribeRequestData() " type="button"
                    class="btn btn-lg w-100 btn-danger main-bg text-white text-center">
                    تسجيل الطلب
                </button>
            </form>
        </div>
    </div>
</div>
