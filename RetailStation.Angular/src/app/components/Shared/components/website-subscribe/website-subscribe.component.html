<div class="container pt-4">
    <div class="card shadow">
        <div class="card-header main-bg text-white fs-4 py-3">
            <div class="d-flex align-items-center">
                <i class="fas fa-share-square ms-3"></i>
                <span>اشترك معنا</span>
            </div>
        </div>
        <div class="card-body bg-light">
            <div class="mb-3">
                <label class="form-label fs-6">اسم المطعم</label>
                <div class="form-floating">
                    <input type="text" class="form-control" [(ngModel)]="Name" id="floatingInput1"
                        placeholder="name@example.com">
                    <label for="floatingInput1">اسم المطعم</label>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label fs-6">السجل التجاري</label>
                <div class="form-floating">
                    <input type="email" class="form-control" id="floatingInput2" placeholder="name@example.com"
                        disabled>
                    <label for="floatingInput2">السجل التجاري</label>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label fs-6">رقم الهاتف</label>
                <div class="form-floating">
                    <input type="number" class="form-control" [(ngModel)]="Phone" id="floatingInput3"
                        placeholder="name@example.com">
                    <label for="floatingInput3">رقم الهاتف</label>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label fs-6">البريد الالكتروني</label>
                <div class="form-floating">
                    <input type="number" class="form-control" id="floatingInput4" placeholder="name@example.com"
                        disabled>
                    <label for="floatingInput4">البريد الالكتروني</label>
                </div>
            </div>
            <div class="line-seperate bg-light"></div>
            <button type="button" class="btn btn-lg w-100 btn-danger main-bg text-white"
                (click)="AddNewSubscriber()">تسجيل
                الطلب</button>
        </div>
    </div>
</div>

<ngx-loading [show]="showLoader"></ngx-loading>
