<ng-template #DetailsSidePanel let-offcanvas>
    <div class="offcanvas-header justify-content-between gap-3 fs-4 border-bottom py-3">
        <div class="d-flex align-items-center gap-2">
            <i class="fas fa-store offcanvas-header-icon"></i>
            <span>{{title}}</span>
        </div>
        <div class="cursor-pointer text-danger fs-2" (click)="offcanvas.dismiss()">
            <i class="uil uil-times-circle"></i>
        </div>
    </div>
    <div class="offcanvas-body pt-4 bg-light">
        <div *ngIf="detailsModel" class="employee-card-body mb-3">
            <div class="inputs-wrapper border rounded bg-white mb-3">
                <div class="inputs-sec-content px-3 py-3">
                    <div class="row gy-3">
                        <div class="col-lg-6">
                            <div class="mb-2">
                                <label class="form-label d-flex align-items-center gap-2">رقم الطلب</label>
                                <input type="text" disabled class="form-control nw-form-input"
                                    [value]="detailsModel?.serialNumber??detailsModel?.orderNumber" />
                            </div>
                        </div>
                        <div *ngIf="detailsModel?.orderDate" class="col-lg-6">
                            <div class="mb-2">
                                <label class="form-label d-flex align-items-center gap-2">تاريخ الطلب</label>
                                <input type="text" disabled class="form-control nw-form-input"
                                    [value]="detailsModel?.orderDate | date" />
                            </div>
                        </div>
                        <div *ngIf="detailsModel?.supplierNameAR" class="col-lg-6">
                            <div class="mb-2">
                                <label class="form-label d-flex align-items-center gap-2">المورد</label>
                                <input type="text" disabled class="form-control nw-form-input"
                                    [value]="detailsModel?.supplierNameAR" />
                            </div>
                        </div>
                        <div *ngIf="detailsModel?.storeNameAR" class="col-lg-6">
                            <div class="mb-2">
                                <label class="form-label d-flex align-items-center gap-2">المخزن</label>
                                <input type="text" disabled class="form-control nw-form-input"
                                    [value]="detailsModel?.storeNameAR" />
                            </div>
                        </div>
                        <div *ngIf="detailsModel?.totalValue" class="col-lg-12">
                            <div class="mb-2">
                                <label class="form-label d-flex align-items-center gap-2">
                                    الاجمالي
                                </label>
                                <input type="text" disabled class="form-control nw-form-input description-area"
                                    [value]="detailsModel?.totalValue" />
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>

        <hr class="border-black" />

        <div class="inputs-wrapper border rounded bg-white mb-3">
            <div class="inputs-sec-title fw-semibold fs-16 px-3 py-2 border-bottom mb-2">الاصناف</div>
            <div class="inputs-sec-content px-3 py-2 table-responsive table-vp-height small-scroll">
                <table *ngIf="dataFields?.length >0"
                    class="table table-bordered table-middle text-center table-actions m-0">
                    <thead>
                        <tr>
                            <th *ngFor="let field of dataFields">{{field.displayName ?? field.fieldName}}</th>

                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let product of productList; let i = index">

                            <td *ngFor="let field of dataFields">
                                <app-render *ngIf="getFieldValue(product,field) as item" [value]="item"
                                    [fieldType]="field.fieldType">
                                </app-render>
                            </td>

                        </tr>
                        <tr *ngIf="!productList?.length">
                            <td [colspan]="dataFields?.length" class="text-right">
                                <app-empty-data [showEmptyData]="!productList?.length"></app-empty-data>
                            </td>
                        </tr>
                    </tbody>

                </table>



            </div>
        </div>

    </div>

</ng-template>
