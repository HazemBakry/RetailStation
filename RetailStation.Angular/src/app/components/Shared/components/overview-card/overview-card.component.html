<div class="col">
    <div class="card card-shadow border-0 card-radius overflow-hidden static-card {{ data.color }}">
        <div class="card-body p-4">
            <div class="d-flex flex-column gap-3">
                <div class="d-flex align-items-center gap-3">
                    <div class="card-icon">
                        <i class="fas {{ data.statusIcon }}"></i>
                    </div>
                    <div class="card-text">{{ data.title }}</div>
                </div>
                <div class="card-number fs-1 fw-medium">{{ data.number }}</div>
            </div>
        </div>
        <div class="card-footer border-0 py-3">
            <div class="d-flex align-items-center justify-content-between fs-14">
                <div class="footer-text">{{ data.details }}</div>
                <div class="footer-icon">
                    <i class="fa-solid {{ data.statusIcon }}"></i>
                </div>
            </div>
        </div>
    </div>
</div>
