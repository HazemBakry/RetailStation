<div class="product-card bg-white border rounded-3 shadow-sm p-3 h-100 d-flex flex-column justify-content-between" [class.is-fav]="item.isFavorite">

    <div *ngIf="item.isBestSellerItem" class="best-seller-tag">
        Best Seller
    </div>

    <!-- <i *ngIf="isAuthenticated" class="{{ item.isFavorite ? 'ph-fill ph-heart' : 'ph ph-heart' }} cursor-pointer like-product-icon" (click)="toggleFavorite(item)" [style.color]="item.isFavorite ? '#86ee02d9' : ''"></i> -->

    <!-- Top Section: Image + Info -->
    <div class="d-flex gap-3">
        <!-- Product Image -->
        <div class="product-image flex-shrink-0">
            <img [src]="item.imageUrl" (error)="$event.target.src = defaultImage" alt="product" class="rounded-3 img-fluid" />
        </div>

        <!-- Product Info -->
        <div class="d-flex flex-column justify-content-between w-100">
            <div>
                <h6 class="fw-semibold mb-1 text-truncate">{{ item.nameAR }}</h6>
                <p class="text-muted small mb-2">{{ item.description || 'وصف المنتج غير متوفر' }}</p>
                <div class="d-flex align-items-center gap-2">
                    <i class="ph ph-storefront text-muted"></i>
                    <span class="text-muted small fw-semibold">{{ item.merchantName }}</span>
                </div>
            </div>

            <div>
                <app-rate [value]="item.merchantRate"></app-rate>
            </div>

            <div class="d-flex align-items-center gap-2">
                <i class="ph ph-chart-line-down text-muted"></i>
                <div class="d-flex align-items-center gap-1 text-muted">الحد الأدني للطلب:
                    <span class="fw-bold">{{item.minimumOrderQuantity ?? 1}}</span>
                </div>
            </div>

            <!-- Price -->
            <div class="mt-2">
                <div class="d-flex align-items-center gap-2">
                    <div class="fw-bold fs-5 text-danger">{{ item.offerPrice ? item.offerPrice : item.price }}</div>
                    <img src="{{systemURL}}assets/ryal-black-icon.svg" class="ryial-img" alt="ryal-icon" />
                    <div *ngIf="item.offerPrice" class="text-decoration-line-through text-muted small">
                        {{ item.price }}
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bottom Section: Actions -->
    <div class="mt-3 d-flex align-items-center justify-content-between">
        <button (click)="addToCart()" class="btn btn-success d-flex align-items-center gap-2 flex-fill justify-content-center">
            <i class="ph ph-shopping-cart"></i>
            <span>أضف للعربة</span>
        </button>

        <!-- <button (click)="toggleCompare(item)"
            class="btn d-flex align-items-center gap-2 flex-fill justify-content-center ms-2">
            <i class="ph ph-git-diff"></i>
            <span *ngIf="!item.isCompareAdded">مقارنة</span>
            <span *ngIf="item.isCompareAdded">حذف المقارنة</span>
        </button> -->

        <button (click)="toggleCompare(item)" class="btn btn-add-compare d-flex align-items-center gap-2">
            <i class="ph ph-git-diff fs-6"></i>
            <div>
                <span *ngIf="!item.isCompareAdded">مقارنة</span>
                <span *ngIf="item.isCompareAdded" style="font-size: 12px;"> حذف المقارنة</span>
            </div>
        </button>
    </div>
</div>
