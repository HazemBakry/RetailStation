<div class="d-flex align-items-center justify-content-between gap-3">

    <div class="input-search-with-dropdown d-flex align-items-center position-relative" role="search">
        <div ngbDropdown class="dropdown-search px-3">
            <a class="dropdown-search-link sm-action-dropdown" ngbDropdownToggle>
                <span>{{selectedCategory?.nameAR ?? 'كل الفئات'}}</span>
                <i class="ph ph-caret-down dropdown-arrow m-0"></i>
            </a>
            <div class="dropdown-search-menu p-0" ngbDropdownMenu>
                <div (click)="onCategorySelected(null)" [class.active]="!selectedCategory"
                    class="d-flex align-items-center gap-2 cursor-pointer py-3 white-space-nowrap border-bottom-not-last"
                    ngbDropdownItem>
                    <div class="drop-image-box">
                        <img src="{{systemUrl}}assets/meat.svg" alt="drop-icon" loading="lazy" />
                    </div>
                    <div>كل الفئات</div>
                </div>
                <ng-container *ngFor="let cat of categories">
                    <div (click)="onCategorySelected(cat)"
                        [class.active]="selectedCategory?.itemCategoryId == cat.itemCategoryId"
                        class="d-flex align-items-center gap-2 cursor-pointer py-3 white-space-nowrap border-bottom-not-last"
                        ngbDropdownItem>
                        <div class="drop-image-box">
                            <img [src]="cat.imageUrl" (error)="$event.target.src = defaultImage" alt="drop-icon"
                                loading="lazy" />
                        </div>
                        <div>{{cat?.nameAR}}</div>
                    </div>
                </ng-container>
                <!-- <div class="d-flex align-items-center gap-2 cursor-pointer py-3 white-space-nowrap border-bottom-not-last" ngbDropdownItem>
                                    <div class="drop-image-box">
                                        <img src="{{systemUrl}}assets/vegitables.svg" alt="drop-icon" loading="lazy" />
                                    </div>
                                    <div>خضار وفواكه</div>
                                </div>
                                <div class="d-flex align-items-center gap-2 cursor-pointer py-3 white-space-nowrap border-bottom-not-last" ngbDropdownItem>
                                    <div class="drop-image-box">
                                        <img src="{{systemUrl}}assets/chesse.svg" alt="drop-icon" loading="lazy" />
                                    </div>
                                    <div>اجبان</div>
                                </div> -->
            </div>
        </div>
        <div class="dropdown-search-input-box position-relative">
            <i class="ph ph-magnifying-glass dropdown-search-input-icon" (click)="search()"></i>
            <div ngbDropdown>
                <input (keydown.enter)="search()" type="search" [(ngModel)]="searchText"
                    (input)="getSearchAutoComplete($event)" class="dropdown-search-input form-control"
                    [placeholder]="placeholder" aria-label="Search" ngbDropdownToggle />
                <div class="dropdown-search-menu w-100 p-0" ngbDropdownMenu>
                    <ng-container *ngIf="searchResults.length == 0 && searchText?.length>2">
                        <div class="d-flex align-items-center justify-content-center py-3">
                            لا توجد نتائج
                        </div>
                    </ng-container>
                    <ng-container *ngIf="searchResults.length>0">
                        <div *ngFor="let item of searchResults" (click)="navigateToSearchPage(item)"
                            class="d-flex align-items-center gap-2 cursor-pointer border-bottom-not-last"
                            ngbDropdownItem>
                            <img [src]="item.imageUrl" (error)="$event.target.src = defaultImage" class="search-img"
                                alt="search-image" loading="lazy" />
                            <div class="d-flex flex-column gap-1">
                                <div class="fw-semibold">{{item.nameAR ?? item.nameEN}}</div>
                                <div class="d-flex align-items-center gap-3">
                                    <div class="d-flex align-items-center gap-2">
                                        <div class="text-danger fw-bold fs-4">{{item.price}}
                                        </div>
                                        <img src="{{systemURL}}assets/ryal-black-icon.svg" class="ryial-img"
                                            alt="ryal-icon" loading="lazy" />
                                    </div>
                                    <div *ngIf="item.oldPrice" class="d-flex align-items-center gap-2 line-through">
                                        <div class="text-danger fw-bold fs-4">{{item.oldPrice}}</div>
                                        <img src="{{systemURL}}assets/ryal-gray-icon.svg" class="ryial-img"
                                            alt="ryal-icon" loading="lazy" />
                                    </div>
                                    <!-- <button class="btn btn-bdage-danger py-1 px-3">Sale 20%</button> -->
                                </div>
                            </div>
                        </div>
                    </ng-container>

                </div>
            </div>
        </div>
    </div>
    <div class="d-flex align-items-center justify-content-between gap-3">
        <div *ngIf="citiesSelectorData.length > 0 && selectedCountry" ngbDropdown
            class="dropdown-search input-search-with-dropdown border-0 px-3 h-100 d-flex align-items-center">
            <a class="dropdown-search-link sm-action-dropdown border-0" ngbDropdownToggle>
                <i class="ph ph-map-pin fs-5"></i>
                <span>{{selectedCity?.name ?? 'كل المدن'}}</span>
                <i class="ph ph-caret-down dropdown-arrow m-0"></i>
            </a>
            <div class="dropdown-search-menu p-0" ngbDropdownMenu>
                <div class="d-flex align-items-center gap-2 cursor-pointer py-3 white-space-nowrap border-bottom-not-last"
                    (click)="onCitySelected(null)" [class.active]="!selectedCity" ngbDropdownItem>
                    <i class="ph ph-map-pin"></i>
                    <div>كل المدن</div>
                </div>
                <div *ngFor="let city of citiesSelectorData"
                    class="d-flex align-items-center gap-2 cursor-pointer py-3 white-space-nowrap border-bottom-not-last"
                    (click)="onCitySelected(city)" [class.active]="selectedCity?.value == city.value" ngbDropdownItem>
                    <i class="ph ph-map-pin"></i>
                    <div>{{city.name}}</div>
                </div>

            </div>
        </div>
        <div *ngIf="countriesSelectorData.length > 0" ngbDropdown
            class="dropdown-search input-search-with-dropdown border-0 px-3 h-100 d-flex align-items-center">
            <a class="dropdown-search-link sm-action-dropdown border-0" ngbDropdownToggle>
                <i class="ph ph-map-pin fs-5"></i>
                <span>{{selectedCountry?.name ?? 'كل الدول'}}</span>
                <i class="ph ph-caret-down dropdown-arrow m-0"></i>
            </a>
            <div class="dropdown-search-menu p-0" ngbDropdownMenu>
                <div class="d-flex align-items-center gap-2 cursor-pointer py-3 white-space-nowrap border-bottom-not-last"
                    (click)="onCountySelected(null)" [class.active]="!selectedCountry" ngbDropdownItem>
                    <i class="ph ph-map-pin"></i>
                    <div> كل الدول</div>
                </div>
                <div *ngFor="let country of countriesSelectorData"
                    class="d-flex align-items-center gap-2 cursor-pointer py-3 white-space-nowrap border-bottom-not-last"
                    (click)="onCountySelected(country)" [class.active]="selectedCountry?.value == country.value"
                    ngbDropdownItem>
                    <i class="ph ph-map-pin"></i>
                    <div>{{country.name}}</div>
                </div>

            </div>
        </div>

    </div>
</div>
