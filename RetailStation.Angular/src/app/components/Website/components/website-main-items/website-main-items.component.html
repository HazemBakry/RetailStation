<section *ngIf="!searchText&&!itemCategoryId" class="marketing-category-section">
    <div class="carousel-title d-flex align-items-center gap-2 position-relative mb-3">
        <img src="../../../../../assets/strong-offet-icon-2.svg" class="header-offer-icon" alt="offer-icon" loading="lazy" />
        <div class="fw-semibold fs-18">الأكثر مبيعا</div>
    </div>
    <swiper class="medium-carousel-swiper navigator-with-head h-auto" [slidesPerView]="1" [spaceBetween]="10" [navigation]="true" [pagination]="false" [slidesPerGroup]="1" [autoplay]="{ delay: 350000000000, disableOnInteraction: false }" [loop]="true" [breakpoints]="{
        '0': {
          slidesPerView: 1
        },
        '575': {
          slidesPerView: 2
        },
        '767': {
          slidesPerView: 3
        },
        '1024': {
          slidesPerView: 3
        },
        '1200': {
          slidesPerView:4
        }
      }">
        <ng-container *ngFor="let item of bestSellerData;let i =index">
            <ng-template swiperSlide>
                <app-website-item-card [item]="item" [isAuthenticated]="isAuthenticated"></app-website-item-card>
            </ng-template>
        </ng-container>
    </swiper>
</section>


<div class="container-fluid py-3">
    <div class="row">
        <div class="col-xl-2">


            <app-website-filters [FilterList]="filterList" (filterChanged)="filterChecked($event)" [searchPlaceholder]="'البحث  ...'"></app-website-filters>

        </div>
        <div class="col-xl-10 pe-4">
            <h3 class="d-flex align-items-end mb-4">
                <span class="ms-2" *ngIf="!searchText&&!itemCategoryId">الأصناف</span>
                <span class="ms-2" *ngIf="searchText||itemCategoryId">{{selectedCategoryName ? selectedCategoryName : 'نتائج البحث'}}</span>
            </h3>
            <div class="row">

                <div *ngFor="let item of merchantsData;let i =index" class="col-md-6 col-xl-3 mb-2">
                    <app-website-item-card [item]="item" [isAuthenticated]="isAuthenticated"></app-website-item-card>
                </div>
            </div>

            <app-pagination (pageChanged)="pageChanged($event)" [currentPage]="pageResponseModel.currentPage" [pageSize]="pageResponseModel.pageSize" [totalCount]="pageResponseModel.totalCount" style="direction: ltr; margin: 15px;">
            </app-pagination>

        </div>
    </div>
</div>
