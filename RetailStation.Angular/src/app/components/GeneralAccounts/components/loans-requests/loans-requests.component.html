    <div class="p-3 bg-white">
        <div class="table-responsive shadow-sm radius-10">
            <table class="table table-card-table table-borderless table-middle table-hover bg-transparent m-0">
                <thead>
                    <tr>
                        <th>رقم السلفة</th>
                        <th>اسم المستفيد</th>
                        <th>تاريخ الطلب</th>
                        <th>قيمة السلفة</th>
                        <th>القسط الشهري</th>
                        <th>نوع السلفة</th>
                        <th>حالة الطلب</th>
                        <th class="text-center"></th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let item of LoanList.results">
                        <td>{{item.loanId}}</td>
                        <td>{{item.employeeName}}</td>
                        <td>{{item.createdDate | date}}</td>
                        <td>{{item.loanAmount}}</td>
                        <td>{{item.paymentAmount }}</td>
                        <td>{{item.loanTypeName}}</td>
                        <td>
                            <span appWorkflowStatus [id]="item.workflowStatusId" [nameEN]="item?.workflowStatusNameEN" [nameAR]="item?.workflowStatusNameAR">
                            </span>
                        </td>
                        <td>
                            <div class="d-flex align-items-center justify-content-center">
                                <div ngbDropdown container="body">
                                    <button class="btn-sm-action sm-action-dropdown" ngbDropdownToggle>
                                        <i class="fas fa-ellipsis-v"></i>
                                    </button>
                                    <div ngbDropdownMenu class="border">
                                        <button ngbDropdownItem (click)="cancelPaymentReceipt(item.receiptId)">اسقاط</button>
                                        <button *ngIf="item.entryId" ngbDropdownItem routerLink="/general-accounts/new-entry" [queryParams]="{JournalEntryId:item.entryId}">معاينة القيد</button>
                                    </div>
                                </div>
                            </div>
                            <!-- <div class="w-100 d-flex align-items-center justify-content-center">

                        </td>

                    <tr *ngIf="!LoanList.results.length">
                        <td colspan="9" class="text-right">
                            <app-empty-data [showEmptyData]="!ReceiptList.results.length"></app-empty-data>
                        </td>
                    </tr>

<ngx-loading [show]="showLoader"></ngx-loading>
